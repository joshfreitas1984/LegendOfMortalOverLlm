    translated: "As for the Heavenly Emperor's Sword, its blade is made from the stone city of Yanxi, its guard from Qi Dai, its spine from Jin Wei, its hilt from Zhou Song, and its side guards from Han Wei. It is encased in the four barbarians, wrapped in the four seasons, surrounded by the Bohai Sea, and bound by the Changshan Mountains. It is constructed with the Five Elements, discussed with punishment and virtue, opened with Yin and Yang, held with Spring and Autumn, and moved with Autumn and Winter."
