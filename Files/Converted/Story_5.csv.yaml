- raw: "Story/N_5_4_8_10_001,那一日你连过崆峒四大护法，直取金乌上人，识破其真身，斩于剑下之事，轰响于江湖。"
  splits:
  - split: 1
    text: "那一日你连过崆峒四大护法，直取金乌上人，识破其真身，斩于剑下之事，轰响于江湖。"
