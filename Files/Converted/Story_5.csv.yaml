    text: "有的下山云游，有的削发去河南帮嵩山重建宝剎，有的辟谷修行，从此不问世事。那峨嵋派的兴衰重任，自然就着落到我这一辈头上。"
    translated: "Some went down the mountain to wander, others cut their hair to assist in rebuilding the sacred temple in Henan for Songshan, while others practiced fasting and meditation, thus no longer concerned with worldly affairs. The responsibility of the Emei sect's rise and fall naturally falls upon our generation."
