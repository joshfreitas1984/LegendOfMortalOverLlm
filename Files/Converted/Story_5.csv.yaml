  splits:
  - split: 1
    text: "你不知道吗？相亲时，男方家长到女方家，看中了人家女儿，就把钗子插姑娘头上，这叫『插』钗子，如果不中意，就丢下一块彩缎，表示亲事结不成了。"
    translated: "Don't you know? During courtship, the male family visits the female's home. If they like the daughter, they place a hairpin on her head, which is called inserting a hairpin. If they don't like her, they leave a piece of colored silk, indicating the match is off."
- raw: "Story/D_5_4_3_017,我还真没听说过，我爹娶我娘就是直接提着礼物上门提亲。我外祖父外祖母见了礼物喜欢，就叫我爹任选，我爹选了我娘和我姨姨。"
