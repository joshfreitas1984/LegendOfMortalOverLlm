  splits:
  - split: 1
    text: "此剑直之无前，举之无上，案之无下，运之无旁，上决浮云，下绝地纪。此剑一用，匡诸侯，天下服矣。这才是真正的天子之剑，哪里是搅和江湖事的玩意儿。"
