- raw: "Story/D_5_4_3_011,这相亲，便是他们三个幸运儿的最后一关了。不得不说，以三师兄而言，这回出的主意还真是惊世骇俗。还真像当朝公主招驸马一样。"
  splits:
  - split: 1
    text: "这相亲，便是他们三个幸运儿的最后一关了。不得不说，以三师兄而言，这回出的主意还真是惊世骇俗。还真像当朝公主招驸马一样。"
    translated: "This matchmaking event is the final challenge for the three lucky individuals. I must say, in the case of Third Senior Brother, this idea is truly astonishing and unconventional. It really resembles the current princess selecting a consort."
- raw: "Story/D_5_4_3_012,若按礼法，自古以来婚姻大事都是父母之命，媒妁之言。不待父母之命，媒妁之言，钻穴隙相窥，逾墙相从，则父母国人皆贱之。"
  splits:
  - split: 1
    text: "若按礼法，自古以来婚姻大事都是父母之命，媒妁之言。不待父母之命，媒妁之言，钻穴隙相窥，逾墙相从，则父母国人皆贱之。"
    translated: "According to etiquette and law, marriage has always been a matter of parents' command and the matchmaker's words. If one does not await the parents' command and the matchmaker's words, but instead sneaks through holes and gaps to peek, and climbs over walls to follow, then both parents and the people of the country will look down upon them."
- raw: "Story/D_5_4_3_013,我辈江湖中人快意恩仇，不似寻常人家讲究，也是有的。可是以三师兄而言，确实是破天荒了，足见他有多么怜惜小师妹。"
  splits:
  - split: 1
    text: "我辈江湖中人快意恩仇，不似寻常人家讲究，也是有的。可是以三师兄而言，确实是破天荒了，足见他有多么怜惜小师妹。"
    translated: "We of the Jianghu people act on our sense of justice, not like ordinary families, which is also common. However, for Third Senior Brother, it's truly unprecedented, showing how much he cares for the Little Junior Sister."
- raw: "Story/D_5_4_3_014,他既执着于礼法，又不得不从流于江湖习俗，也怜惜小师妹。怕他一己之见，被一根钗子误了小师妹终生吧。最后折衷，才想出这样的主意。"
