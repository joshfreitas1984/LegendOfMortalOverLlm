- raw: "Story/N_5_4_7_2_1_002,你没死，但是唐门经此一役，心气便散了，更无脸面在江湖立足。门人纷纷辞别下山，三师兄、四师与你将大院一封，各散东西。"
  splits:
  - split: 1
    text: "你没死，但是唐门经此一役，心气便散了，更无脸面在江湖立足。门人纷纷辞别下山，三师兄、四师与你将大院一封，各散东西。"
    translated: "You are still alive, but the Tang Clan has been shattered by this battle, their spirit broken, and they have no face to stand in the Jianghu anymore. The disciples are all leaving the mountain, and Third Senior Brother, Fourth Senior Brother, and you will seal the courtyard, each going their separate ways."
- raw: "Story/N_5_4_7_2_1_003,叶云舟虽抢回了小师妹，她却中了金乌上人的独门兵器，真气窜上脑门，终日昏昏沉沉，宛如变了一个人似的，经常自言自语。"
  splits:
  - split: 1
    text: "叶云舟虽抢回了小师妹，她却中了金乌上人的独门兵器，真气窜上脑门，终日昏昏沉沉，宛如变了一个人似的，经常自言自语。"
    translated: "Despite reclaiming his little junior sister, Ye Yunzhao found her afflicted with an exclusive weapon of Jinwu Shangren. Her true qi surged to her forehead, leaving her dazed and disoriented day after day, as if she had transformed into a different person. She often spoke to herself."
- raw: "Story/N_5_4_7_2_1_004,求亲者见状，都绝了心思，谁都不愿娶她这样痴傻，又不知是否清白的娘子回家供着。"
  splits:
  - split: 1
    text: "求亲者见状，都绝了心思，谁都不愿娶她这样痴傻，又不知是否清白的娘子回家供着。"
    translated: "Suitors, upon seeing the situation, lost all their intentions; none wished to marry her, who was so foolish and whose chastity was uncertain, and have her at home as a wife."
- raw: "Story/N_5_4_7_2_1_005,唯独瑞笙对她毫不嫌弃，只是小师妹痴痴傻傻，一离开你就哭，他最终也只有颓然放弃。"
  splits:
  - split: 1
    text: "唯独瑞笙对她毫不嫌弃，只是小师妹痴痴傻傻，一离开你就哭，他最终也只有颓然放弃。"
    translated: "Only Rui Sheng didn't despise her; the Little Junior Sister was foolish and simple‑minded, crying as soon as she left you. In the end, he could only resignedly give up."
- raw: "Story/N_5_4_7_2_1_006,你带着小师妹，四处求医，可是一无所获。某日道中忽遇二师兄，出手将你毒倒，带着小师妹扬长而去。"
  splits:
  - split: 1
    text: "你带着小师妹，四处求医，可是一无所获。某日道中忽遇二师兄，出手将你毒倒，带着小师妹扬长而去。"
    translated: "You took the Little Junior Sister to seek medical help everywhere, but came up empty. One day, while on the road, you suddenly encountered Second Senior Brother, who struck you with poison, knocking you out, and then took the junior sister and left with a swagger."
- raw: "Story/N_5_4_7_2_1_007,你在道上咽气，却不是死于二师兄之手。很早之前，你就和唐门的尊严一起死了，早该入土了。残喘至今的，不过是一具没有灵魂的躯壳罢了。"
  splits:
  - split: 1
    text: "你在道上咽气，却不是死于二师兄之手。很早之前，你就和唐门的尊严一起死了，早该入土了。残喘至今的，不过是一具没有灵魂的躯壳罢了。"
    translated: "You breathed your last on the path, but not by the hand of the Second Senior Brother. Long ago, you died along with the Tang Clan's honor, and you should have been buried long ago. The one still gasping for breath is nothing but a shell without a soul."
