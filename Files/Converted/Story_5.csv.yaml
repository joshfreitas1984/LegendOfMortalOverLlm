- raw: "Story/D_6_2_1_083,自江陵围城以来，江湖风雨有如滔滔江水，连绵不绝。向有武林之心美誉的南宫世家痛失尊长，而各派亦中魔教调虎离山之计，无一不是元气大伤，正该是团结一心，共抗魔教的时候。"
  splits:
  - split: 1
    text: "自江陵围城以来，江湖风雨有如滔滔江水，连绵不绝。向有武林之心美誉的南宫世家痛失尊长，而各派亦中魔教调虎离山之计，无一不是元气大伤，正该是团结一心，共抗魔教的时候。"
    translated: "Since the siege of Jiangling began, the Jianghu has been like a torrential river, unceasing. The Nangong Family, renowned for its martial arts prowess, has lost its respected elders. Additionally, various factions fell victim to the Demon Sect's strategy of luring them away, leaving none unscathed by significant losses. It is precisely at this time that unity and collective resistance against the Demon Sect are most crucial."
- raw: "Story/D_6_2_1_084,然而江湖门派，不争财的必争名，不争名的总要争口气，谁也不肯让谁。纵是六大正派亦不可免多年明争暗斗，全凭南宫世家居中调解，方得制衡。"
  splits:
  - split: 1
    text: "然而江湖门派，不争财的必争名，不争名的总要争口气，谁也不肯让谁。纵是六大正派亦不可免多年明争暗斗，全凭南宫世家居中调解，方得制衡。"
    translated: "However, in the Jianghu sects, those who do not compete for wealth must vie for reputation; those who do not compete for reputation still seek to assert their stance, and none are willing to yield. Even the six major righteous sects cannot escape years of open and covert struggles, relying entirely on the Nangong family to mediate and thus maintaining balance."
- raw: "Story/D_6_2_1_085,唉，可怜老太爷新丧，各派纷争又起，团结一心，谈何容易？南宫大公子心系中原，可惜有心无力，四处奔波游说亦无寸功。"
