    text: "你在道上咽气，却不是死于二师兄之手。很早之前，你就和唐门的尊严一起死了，早该入土了。残喘至今的，不过是一具没有灵魂的躯壳罢了。"
    translated: "You breathed your last on the path, but not by the hand of the Second Senior Brother. Long ago, you died along with the Tang Clan's honor, and you should have been buried long ago. The one still gasping for breath is nothing but a shell without a soul."
- raw: "Story/N_5_4_7_2_2_001,经此一役之后，唐门颜面扫地。江湖皆云强龙不斗地头蛇，可叹唐门连蛇也不算，顶多是地头虫。以多欺少还一败涂地，可悲可笑之极。"
  splits:
  - split: 1
    text: "经此一役之后，唐门颜面扫地。江湖皆云强龙不斗地头蛇，可叹唐门连蛇也不算，顶多是地头虫。以多欺少还一败涂地，可悲可笑之极。"
    translated: "After this battle, the Tang Clan's reputation was ruined. The Jianghu all say that a strong dragon does not fight a local snake; it's a pity that the Tang Clan isn't even a snake, at most a local bug. Even using their numbers to overwhelm the few, they were completely defeated, an outcome so pitiful and laughable it's almost beyond belief."
- raw: "Story/N_5_4_7_2_2_002,江湖再无一人看得起唐门，门人亦多心如死灰，纷纷向三师兄辞行下山。"
  splits:
  - split: 1
    text: "江湖再无一人看得起唐门，门人亦多心如死灰，纷纷向三师兄辞行下山。"
    translated: "There is no one left in Jianghu who holds the Tang Clan in contempt; the disciples, many of whom now feel as if their hearts are ashes, have all bid farewell to the Third Senior Brother and descended the mountain."
