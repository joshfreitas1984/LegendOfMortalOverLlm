    translated: "He is devoted to propriety and etiquette, yet forced to conform to Jianghu customs, and also pities the Little Junior Sister. Fears that his own views might be misled by a hairpin, thereby misguiding the Little Junior Sister for life. Finally, he compromised and came up with this plan."
