- raw: "Story/D_6_10_1_080,当下六派掌门、丐帮帮主，甚至南宫世家、上官世家等等，全都放下成见，团结一心听他调度，各方高手也不再藏招自秘，纷纷响应。局势登时逆转，打得魔教二道落荒而逃。"
  splits:
  - split: 1
    text: "当下六派掌门、丐帮帮主，甚至南宫世家、上官世家等等，全都放下成见，团结一心听他调度，各方高手也不再藏招自秘，纷纷响应。局势登时逆转，打得魔教二道落荒而逃。"
    translated: "At that moment, the leaders of the six sects, the Beggar Sect's gang leader, even Nangong and Shangguan families, all put aside their grievances and united to follow his commands. Skilled experts from all sides no longer hid their moves, responding one after another. The situation immediately turned around, with the Demon Sect's two leaders fleeing in disarray."
