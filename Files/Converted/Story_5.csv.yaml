- raw: "Story/D_5_4_8_2_014,今日我唐门家有喜事，各位崆峒朋友不速而来，本门也不追究。若肯赏光，就留这外堡喝杯喜酒。如若不肯，那便恕不远送了！至于这位金乌上人，容我暂且扣下了！"
  splits:
  - split: 1
    text: "今日我唐门家有喜事，各位崆峒朋友不速而来，本门也不追究。若肯赏光，就留这外堡喝杯喜酒。如若不肯，那便恕不远送了！至于这位金乌上人，容我暂且扣下了！"
    translated: "Today, my Tang Clan has a happy event. All Kongtong friends, you've come without being invited, but our clan won't hold it against you. If you're willing to grace us with your presence, stay at this outer fortress and share a cup of wedding wine with us. If not, then we won't see you off far. As for this Jinwu Shangren, I'll temporarily detain him!"
- raw: "Story/D_5_4_8_2_015,今日我唐门没空理会你们，哪里来的，滚回哪去！至于这位搧风点火的始作俑者，我就留下了。"
  splits:
  - split: 1
    text: "今日我唐门没空理会你们，哪里来的，滚回哪去！至于这位搧风点火的始作俑者，我就留下了。"
    translated: "Today, the Tang Clan has no time to deal with you lot. Where did you come from? Scram back where you came from! As for this instigator who fanned the flames, I'll keep them."
- raw: "Story/D_5_4_8_2_016,今日打砸的事物、伤了的人，且请留心记牢了。本门今日且不追究，此恨留待你们掌派人大选，再换我带人去崆峒作客。届时以彼之道，还施彼身，有恩报恩，有仇报仇，才不失磊落！"
  splits:
  - split: 1
    text: "今日打砸的事物、伤了的人，且请留心记牢了。本门今日且不追究，此恨留待你们掌派人大选，再换我带人去崆峒作客。届时以彼之道，还施彼身，有恩报恩，有仇报仇，才不失磊落！"
    translated: "The items smashed today and the injured individuals‑please take note and remember well. Our sect will not pursue this matter today; this grudge will be settled during your sect leader's election. At that time, I will lead a team to Kongtong as guests and repay them with their own methods. Repay kindness with kindness and hatred with hatred, so as not to lose one's integrity!"
- raw: "Story/D_5_4_8_2_017,今日打砸的东西、伤了的人，都别忘了。等我得空，就去你崆峒如数奉还，看你们掌派人大选办不办得成！"
  splits:
  - split: 1
    text: "今日打砸的东西、伤了的人，都别忘了。等我得空，就去你崆峒如数奉还，看你们掌派人大选办不办得成！"
    translated: "Don't forget the things smashed and the injured people today. When I have time, I'll go to your Kongtong and return them in full‑see if you can hold the master sect leader election!"
- raw: "Story/N_5_4_8_2_003,崆峒诸人闻言，更是无地自容，哪里还有脸面留下？脸皮厚的拱了拱手，说几句场面话好下台；脸皮薄的，一言不发便往外走。"
  splits:
  - split: 1
    text: "崆峒诸人闻言，更是无地自容，哪里还有脸面留下？脸皮厚的拱了拱手，说几句场面话好下台；脸皮薄的，一言不发便往外走。"
    translated: "Kongtong's people, upon hearing the words, were even more ashamed to stand. Where was there any face left to remain? Those with thick skin bowed slightly, saying a few polite words to excuse themselves; those with thin skin said nothing and walked out immediately."
- raw: "Story/N_5_4_8_2_004,崆峒派意气风发来滋事，反闹了个灰头土脸，哪有脸面留下？脸皮厚的拱了拱手，说几句场面话好下台；薄的一言不发便走。"
