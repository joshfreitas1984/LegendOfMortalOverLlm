    translated: "Alas, the old patriarch has just passed away, and conflicts among the various sects have reignited. To unite as one, how easy is that? Young Lord Nangong's heart is tied to the Central Plains, alas, he has the heart but no power. He has tirelessly traveled and pleaded, yet achieved nothing."
