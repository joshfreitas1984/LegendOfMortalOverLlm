- raw: "Story/N_5_4_8_10_002,连与你为敌的崆峒中人，都不禁佩服你的武功、气概。回到山中以后，谈起你过关斩将的事，都以与你过招而自豪。"
  splits:
  - split: 1
    text: "连与你为敌的崆峒中人，都不禁佩服你的武功、气概。回到山中以后，谈起你过关斩将的事，都以与你过招而自豪。"
    translated: "Even the Kongtong disciples who were your enemies couldn't help but admire your martial arts and demeanor. After returning to the mountain, when they spoke of your feats of passing through gates and cutting down generals, they took pride in having dueled you."
- raw: "Story/N_5_4_8_10_003,那金乌上人从前恶名昭彰，老一辈江湖人说起来依然发指。只因他怎么杀也杀不死，改邪归正出家以后，又托庇于崆峒门下，令昔日仇家纵使想要寻仇，也没机会下手。"
  splits:
  - split: 1
    text: "那金乌上人从前恶名昭彰，老一辈江湖人说起来依然发指。只因他怎么杀也杀不死，改邪归正出家以后，又托庇于崆峒门下，令昔日仇家纵使想要寻仇，也没机会下手。"
    translated: "Jinwu Shangren was once notorious, and even the older generation of Jianghu people still spoke of him with hair‑raising tales. It was because he could not be killed, and after he turned over a new leaf and became a monk, he took refuge under the Kongtong sect, leaving his former enemies with no opportunity to seek revenge."
- raw: "Story/N_5_4_8_10_004,他生平只被崆峒先掌派人降伏过，今日方始伏诛于唐门。人人都说连九命豹子到头也难逃一死，想必你是阎王使者。又是姓赵，说不定和地狱道法王赵逵有关。"
  splits:
  - split: 1
    text: "他生平只被崆峒先掌派人降伏过，今日方始伏诛于唐门。人人都说连九命豹子到头也难逃一死，想必你是阎王使者。又是姓赵，说不定和地狱道法王赵逵有关。"
    translated: "He was only subdued by the Kongtong sect in his lifetime and is now finally brought down by the Tang Clan. Everyone says that even nine‑lives tigers cannot escape death in the end, so you must be an envoy of Lord Yan. And since you are named Zhao, it's possible there is a connection to Dharma King Zhao Kui of Hell's Path."
