- raw: "Story/D_5_3_4_1_086,你想必知道，峨嵋武功与佛法脱离不了干系，习武亦论禅修。与嵩山派最为交好，从古就时有嵩山高僧来金顶讲法。旧魔教一役，嵩山高僧殉难以后，本派前辈都心怀愧疚，纷纷引退。"
  splits:
  - split: 1
    text: "你想必知道，峨嵋武功与佛法脱离不了干系，习武亦论禅修。与嵩山派最为交好，从古就时有嵩山高僧来金顶讲法。旧魔教一役，嵩山高僧殉难以后，本派前辈都心怀愧疚，纷纷引退。"
    translated: "You must know that Emei martial arts and Buddhism are inseparably linked, with martial training also involving meditation. We have the closest ties with the Songshan School; since ancient times, high monks from Songshan often came to the Golden Summit to preach. After the old Demon Sect incident, our seniors felt guilty about the martyred Songshan monks and retired one after another."
- raw: "Story/D_5_3_4_1_087,有的下山云游，有的削发去河南帮嵩山重建宝剎，有的辟谷修行，从此不问世事。那峨嵋派的兴衰重任，自然就着落到我这一辈头上。"
  splits:
