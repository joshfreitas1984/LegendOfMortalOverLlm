    text: "无为丹法"
- raw: "Book/Desc/7015,青城派的内功心法，主张无为持修，守无致虚。\\n心性清净无为，便是有为，无心无念是为大成，切忌一切意象存想，然道自生。\\n难学难精，但是功成之日，非同小可。"
