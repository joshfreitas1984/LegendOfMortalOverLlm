- raw: "Book/Name/2301,同舟剑谱"
  splits:
  - split: 1
    text: "同舟剑谱"
- raw: "Book/Desc/2301,苍松剑客叶云舟习剑半生一切所得，在风雨山与恩师诀别之际始终顿悟。\\n剑出如奔雷，凌驾于点苍所有快剑之上，乃是唐门的剑法。"
  splits:
  - split: 1
    text: "苍松剑客叶云舟习剑半生一切所得，在风雨山与恩师诀别之际始终顿悟。"
  - split: 1
