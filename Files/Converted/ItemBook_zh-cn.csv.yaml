    template: "{0}\\n{1}"
- raw: "Book/Name/2302,云裳剑法"
  splits:
  - split: 1
    text: "云裳剑法"
- raw: "Book/Desc/2302,点苍派万里挑一的弟子，能破格进入剑庐三日，参悟点苍剑圣留在剑庐中的三式剑意。\\n三招剑意各有奥义，无分高下，得一足以独步江湖，但是十之有九，住上十天半个月都一无所获。\\n叶云裳好奇心使然，偷溜进去玩，片刻就被人提了出来。\\n她虽不会武功，但是聪明绝顶，而又不落窠臼，仅那片刻，就若有所悟，只是年纪太小，迷迷糊糊。\\n今日诀别，才识离愁滋味，往事涌现心头，豁然顿悟，写就此招。\\n虽只一式，却残念无穷，此剑即为剑圣第四极招－－「魂游故里芳盈袖，春啼晓，莫挽留」。"
  splits:
  - split: 1
    text: "点苍派万里挑一的弟子，能破格进入剑庐三日，参悟点苍剑圣留在剑庐中的三式剑意。"
  - split: 1
    subIndex: 1
    text: "三招剑意各有奥义，无分高下，得一足以独步江湖，但是十之有九，住上十天半个月都一无所获。"
  - split: 1
    subIndex: 2
    text: "叶云裳好奇心使然，偷溜进去玩，片刻就被人提了出来。"
  - split: 1
    subIndex: 3
    text: "她虽不会武功，但是聪明绝顶，而又不落窠臼，仅那片刻，就若有所悟，只是年纪太小，迷迷糊糊。"
  - split: 1
    subIndex: 4
    text: "今日诀别，才识离愁滋味，往事涌现心头，豁然顿悟，写就此招。"
  - split: 1
    subIndex: 5
    text: "虽只一式，却残念无穷，此剑即为剑圣第四极招－－「魂游故里芳盈袖，春啼晓，莫挽留」。"
  templates:
  - split: 1
    template: "{0}\\n{1}\\n{2}\\n{3}\\n{4}\\n{5}"
