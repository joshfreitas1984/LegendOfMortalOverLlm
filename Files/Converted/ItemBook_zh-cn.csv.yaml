- raw: "Book/Name/6010,千刀万剐杀"
  splits:
  - split: 1
    text: "千刀万剐杀"
- raw: "Book/Desc/6010,极度疯狂的刀法，乃是一名身负夺妻之恨的三流刀客所创。\\n受冤下狱13年间，在心中揣想过几千次敌人的武功路子，在脑海中将夺妻的仇敌凌迟几万次。\\n他出狱后不久，惊动江湖的血案「碧血狂杀」案件旋即爆发。"
  splits:
