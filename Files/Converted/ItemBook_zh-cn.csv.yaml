- raw: "Book/Name/8003,雪球教战守则"
  splits:
  - split: 1
    text: "雪球教战守则"
- raw: "Book/Desc/8003,作者叶云裳，字迹很娟秀，笔锋有些稚趣，就像她的人一般。\\n这书写了她的雪仗技巧，煞有其事分了《正攻》、《奇袭》两篇，此书中的招数，多数是她想象出来的。\\n包含了在雪球里藏石头、毛虫或者雪球塞裤管等等无所不用其极的残忍伎俩。"
