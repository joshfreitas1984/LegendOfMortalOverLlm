    template: "{0}\\n{1}\\n{2}"
- raw: "Book/Name/2002,翻浪刀法"
  splits:
  - split: 1
    text: "翻浪刀法"
    translated: "Surging Wave Blade Technique"
- raw: "Book/Desc/2002,活跃于福、建地区的沧帮弟子所习练的武功。\\n沧帮背后有上官世家撑腰，这是人人都心照不宣的秘密，就连翻浪刀法，都是从上官家传刀法演化出来的，改以船桨、船橹施展，反而欲盖弥彰。\\n此刀法施展开来，有如江上波涛汹涌，连绵不绝，遇弱则阵阵相逼，遇强则意守后着，敌人若奋力相抗，不免扑空，一但露出破绽，后浪便咄咄逼来。刚中有柔，柔中有刚，攻中有守，守中有攻，是极上乘的刀法。\\n但你拿桨橹习练，注定学歪。"
  splits:
  - split: 1
    text: "活跃于福、建地区的沧帮弟子所习练的武功。"
  - split: 1
    subIndex: 1
    text: "沧帮背后有上官世家撑腰，这是人人都心照不宣的秘密，就连翻浪刀法，都是从上官家传刀法演化出来的，改以船桨、船橹施展，反而欲盖弥彰。"
  - split: 1
    subIndex: 2
    text: "此刀法施展开来，有如江上波涛汹涌，连绵不绝，遇弱则阵阵相逼，遇强则意守后着，敌人若奋力相抗，不免扑空，一但露出破绽，后浪便咄咄逼来。刚中有柔，柔中有刚，攻中有守，守中有攻，是极上乘的刀法。"
  - split: 1
    subIndex: 3
    text: "但你拿桨橹习练，注定学歪。"
  templates:
  - split: 1
    template: "{0}\\n{1}\\n{2}\\n{3}"
- raw: "Book/Name/2003,君子论剑"
  splits:
  - split: 1
    text: "君子论剑"
- raw: "Book/Desc/2003,一代儒侠曾文先生所著，总结四书五经十三经，论君子慎其独，由心而表于体，由知而形于礼，不亢不卑，言行如一。月换星移由他，江山易主随你，我自本心，修养自己。\\n人间再好，我亦不过是我而已；世道再坏，我亦不过是我而已。舍此色身，亦复如是。\\n凡我练剑习武之人，当守本心，以剑锋两刃为镜，不耻问亦求诸己，谦而自强不息，处患难不忧，当宴游惕虑，遇权豪无惧，是为君子剑。"
  splits:
  - split: 1
    text: "一代儒侠曾文先生所著，总结四书五经十三经，论君子慎其独，由心而表于体，由知而形于礼，不亢不卑，言行如一。月换星移由他，江山易主随你，我自本心，修养自己。"
  - split: 1
    subIndex: 1
    text: "人间再好，我亦不过是我而已；世道再坏，我亦不过是我而已。舍此色身，亦复如是。"
  - split: 1
    subIndex: 2
    text: "凡我练剑习武之人，当守本心，以剑锋两刃为镜，不耻问亦求诸己，谦而自强不息，处患难不忧，当宴游惕虑，遇权豪无惧，是为君子剑。"
  templates:
  - split: 1
    template: "{0}\\n{1}\\n{2}"
- raw: "Book/Name/2004,鸳鸯拳剑谱"
  splits:
  - split: 1
    text: "鸳鸯拳剑谱"
- raw: "Book/Desc/2004,峨嵋、唐门侠侣闭关钻研出的合击之术。\\n一人使拳，一人使剑，交相互补，琴瑟和谐，越是心意相通威力越强。\\n你有秘籍，但是没有伴侣。"
  splits:
  - split: 1
    text: "峨嵋、唐门侠侣闭关钻研出的合击之术。"
  - split: 1
    subIndex: 1
    text: "一人使拳，一人使剑，交相互补，琴瑟和谐，越是心意相通威力越强。"
