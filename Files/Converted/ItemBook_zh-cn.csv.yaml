- raw: "Book/Desc/2401,太古道人郝大通于华山创设全真华山派时携去的原始全真剑法，此书由王喆亲笔写就，丹阳子马钰抄录成七册分予师弟留作纪念，以缅怀师尊。\\n气、剑双修，难学难精，深奥非常。"
