- raw: "Book/Desc/2302,点苍派万里挑一的弟子，能破格进入剑庐三日，参悟点苍剑圣留在剑庐中的三式剑意。\\n三招剑意各有奥义，无分高下，得一足以独步江湖，但是十之有九，住上十天半个月都一无所获。\\n叶云裳好奇心使然，偷溜进去玩，片刻就被人提了出来。\\n她虽不会武功，但是聪明绝顶，而又不落窠臼，仅那片刻，就若有所悟，只是年纪太小，迷迷糊糊。\\n今日诀别，才识离愁滋味，往事涌现心头，豁然顿悟，写就此招。\\n虽只一式，却残念无穷，此剑即为剑圣第四极招－－「魂游故里芳盈袖，春啼晓，莫挽留」。"
  splits:
  - split: 1
    text: "点苍派万里挑一的弟子，能破格进入剑庐三日，参悟点苍剑圣留在剑庐中的三式剑意。"
    translated: "Diancang Sect's outstanding disciples, who are one in ten thousand, can gain special permission to enter Sword Lodge for three days to study the three sword intents left by the Diancang Sword Saint in Sword Lodge."
    qcReviewedText: "Diancang Sect's outstanding disciples, who are one in ten thousand, can gain special permission to enter Sword Lodge for three days to study the three sword intents left by the Diancang Sword Saint in Sword Lodge.\\nEach of the three sword intents has its own profound essence, with none being superior to the others. Mastering just one can make one stand out in Jianghu, but in reality, nine out of ten people return after ten days or half a month with nothing to show for it.\\nDriven by curiosity, Ye Yunshang sneaked in to play but was soon dragged out by someone.\\nAlthough they are not skilled in martial arts, they are incredibly clever and original, and within that brief moment, they seemed to gain some insight, though their young age left them somewhat confused.\\nToday, as we part ways, I finally taste the bitterness of parting. Memories flood back, and I suddenly understand, thus creating this move.\\nThough it is but a single move, it is filled with endless regret. This sword technique is the Sword Saint's fourth-tier move - Soul Wandering, Fragrance Fills the Sleeve, Spring's Dawn, Do Not Detain."
    qcTranslated: "Diancang Sect's once-in-a-millennium disciples can gain special permission to enter Sword Lodge for three days to study the three sword intents left by the Diancang Sword Saint in Sword Lodge.\\nEach of the three sword intents has its own profound essence, with none being superior to the others. Mastering just one can make one stand out in Jianghu, but nine times out of ten, even after staying for ten days or half a month, they gain nothing.\\nDriven by curiosity, Ye Yunshang sneaked in to play but was soon dragged out by someone.\\nAlthough she is not skilled in martial arts, she is incredibly clever and unconventional, and within that brief moment, she seemed to gain some insight, though her young age left her somewhat confused.\\nToday, as we part ways, I finally taste the bitterness of parting. Memories flood back, and I suddenly understand, thus creating this move.\\nThough it is but a single move, it is filled with endless regret. This sword technique is the Sword Saint's fourth ultimate move - Soul Wandering, Fragrance Fills the Sleeve, Spring's Dawn, Do Not Detain."
    qcStatus: Corrected
    qcQualityScore: 92
    qcDefectCategory: UnnaturalPhrasing
