- raw: "Book/Name/6003,仙鹤迷踪拳"
  splits:
  - split: 1
    text: "仙鹤迷踪拳"
- raw: "Book/Desc/6003,崆峒派．飞天门的传世武学。\\n身法轻灵，拳快步松，最是敏捷多变。时而漫步闲游，时而振翅急袭，叫人捉摸不透，防不胜防。\\n只是这路拳法过于复杂，共有三十六路、七十二变、百零八种后着，甚难熟练，因此飞天门中反倒鲜少有人深入钻研。"
  splits:
