- raw: "Book/Name/6008,登云踏．望月"
  splits:
  - split: 1
    text: "登云踏．望月"
- raw: "Book/Desc/6008,你唐门大师兄登徒子行径中自创的武功，收录于登云梯续集。为了求见美人，可以登云上楼台，其中踏月式是由这路轻功衍生出的攻招，「月」指光辉，暗喻所有加诸于己的兵刃。故而踏月式的真义是专门踏到别人兵刃上，居高临下踩人脸面。"
  splits:
  - split: 1
    text: "你唐门大师兄登徒子行径中自创的武功，收录于登云梯续集。为了求见美人，可以登云上楼台，其中踏月式是由这路轻功衍生出的攻招，「月」指光辉，暗喻所有加诸于己的兵刃。故而踏月式的真义是专门踏到别人兵刃上，居高临下踩人脸面。"
- raw: "Book/Name/6009,雪山飞鸿爪"
  splits:
  - split: 1
    text: "雪山飞鸿爪"
- raw: "Book/Desc/6009,你恩师夏侯兰集夺魄、雪山两家之神髓，去芜存菁，又揉合了控鹤气功，终于创制出的神技。\\n旨不在杀伤，乃是专门对付高手用的武功，就算是天下最高明的轻功，也捉得到。\\n发力恰似飞鸿踏雪泥，泥上偶然留指爪，鸿飞那复计东西？轻描淡写抓出，力使三分藏七分，后着隐于无形。破坏敌人架势，而我迅速回气，施以夺命猛袭。"
  splits:
  - split: 1
    text: "你恩师夏侯兰集夺魄、雪山两家之神髓，去芜存菁，又揉合了控鹤气功，终于创制出的神技。"
