- raw: "Book/Name/4004,玄玄如意指"
  splits:
  - split: 1
    text: "玄玄如意指"
    translated: "Xuanxuan Wish Fulfilling Finger"
- raw: "Book/Desc/4004,武林盟主大侠龙渊七种成名绝技之一。\\n玄玄如意，妙手空空，能以素手接人兵器，探人衣囊，无往不利。\\n龙渊少年时没少用这招扒人钱财，直到他醒悟茁壮，一肩扛起武林命运，才将秘籍中窃物的手法删除。"
