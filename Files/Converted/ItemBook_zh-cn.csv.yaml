- raw: "Book/Desc/2400,李白中年将侍于翰林院，封剑退隐之前留下的剑法，一共三十六式。\\n这套剑法只在弟子武谔面前使过仅仅一次，那时李白还喝醉了。\\n起似随兴挥洒，偏生处处神来一笔，妙到颠毫，似剑而非剑，破千古窠臼，辟未有之奇。\\n一套剑法使完，独立树梢，衣袂飘飘，宛如神仙。而坐观的武谔却全身大汗淋漓。\\n相传武谔有艰涩难解处，欲请教师父，李白却道：「莫问我，问了你便学不会。」武谔猛然顿悟，欢天喜地而去，殊不知李白只是宿醉推搪而已。"
  splits:
  - split: 1
    text: "李白中年将侍于翰林院，封剑退隐之前留下的剑法，一共三十六式。"
    translated: "Li Bai, in their middle age, served at the Hanlin Academy and left behind a Sword Technique consisting of thirty-six moves before retiring with their sword."
    qcReviewedText: "Li Bai, in their middle age, served at the Hanlin Academy and left behind a Sword Technique consisting of thirty-six moves before retiring with their sword.\\nThis sword technique was only demonstrated once, to disciple Wu E, when Li Bai was drunk.\\nIt flows as if casually wielded, yet everywhere there is a stroke of genius, perfect to the finest detail, neither sword nor sword, breaking free from millennia-old conventions to forge unprecedented marvels.\\nAfter completing a set of sword techniques, they stood alone on a tree branch, their robes fluttering in the wind, looking like celestial beings. Meanwhile, Wu E, who had been watching, was drenched in sweat.\\nIt is said that Wu E has some difficult and obscure parts. They wanted to ask their teacher, but Li Bai said,：Don't ask me, for asking won't make you understand. Wu E suddenly had a realization and left in high spirits, unaware that Li Bai was just using a hangover as an excuse."
    qcTranslated: "Li Bai, in his middle age, served at the Hanlin Academy and left behind a Sword Technique consisting of thirty-six moves before retiring with his sword.\\nThis sword technique was only demonstrated once, to disciple Wu E, when Li Bai was drunk.\\nIt flows as if casually wielded, yet everywhere there is a stroke of genius, perfect to the finest detail, like a sword yet not a sword, breaking free from millennia-old conventions to forge unprecedented marvels.\\nAfter completing a set of sword techniques, he stood alone on a tree branch, his robes fluttering in the wind, looking like a celestial being. Meanwhile, Wu E, who had been watching, was drenched in sweat.\\nIt is said that when Wu E encountered difficult and obscure parts and wanted to ask his teacher, Li Bai said: Don't ask me; if you ask, you won't be able to learn it. Wu E suddenly had a realization and left in high spirits, unaware that Li Bai was just using a hangover as an excuse."
    qcStatus: Corrected
    qcQualityScore: 92
    qcDefectCategory: DroppedContent
    qcDefectCategories:
