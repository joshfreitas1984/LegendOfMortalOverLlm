- raw: "Book/Name/7008,铁琵琶功"
  splits:
  - split: 1
    text: "铁琵琶功"
- raw: "Book/Desc/7008,习练者需单脚立桩，以腿托琵琶，这是飞天门「鹤桩」的轻功；若要掀动铁琴弦，需先习练夺魄门「霜刀破竹指」；再来要鼓动音箱，便须运使玄功门内力，使其共振；御敌时，更能抄起琵琶作为武器，施展铁拳奇门「如意砸」的招数，打爆敌人脑袋瓜。\\n功成心念一动，百脉齐鸣，动如响弦，历久不衰，是为崆峒第一神功。"
  splits:
  - split: 1
    text: "习练者需单脚立桩，以腿托琵琶，这是飞天门「鹤桩」的轻功；若要掀动铁琴弦，需先习练夺魄门「霜刀破竹指」；再来要鼓动音箱，便须运使玄功门内力，使其共振；御敌时，更能抄起琵琶作为武器，施展铁拳奇门「如意砸」的招数，打爆敌人脑袋瓜。"
  - split: 1
    subIndex: 1
    text: "功成心念一动，百脉齐鸣，动如响弦，历久不衰，是为崆峒第一神功。"
