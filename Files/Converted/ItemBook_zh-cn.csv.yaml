    text: "酩酊玄剑掌"
- raw: "Book/Desc/3010,一门神奇的武功，作者姓名已经失佚。\\n既是掌法，也是剑法，手中无剑，心中却有剑。\\n招数精妙，却无半分杀气，似乎只为自娱，舞来有如清辉明月，酣畅淋漓。"
