- raw: "Book/Name/1020,拈花指法"
  splits:
  - split: 1
    text: "拈花指法"
    translated: "Flower Picking Finger Technique"
- raw: "Book/Desc/1020,闻名天下的嵩山指法，取自「释迦拈花，迦叶微笑」的典故。涅盘妙心，不可言说，亦难以文字描述，无形无相，不可思议。这套武学精深奥妙之处，非有慧根而不可得。"
