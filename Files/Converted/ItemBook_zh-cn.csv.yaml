- raw: "Book/Name/2011,盘古开天破"
  splits:
  - split: 1
    text: "盘古开天破"
- raw: "Book/Desc/2011,静江九县小盟主方震天的成名绝技，本是奇门武功，要以铁锤与钉子合使。\\n机缘巧合为方震天所得，声称这是他苦心创制的独门武功，为免被人看出手脚，将原本锤法改为刀法，至于钉法则略去不用，因此平空多了许多意义不明的怪招，破绽不小。"
  splits:
