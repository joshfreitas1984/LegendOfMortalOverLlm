- raw: "Book/Name/7014,逐浪诀"
  splits:
  - split: 1
    text: "逐浪诀"
- raw: "Book/Desc/7014,武林三大世家上官一脉承传的心法，翻浪刀法的真髓。\\n需借汹涌激流练刀，练到能在惊涛之中屹立不摇，挥刀斩浪的地步。\\n招数有如沧浪一波未平、一波又起，咄咄逼人，内力到处，更是威力大增，教人便招架住了，也得踉跄几步。"
