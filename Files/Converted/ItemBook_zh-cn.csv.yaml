- raw: "Book/Desc/6002,崆峒派‧飞天门的秘籍。\\n是先掌派人将《仙鹤迷踪拳》简化以传授弟子的入门版本。\\n略去迷踪与拳路，仅就下盘轻功锻炼，浅显易懂。"
