- raw: "Book/Name/1030,金钟罩"
  splits:
  - split: 1
    text: "金钟罩"
- raw: "Book/Desc/1030,嵩山派的经典硬气功，\\n乃是嵩山寺十八铜人的拿手绝活。\\n金钟罩兼修内外，外壮筋骨，内固脏腑，\\n功成之人身似铜铁，纵有拳脚加诸于身，亦不痛不痒。"
