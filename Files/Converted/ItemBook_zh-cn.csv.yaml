- raw: "Book/Desc/2003,一代儒侠曾文先生所著，总结四书五经十三经，论君子慎其独，由心而表于体，由知而形于礼，不亢不卑，言行如一。月换星移由他，江山易主随你，我自本心，修养自己。\\n人间再好，我亦不过是我而已；世道再坏，我亦不过是我而已。舍此色身，亦复如是。\\n凡我练剑习武之人，当守本心，以剑锋两刃为镜，不耻问亦求诸己，谦而自强不息，处患难不忧，当宴游惕虑，遇权豪无惧，是为君子剑。"
  splits:
  - split: 1
    text: "一代儒侠曾文先生所著，总结四书五经十三经，论君子慎其独，由心而表于体，由知而形于礼，不亢不卑，言行如一。月换星移由他，江山易主随你，我自本心，修养自己。"
    translated: "Master Wen Zeng, a renowned scholar-knightsman of the past, wrote about summarizing the Four Books and Five Classics, and the Thirteen Classics. He discussed how a gentleman should be cautious in solitude, cultivating from the heart to the body, and from knowledge to ritual. Neither arrogant nor servile, their words and actions are consistent. The passage of time and changes in power are beyond my control, but I remain true to my heart and cultivate myself."
    qcReviewedText: "Master Wen Zeng, a renowned scholar-knightsman of the past, wrote about summarizing the Four Books and Five Classics, and the Thirteen Classics. He discussed how a gentleman should be cautious in solitude, cultivating from the heart to the body, and from knowledge to ritual. Neither arrogant nor servile, their words and actions are consistent. The passage of time and changes in power are beyond my control, but I remain true to my heart and cultivate myself.\\nNo matter how wonderful the world is, I remain who I am; no matter how corrupt the ways of the world, I remain who I am. Even if I were to leave this mortal form behind, it would be the same.\\nFor those who practice swordsmanship and martial arts, one must uphold one's true self, using the two edges of the sword as a mirror, unafraid to seek answers and improve within oneself, remaining humble yet ever-striving for strength. In times of hardship, one should not be troubled, and when feasting and enjoying leisure, one must remain vigilant. When faced with power and authority, one must stand unafraid. This is the path of the gentleman swordsman."
    qcTranslated: "Master Wen Zeng, a renowned scholar-knightsman of the past, wrote about summarizing the Four Books, Five Classics, and the Thirteen Classics. He discussed how a gentleman should be cautious in solitude, cultivating from the heart to the body, and from knowledge to ritual. Neither arrogant nor servile, their words and actions are consistent. The passage of time and changes in power are beyond my control, but I remain true to my heart and cultivate myself.\\nNo matter how wonderful the world is, I remain who I am; no matter how corrupt the ways of the world, I remain who I am. Even if I were to leave this mortal form behind, it would be the same.\\nFor those who practice swordsmanship and martial arts, one must uphold one's true self, using the two edges of the sword as a mirror, unashamed to ask questions yet also seeking answers within oneself, remaining humble yet ever-striving for strength. In times of hardship, one should not be troubled, and when feasting and enjoying leisure, one must remain vigilant. When faced with power and authority, one must stand unafraid. This is the path of the gentleman swordsman."
    qcStatus: Corrected
    qcQualityScore: 92
    qcDefectCategory: OtherNamedDefect
    qcDefectCategories:
    - OtherNamedDefect
    - DroppedContent
  - split: 1
    subIndex: 1
    text: "人间再好，我亦不过是我而已；世道再坏，我亦不过是我而已。舍此色身，亦复如是。"
    translated: "No matter how wonderful the world is, I remain who I am; no matter how corrupt the ways of the world, I remain who I am. Even if I were to leave this mortal form behind, it would be the same."
  - split: 1
    subIndex: 2
    text: "凡我练剑习武之人，当守本心，以剑锋两刃为镜，不耻问亦求诸己，谦而自强不息，处患难不忧，当宴游惕虑，遇权豪无惧，是为君子剑。"
    translated: "For those who practice swordsmanship and martial arts, one must uphold one's true self, using the two edges of the sword as a mirror, unafraid to seek answers and improve within oneself, remaining humble yet ever-striving for strength. In times of hardship, one should not be troubled, and when feasting and enjoying leisure, one must remain vigilant. When faced with power and authority, one must stand unafraid. This is the path of the gentleman swordsman."
  templates:
  - split: 1
    template: "{0}\\n{1}\\n{2}"
