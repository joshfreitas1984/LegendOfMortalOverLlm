- raw: "Book/Name/8107,难经"
  splits:
  - split: 1
    text: "难经"
- raw: "Book/Desc/8107,全名为《黄帝八十一难经》，乃著名医学著作，旨为阐发《黄帝内经》的疑难与要旨。\\n传为名医扁鹊所著，强调「五邪相干」、「十变」理论，解释五脏生克关系，\\n论脉学、经络、脏腑乃至针法的论述，对后世医学影响深远。"
