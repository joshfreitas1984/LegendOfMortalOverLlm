- raw: "Book/Name/7007,巫山洞府九宝图"
  splits:
  - split: 1
    text: "巫山洞府九宝图"
- raw: "Book/Desc/7007,藏于巫山与长江流域交会的钟乳洞中，绘于壁上的神秘武功，不知来历为何，亦不知历时几朝，以九张连环图画演示修练法门，似乎亦正亦邪，绝非寻常练功法门，然则言简意赅，有发聋振聩之效。\\n被一名失足落水的渔夫发现以后，誊拓下来，上交朝廷换得奖赏，而朝廷亦不重视，这套武功就此被埋没于达官贵人的书架之上。\\n而那钟乳洞亦因水位上升，已被彻底淹没。"
  splits:
  - split: 1
    text: "藏于巫山与长江流域交会的钟乳洞中，绘于壁上的神秘武功，不知来历为何，亦不知历时几朝，以九张连环图画演示修练法门，似乎亦正亦邪，绝非寻常练功法门，然则言简意赅，有发聋振聩之效。"
