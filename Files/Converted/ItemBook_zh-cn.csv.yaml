- raw: "Book/Desc/2002,活跃于福、建地区的沧帮弟子所习练的武功。\\n沧帮背后有上官世家撑腰，这是人人都心照不宣的秘密，就连翻浪刀法，都是从上官家传刀法演化出来的，改以船桨、船橹施展，反而欲盖弥彰。\\n此刀法施展开来，有如江上波涛汹涌，连绵不绝，遇弱则阵阵相逼，遇强则意守后着，敌人若奋力相抗，不免扑空，一但露出破绽，后浪便咄咄逼来。刚中有柔，柔中有刚，攻中有守，守中有攻，是极上乘的刀法。\\n但你拿桨橹习练，注定学歪。"
  splits:
  - split: 1
    text: "活跃于福、建地区的沧帮弟子所习练的武功。"
    translated: "The martial arts practiced by the disciples of Cang Gang, active in the Fujian region."
    qcReviewedText: "The martial arts practiced by the disciples of Cang Gang, active in the Fujian region.\\nCang Gang has the Shangguan family backing them, a secret that everyone implicitly understands. Even the Flipping Wave Blade Art was derived from the Shangguan family's blade techniques, but instead of using knives, it employs oars and paddles, which only serves to draw more attention to the connection.\\nWhen this blade technique is unleashed, it's like waves surging on a river, continuous and unending. It presses relentlessly when encountering weakness, and holds back to await the right moment when facing strength. If the enemy fights back forcefully, they may find themselves off balance; once a gap appears, the next wave will bear down on them. It combines hardness with softness, softness with hardness, offense with defense, and defense with offense-it is an extremely advanced blade technique.\\nBut practicing with oars is bound to lead them astray."
    qcTranslated: "The martial arts practiced by the disciples of Cang Gang, active in the Fujian region.\\nCang Gang has the Shangguan family backing them, a secret that everyone implicitly understands. Even the Flipping Wave Blade Art was derived from the Shangguan family's blade techniques, but instead of using knives, it employs oars and paddles, which only serves to draw more attention to the connection.\\nWhen this blade technique is unleashed, it's like waves surging on a river, continuous and unending. It presses relentlessly when encountering weakness, and holds back to await the right moment when facing strength. If the enemy fights back forcefully, they may find themselves off balance; once a gap appears, the next wave will bear down on them. It combines Hardness with Softness, Softness with Hardness, offense with defense, and defense with offense-it is an extremely advanced blade technique.\\nBut practicing with oars and paddles is bound to lead them astray."
    qcStatus: Corrected
    qcQualityScore: 95
    qcDefectCategory: DroppedContent
    qcDefectCategories:
    - DroppedContent
  - split: 1
    subIndex: 1
    text: "沧帮背后有上官世家撑腰，这是人人都心照不宣的秘密，就连翻浪刀法，都是从上官家传刀法演化出来的，改以船桨、船橹施展，反而欲盖弥彰。"
    translated: "Cang Gang has the Shangguan family backing them, a secret that everyone implicitly understands. Even the Flipping Wave Blade Art was derived from the Shangguan family's blade techniques, but instead of using knives, it employs oars and paddles, which only serves to draw more attention to the connection."
  - split: 1
    subIndex: 2
    text: "此刀法施展开来，有如江上波涛汹涌，连绵不绝，遇弱则阵阵相逼，遇强则意守后着，敌人若奋力相抗，不免扑空，一但露出破绽，后浪便咄咄逼来。刚中有柔，柔中有刚，攻中有守，守中有攻，是极上乘的刀法。"
    translated: "When this blade technique is unleashed, it's like waves surging on a river, continuous and unending. It presses relentlessly when encountering weakness, and holds back to await the right moment when facing strength. If the enemy fights back forcefully, they may find themselves off balance; once a gap appears, the next wave will bear down on them. It combines hardness with softness, softness with hardness, offense with defense, and defense with offense-it is an extremely advanced blade technique."
  - split: 1
    subIndex: 3
    text: "但你拿桨橹习练，注定学歪。"
    translated: "But practicing with oars is bound to lead them astray."
