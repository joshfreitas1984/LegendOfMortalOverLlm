    text: "江湖鬼蜮录．续"
- raw: "Book/Desc/8006,江湖鬼域录不具名受害者以口代手，咬笔所写的陈情录。\\n书中陈述他如何从一个天真无邪、四肢健全的孩童，被诈骗得家破人亡，流落异乡，自食其力却又被人构陷盗窃，获罪入狱，斩去双臂。\\n最终他逃出生天，以狱中苦练的核枣钉报仇雪恨。"
