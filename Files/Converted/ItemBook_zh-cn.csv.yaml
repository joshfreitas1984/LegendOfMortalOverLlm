    template: "{0}\\n{1}"
- raw: "Book/Name/7009,焚心火印"
  splits:
  - split: 1
    text: "焚心火印"
    translated: "Heartburn Seal"
- raw: "Book/Desc/7009,飞天门和夺魄门角逐崆峒门面之选，为求速成，不惜饮鸩止渴，以火蝎毒助长内力，强行突破瓶颈。\\n运使焚心火印，能够暂时加速心搏，推动血流、以燃烧余寿为代价，全面提升肉体能力。\\n但是代价不只这些，火毒囤积在体内，每达鼎盛就会溢于表征，轻则口干舌燥、牙龈渗血、失眠易怒，重则火气冲脑，不是痴呆就是暴毙。\\n每年端午阳气最盛之时尤为凶险，不可不慎。"
