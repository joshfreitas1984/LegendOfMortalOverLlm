- raw: "Book/Name/4003,蛇兔鹰猿搏"
  splits:
  - split: 1
    text: "蛇兔鹰猿搏"
- raw: "Book/Desc/4003,相传峨嵋派白猿祖师一日得闲，又去寻他山间猿友游戏，却不意撞见令他震惊至永生难以忘怀的奇葩场面。\\n山猿手抓小白兔，蛇缠住了猿猴的身体，老鹰从天而降扑击蛇，小白兔飞脱踩了老鹰的眼睛。\\n这画面转瞬即逝，四兽均受了偌大惊吓，四散逃亡，唯独白猿祖师怔然半晌，返屋后不思茶饭，终于第三日融会贯通，于早饭时拍案而起，当众弟子之面演示了这套蛇兔鹰猿搏。\\n众弟子各自印证，依资质高低领悟有多寡之别，却唯有一人参悟了兔形拳。"
  splits:
  - split: 1
    text: "相传峨嵋派白猿祖师一日得闲，又去寻他山间猿友游戏，却不意撞见令他震惊至永生难以忘怀的奇葩场面。"
