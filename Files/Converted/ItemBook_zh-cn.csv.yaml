    subIndex: 2
    text: "揍狗拳指称的狗，并非真狗，而是世间所有敌人。无论是谁都一视同仁，将他当狗毒打。区区狗仔，何足惧哉？只要认定自己会赢，气势压过对方，那怕是狼、是虎也得在你面前夹着尾巴逃跑。"
