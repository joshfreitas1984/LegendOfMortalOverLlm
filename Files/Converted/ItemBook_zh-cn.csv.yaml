    text: "清峰三十六路"
    translated: "Qingfeng Thirty Six Techniques"
- raw: "Book/Desc/4009,青城天下幽，有山阴阳三十六峰，背靠雪岭，林木森森，四季常青。\\n相传唐时有富贾，畏死而求仙，山下问童子，曰：「在林间。」林间问童子：「在山涧。」山涧问童子：「在峦颠。」一路连问三十六峰，又见童子。贾遂知神异，拜于地，童子笑曰：「孺子可教。清修何须苦烦恼，心谦不躁可问道。」\\n富贾清修多年，接任掌门，写下此书，字里行间都是闲游三十六峰的快活心境，初入山时的怕心，早已不知不觉遗落在路上了。"
  splits:
