    qcReviewedText: "The Beggar Sect's time-honored escape technique, when used en masse, is quite spectacular. Everyone scatters in all directions, as if communicating silently, some heading east while others heading west. This makes it difficult for enemies to catch them all at once, ensuring that at least one person will always escape to spread the news.\\nThis escape method is passed down in the form of a song, which goes:：Watch the east while heading west, with no place to run except up a tree. In groups of three or five, steel yourselves to face death, for life and death are predestined; do not linger. Though the words are crude and simple, they not only contain a crafty message but also prepare for the possibility of being caught."
