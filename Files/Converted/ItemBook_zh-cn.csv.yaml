- raw: "Book/Name/6007,夺魄幽灵爪"
  splits:
  - split: 1
    text: "夺魄幽灵爪"
- raw: "Book/Desc/6007,江湖第一美人夺魄幽兰的成名绝技。\\n揉合夺魄门暗袭之术与雪山派内功，身法如鬼魅，能勾人魂魄。\\n摧心、蚀骨、销魂、夺魄四式，一招狠似一招，极其毒辣，习之恐怕有伤天和。"
  splits:
