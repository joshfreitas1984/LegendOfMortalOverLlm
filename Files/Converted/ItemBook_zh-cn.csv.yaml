    text: "太祖长拳"
- raw: "Book/Desc/3001,因宋太祖赵匡胤而得名，讲究实战攻防，套路严谨，脚步灵活。\\n囚身似猫，抖身如虎，行似尤龙，动如闪电。\\n虽然冠以太祖之名，但其实是嵩山拳法。"
