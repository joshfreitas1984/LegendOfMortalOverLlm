- raw: "Book/Desc/6005,相传是陷空岛五义之一，排行老三的「穿山鼠徐庆」所擅长的武功。\\n徐庆是铁匠出身，力大无穷，有异术能钻地，故称穿山鼠，五鼠归顺开封府，辅佐包拯。\\n嘉佑七年，包公病逝，次年归葬合肥，五鼠一路相送，叩首拜别，各奔东西。\\n及后徐庆归隐崆峒，传下铁臂神拳与铁匠技术，逝于铁拳巷大铁铺。\\n修练者须双臂涂油，穿入铁环，运功令双臂充血坚硬，再使劲抡打木桩；抡断了木桩以后，抡石桩；抡断了石桩，抡铁桩。万一断的是手臂，就涂药膏待好了继续抡，久而久之，双手就会变得像铁一样。"
  splits:
  - split: 1
    text: "相传是陷空岛五义之一，排行老三的「穿山鼠徐庆」所擅长的武功。"
    translated: "This is said to be a martial art mastered by Tunnel Rat Xu Qing, one of the Five Righteousmen of the Sunken Hollow Island, who is ranked third."
    qcReviewedText: "This is said to be a martial art mastered by Tunnel Rat Xu Qing, one of the Five Righteousmen of the Sunken Hollow Island, who is ranked third.\\nXu Qing comes from a blacksmith background, is incredibly strong, and possesses a special technique that allows them to burrow underground, hence they are called Tunnel Rat. The Five Rats submitted to the Kaifeng Prefecture and have assisted Bao Zheng ever since.\\nIn the seventh year of the Jianyuan era, Bao Gong passed away. The following year, he was buried in Hefei, with the Five Rats escorting him to his grave, bowing and bidding farewell before going their separate ways.\\nLater, Xu Qing retreated to Kongtong, passing down the Iron Arm Divine Fist and blacksmithing techniques, and passed away at the Great Iron Workshop in Iron Fist Alley.\\nPractitioners must apply oil to their arms, insert them into iron rings, and use their strength to make their arms fill with blood and harden. Then, they must swing at wooden posts until they break; once the wooden posts are broken, they move on to stone posts; after breaking the stone posts, they swing at iron posts. If their arms break instead, they apply ointment to heal and continue swinging. Over time, their hands will become as hard as iron."
    qcStatus: Passed
    qcQualityScore: 100
    qcDefectCategory: None
