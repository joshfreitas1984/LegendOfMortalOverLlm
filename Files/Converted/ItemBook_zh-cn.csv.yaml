- raw: "Book/Name/7002,全真剑法"
  splits:
  - split: 1
    text: "全真剑法"
- raw: "Book/Desc/7002,全真教为了推广教义，开民智，而刻意外传的养气内功。\\n将剑诀删减，杂以养命之道，以浅白口语重新编译过，浅显易懂，可以初窥道学，延年益命。\\n乡亲父老人手一本，人人有功练，堪称国民健康操，但想要以此克敌制胜，恐怕是行不通的。"
  splits:
