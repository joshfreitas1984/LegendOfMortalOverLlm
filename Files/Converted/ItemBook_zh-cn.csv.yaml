- raw: "Book/Name/7016,虎啸功"
  splits:
  - split: 1
    text: "虎啸功"
- raw: "Book/Desc/7016,道门虎啸功，是以猛虎咆啸为譬，形容修道之人勇猛精进，有如猛虎一般威猛，使群邪辟易。\\n此功须由丹田内气外发，与人交手之际，发功呼啸，声如雷霆疾泻千里，使人心魄为之所夺，甚至还能造成内伤。"
