    text: "唐门暗器总纲"
- raw: "Book/Desc/1000,唐门弟子人手一本的武功秘籍，\\n与《毒经》并列二宝。\\n若无师长传授心诀、运劲手法，\\n仅靠自学极难寸进。\\n开篇《忘形论》你已读得滚瓜烂熟。"
  splits:
  - split: 1
    text: "唐门弟子人手一本的武功秘籍，"
  - split: 1
    subIndex: 1
    text: "与《毒经》并列二宝。"
  - split: 1
    subIndex: 2
    text: "若无师长传授心诀、运劲手法，"
  - split: 1
    subIndex: 3
    text: "仅靠自学极难寸进。"
  - split: 1
    subIndex: 4
