  splits:
  - split: 1
    text: "罗汉拳谱"
- raw: "Book/Desc/6001,嵩山寺中被盗出的拳经，是嵩山武功之根本，易学难精。\\n流转民间的罗汉拳谱在数百年间衍生出诸多套路，各领风骚，每本都不太一样，你也不知手里这本是否原版，你既然捡到了这本拳谱，你就有佛缘，练它。"
