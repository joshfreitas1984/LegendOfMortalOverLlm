- raw: "Book/Name/2005,斩天黑翼双龙剑"
  splits:
  - split: 1
    text: "斩天黑翼双龙剑"
- raw: "Book/Desc/2005,需要刀剑齐使才能施展，命名浮夸，招数本身却似乎华而不实，凭着气势一阵乱砍，意外很多人吃这套。"
  splits:
  - split: 1
    text: "需要刀剑齐使才能施展，命名浮夸，招数本身却似乎华而不实，凭着气势一阵乱砍，意外很多人吃这套。"
- raw: "Book/Name/2006,孔夫子剑"
  splits:
  - split: 1
    text: "孔夫子剑"
- raw: "Book/Desc/2006,这套剑法起草自儒家孔夫子手笔，与骑射之术一并传授弟子的剑术，及后孔夫子周游列国，网罗七国剑法，不断改良精进，身后更经数朝更迭，精益求精，如应「天行健，君子以自强不息」的卦象，刚毅图强，永不停息。\\n行己也恭，无所争，无适，无莫，临大节而不可夺，是谓谦仲平和之剑，君子之剑。"
  splits:
  - split: 1
    text: "这套剑法起草自儒家孔夫子手笔，与骑射之术一并传授弟子的剑术，及后孔夫子周游列国，网罗七国剑法，不断改良精进，身后更经数朝更迭，精益求精，如应「天行健，君子以自强不息」的卦象，刚毅图强，永不停息。"
  - split: 1
    subIndex: 1
    text: "行己也恭，无所争，无适，无莫，临大节而不可夺，是谓谦仲平和之剑，君子之剑。"
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Book/Name/2007,柴刀八斩法"
  splits:
  - split: 1
    text: "柴刀八斩法"
- raw: "Book/Desc/2007,峨嵋还是剑派时，遗传下来的古老锻身法，化繁为简，大开大阔，刚猛之处，却又峰回路转，留有余地。八路斩法看似平凡，其实，练不出高深武功，但于强健体魄、拉身筋骨帮助匪浅。"
  splits:
  - split: 1
    text: "峨嵋还是剑派时，遗传下来的古老锻身法，化繁为简，大开大阔，刚猛之处，却又峰回路转，留有余地。八路斩法看似平凡，其实，练不出高深武功，但于强健体魄、拉身筋骨帮助匪浅。"
- raw: "Book/Name/2008,八门锁金刀"
  splits:
  - split: 1
    text: "八门锁金刀"
- raw: "Book/Desc/2008,青城秘籍，根据《奇门遁甲》中八门方位、星象、地形所制定的单人阵法。\\n将此阵法分拆化简，融会入刀招，即成为八门锁金刀，精妙无穷。"
  splits:
  - split: 1
    text: "青城秘籍，根据《奇门遁甲》中八门方位、星象、地形所制定的单人阵法。"
  - split: 1
    subIndex: 1
    text: "将此阵法分拆化简，融会入刀招，即成为八门锁金刀，精妙无穷。"
