- raw: "Book/Name/2000,云霄雷霆霹雳刀"
  splits:
  - split: 1
    text: "云霄雷霆霹雳刀"
- raw: "Book/Desc/2000,创自前朝大侠雷沾，命名霸气，招数亦丝毫不含糊，招招大开大阔，好似真有九天之雷劈落的气势，出刀之际，还要搭配声嘶力竭的大喝，轰破敌人护体气劲。"
  splits:
  - split: 1
    text: "创自前朝大侠雷沾，命名霸气，招数亦丝毫不含糊，招招大开大阔，好似真有九天之雷劈落的气势，出刀之际，还要搭配声嘶力竭的大喝，轰破敌人护体气劲。"
- raw: "Book/Name/2001,流星剑谱"
  splits:
  - split: 1
    text: "流星剑谱"
- raw: "Book/Desc/2001,点苍派高深剑诀，剑光奔若流星，一泻千里。\\n不求飘逸，只求瞬发。穷究快剑二字，身剑合一，意发并进，快到连影子都追不上身法。\\n「足踏、曲弓蓄势、离」，无论身形如何，皆离不开这三句心诀，其快如弓箭离弦，瞬息而至，可瞬间欺入敌怀，不成功便成仁。"
  splits:
  - split: 1
    text: "点苍派高深剑诀，剑光奔若流星，一泻千里。"
  - split: 1
    subIndex: 1
    text: "不求飘逸，只求瞬发。穷究快剑二字，身剑合一，意发并进，快到连影子都追不上身法。"
  - split: 1
    subIndex: 2
    text: "「足踏、曲弓蓄势、离」，无论身形如何，皆离不开这三句心诀，其快如弓箭离弦，瞬息而至，可瞬间欺入敌怀，不成功便成仁。"
  templates:
