- raw: "Book/Name/7001,莲花落"
  splits:
  - split: 1
    text: "莲花落"
- raw: "Book/Desc/7001,丐帮人人都会唱的帮歌莲花落，其实是讲究求生技巧的一部内功歌诀。\\n每夜收工以后，由辈分较老的乞丐带着小辈齐唱，边唱边以筷敲碗，以此掌握节拍，配合歌曲换气，吐纳习惯自然养成。\\n只不过歌词往往粗鄙不堪，有辱斯文，有些对着姑娘家唱还会被报官。"
  splits:
  - split: 1
    text: "丐帮人人都会唱的帮歌莲花落，其实是讲究求生技巧的一部内功歌诀。"
