- raw: "Book/Name/7004,杨家练兵操"
  splits:
  - split: 1
    text: "杨家练兵操"
- raw: "Book/Desc/7004,北宋杨门忠烈的练兵体操。号称体操，然而为了确实提高沙场生还率，本操的锻炼强度不仅远超朝廷正规军，甚至比武林中小门派的功法还要严格，杂以棍操、一百零八阵操、铜锤十八打，这套体操即令是武林中人，怕也没几个受得了。"
  splits:
  - split: 1
    text: "北宋杨门忠烈的练兵体操。号称体操，然而为了确实提高沙场生还率，本操的锻炼强度不仅远超朝廷正规军，甚至比武林中小门派的功法还要严格，杂以棍操、一百零八阵操、铜锤十八打，这套体操即令是武林中人，怕也没几个受得了。"
- raw: "Book/Name/7005,龙吟功"
  splits:
  - split: 1
    text: "龙吟功"
- raw: "Book/Desc/7005,道门苍龙吟，是以九霄龙吟为譬，形容得道之人飞升清啸，有如龙吟破空般清亮。\\n此功须由丹田内气外发，与人交手之际，发功呼啸，声如雷霆疾泻千里，使人心魄为之所夺，甚至还能造成内伤。"
  splits:
  - split: 1
    text: "道门苍龙吟，是以九霄龙吟为譬，形容得道之人飞升清啸，有如龙吟破空般清亮。"
