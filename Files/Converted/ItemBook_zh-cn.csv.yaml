    template: "{0}\\n{1}\\n{2}"
- raw: "Book/Name/4006,雷神脚"
  splits:
  - split: 1
    text: "雷神脚"
- raw: "Book/Desc/4006,峨嵋派腿法之最，腾跃上天，潜卧于云波诡谲之间，吞吐无定，不鸣则已，一鸣惊人，动如九天神雷轰破云霄，似雷公降下天谴，威力万钧。\\n此腿法没有固定套路，有招无式，是为形意拳的究极型态，所象者乃天雷之形，是为雷神脚。"
  splits:
  - split: 1
    text: "峨嵋派腿法之最，腾跃上天，潜卧于云波诡谲之间，吞吐无定，不鸣则已，一鸣惊人，动如九天神雷轰破云霄，似雷公降下天谴，威力万钧。"
