    text: "十八种奇兵锻法杂记"
- raw: "Book/Desc/8004,崆峒铁拳门当代掌门雷谦所书的杂记。\\n他自知资质愚钝，唯恐先代巧艺失佚，虽无能开创新局，却发偌大宏愿，将诸般奇兵铸法整汇于此书之中。\\n这是一部写给凡人的书。"
