- raw: "Book/Name/7011,玄烛心经"
  splits:
  - split: 1
    text: "玄烛心经"
- raw: "Book/Desc/7011,锦香宫主费煞苦心创制，由南宫心法演化而来，旨在助人心意宁定，不致因为悲切而伤身。\\n玄烛意指月亮，故而此功又名望月心经。\\n人有悲欢离合，月有阴晴圆缺，此事古难全，可即使天各一方，照的都是同一片月光。\\n每当恸动之时，当行此功，收敛心神，化悲伤为力量，好好活着。"
