- raw: "Book/Desc/7000,经典江湖鬼蜮伎俩，很多小人都会用。\\n敌人太强，不敌之时，便抓准时机，自行运功封阻体内经脉，使气血凝滞，脉搏暂时停止，便好似死了一般。\\n待敌人离去后，再藉由预先藏于掌心的石灰发热将自身唤醒。\\n不过使用这套内功风险颇高，万一唤醒的机关不太灵验，醒来后也会因为脑缺氧从此变得痴痴呆呆；又万一招惹了狠角色，见你倒下了二话不说便先补个两刀子，假死就便真死了。"
  splits:
  - split: 1
    text: "经典江湖鬼蜮伎俩，很多小人都会用。"
    translated: "Many scoundrels use classic Jianghu tricks and schemes."
    qcReviewedText: "Many scoundrels use classic Jianghu tricks and schemes.\\nWhen the enemies are too strong, and you can't defeat them, seize the opportunity to use your own energy to block the meridians inside your body, causing your Lifeforce to stagnate and your pulse to temporarily stop, making it seem as if you are dead.\\nWait until the enemy has left, then use the lime heated in your palm to wake yourself up.\\nHowever, using this set of Neigong is quite risky. If the awakened Mechanism isn't reliable, you might wake up with brain oxygen deprivation and become mentally impaired forever. And if you happen to provoke a ruthless foe, they might deliver two fatalBlades to your body upon seeing you down, turning your fake death into a real one."
