- raw: "Book/Name/7006,混元童子气"
  splits:
  - split: 1
    text: "混元童子气"
- raw: "Book/Desc/7006,虽然效果强大、流传亦广，却没人要练的气功。这是因为此功乃是一门童子的缘故，殊为可惜。\\n听说一旦成亲，苦练而来的功力就会散去，任谁都不想孤独终老，所以没人愿意修练这套武功，然则这是世人的误解。所谓童子功，是指留守先天之气以养后天，故而由儿童时期起练最有效果的意思。若打娘胎出生便开始练，不出十二年即可大成。若志学之年起练，筋骨已成，先天之气逸散，则效果半减，而立之年再学，已无用处。\\n跟成亲与否其实没有关系。"
  splits:
  - split: 1
    text: "虽然效果强大、流传亦广，却没人要练的气功。这是因为此功乃是一门童子的缘故，殊为可惜。"
