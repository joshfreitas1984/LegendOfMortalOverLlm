    text: "现今已不存在的雪山派心法，修练方法非常特殊。需吸足真气，赤身裸体、头下脚上插进雪中，只将脚掌露在外边，再由旁人以艾炙足底涌泉穴，使修练者运使心法借艾炙的热力温经通络，调适体温、抵御冰雪。"
