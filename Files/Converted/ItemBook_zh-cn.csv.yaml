    qcReviewedText: "The Diancang Sword Sect's profound sword techniques produce a sword light that races like a meteor, streaming for thousands of miles.\\nNot seeking elegance, only instant execution. Striving for speed in the word 'fast sword,' integrating body and sword, with intent and action advancing together, moving so quickly that even shadows can't catch up.\\nStep, bend, aim, release, no matter the posture, all movements cannot depart from these three mental mantras. They are as swift as an arrow leaving the bow, arriving in an instant, allowing one to instantly close the distance with the enemy, success or death."
