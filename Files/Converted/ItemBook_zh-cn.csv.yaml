    subIndex: 1
    text: "三招剑意各有奥义，无分高下，得一足以独步江湖，但是十之有九，住上十天半个月都一无所获。"
    translated: "Each of the three sword intents has its own profound essence, with none being superior to the others. Mastering just one can make one stand out in Jianghu, but in reality, nine out of ten people return after ten days or half a month with nothing to show for it."
  - split: 1
    subIndex: 2
    text: "叶云裳好奇心使然，偷溜进去玩，片刻就被人提了出来。"
    translated: "Driven by curiosity, Ye Yunshang sneaked in to play but was soon dragged out by someone."
  - split: 1
    subIndex: 3
    text: "她虽不会武功，但是聪明绝顶，而又不落窠臼，仅那片刻，就若有所悟，只是年纪太小，迷迷糊糊。"
    translated: "Although they are not skilled in martial arts, they are incredibly clever and original, and within that brief moment, they seemed to gain some insight, though their young age left them somewhat confused."
  - split: 1
    subIndex: 4
    text: "今日诀别，才识离愁滋味，往事涌现心头，豁然顿悟，写就此招。"
    translated: "Today, as we part ways, I finally taste the bitterness of parting. Memories flood back, and I suddenly understand, thus creating this move."
  - split: 1
    subIndex: 5
    text: "虽只一式，却残念无穷，此剑即为剑圣第四极招－－「魂游故里芳盈袖，春啼晓，莫挽留」。"
    translated: "Though it is but a single move, it is filled with endless regret. This sword technique is the Sword Saint's fourth-tier move - Soul Wandering, Fragrance Fills the Sleeve, Spring's Dawn, Do Not Detain."
