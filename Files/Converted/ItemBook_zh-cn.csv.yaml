- raw: "Book/Name/4020,逍遥游腿法"
  splits:
  - split: 1
    text: "逍遥游腿法"
- raw: "Book/Desc/4020,全真派的轻功兼腿法，逍遥游出自庄子一书，亦是古琴曲。全真派弟子每日练功时会由传功师父奏曲，鲲化为鹏、翼若垂云、将徙天地、上干青霄、扶摇万里、御风冷然、气适北溟、磅礡万物、翱翔广和九段奏完，方始收功。"
  splits:
  - split: 1
    text: "全真派的轻功兼腿法，逍遥游出自庄子一书，亦是古琴曲。全真派弟子每日练功时会由传功师父奏曲，鲲化为鹏、翼若垂云、将徙天地、上干青霄、扶摇万里、御风冷然、气适北溟、磅礡万物、翱翔广和九段奏完，方始收功。"
- raw: "Book/Name/4030,八荒夺路逃"
  splits:
  - split: 1
    text: "八荒夺路逃"
- raw: "Book/Desc/4030,丐帮中人约定成俗的逃跑技巧，人多时使出非常壮观，一哄而散，四面八方夺路而出，如有心有灵犀般指东跑西，教敌人难以一网打尽，最终总会有落网之鱼可以回家通风报信。\\n这逃法以歌诀形式传唱，歌云：「眼看东边走西边，无处可逃上树颠，三五成群铁没命，生死有数莫拖牵。」词虽俗俚浅白，却不单有诡道、还提前做了万一落网的心理建设。"
  splits:
  - split: 1
    text: "丐帮中人约定成俗的逃跑技巧，人多时使出非常壮观，一哄而散，四面八方夺路而出，如有心有灵犀般指东跑西，教敌人难以一网打尽，最终总会有落网之鱼可以回家通风报信。"
  - split: 1
    subIndex: 1
    text: "这逃法以歌诀形式传唱，歌云"
  - split: 1
    subIndex: 2
    text: "「眼看东边走西边，无处可逃上树颠，三五成群铁没命，生死有数莫拖牵。」词虽俗俚浅白，却不单有诡道、还提前做了万一落网的心理建设。"
