- raw: "Book/Desc/8005,记载了种种江湖伎俩的醒世录，撰书人本意是提醒无辜百姓，莫受人欺，须知人心隔肚皮，害人之心不可有，防人之心亦不可无。\\n奈何此书落到坏人手里，登时就变成诈骗宝典，怎么带劲怎么来。"
