    qcReviewedText: "Qingcheng is a land of seclusion, with thirty-six peaks divided into Yin and Yang, backed by a snow-covered mountain range, its forests dense and ever green year-round.\\nLegend has it that in the Tang dynasty, there was a wealthy merchant who feared death and sought immortality. He asked a young boy at the foot of the mountain, and the boy said,：In the forest, the forest asked the boy.：In the mountain stream, Shan Jian asked the boy.：At the mountain peak. After asking about thirty-six peaks along the way, he saw the boy again. Jia then realized the boy's divine nature and bowed to the ground; the boy smiled and said,：Young one, you can be taught. Purifying your heart doesn't have to be a source of suffering; staying humble and calm will allow you to seek the Way.\\nThe wealthy merchant, after years of austere practice, took over as Sect Leader and wrote this book. Every word reflects the joyful mood of wandering among the thirty-six peaks. The fear they felt when first entering the mountain had long since been left behind, unnoticed, on the path."
