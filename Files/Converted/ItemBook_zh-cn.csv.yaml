    translated: "At the mountain peak. After asking about thirty-six peaks along the way, he saw the boy again. Jia then realized the boy's divine nature and bowed to the ground; the boy smiled and said,"
  - split: 1
    subIndex: 5
    text: "「孺子可教。清修何须苦烦恼，心谦不躁可问道。」"
    translated: "Young one, you can be taught. Purifying your heart doesn't have to be a source of suffering; staying humble and calm will allow you to seek the Way."
  - split: 1
    subIndex: 6
    text: "富贾清修多年，接任掌门，写下此书，字里行间都是闲游三十六峰的快活心境，初入山时的怕心，早已不知不觉遗落在路上了。"
    translated: "The wealthy merchant, after years of austere practice, took over as Sect Leader and wrote this book. Every word reflects the joyful mood of wandering among the thirty-six peaks. The fear they felt when first entering the mountain had long since been left behind, unnoticed, on the path."
