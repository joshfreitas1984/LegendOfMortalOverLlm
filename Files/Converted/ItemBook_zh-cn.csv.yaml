- raw: "Book/Name/6011,赤脚神通"
  splits:
  - split: 1
    text: "赤脚神通"
- raw: "Book/Desc/6011,与夺魄《镇魂功》、铁拳《伤拳》、玄功《铁琵琶功》同出《南岳真经》的飞天门失传神通。\\n飞天脚、仙鹤迷踪步的原始之型。\\n功成者可以一趾立地，无须屈膝使力，仅凭内力驱使，便能滑行疾飙。出脚时劲由身通腿，腿通脚，脚通趾，将万钧威力收束于一点，视乎意念，可刚可柔，刚能一趾点破金钟罩，柔能以趾劲封人穴道。"
  splits:
  - split: 1
    text: "与夺魄《镇魂功》、铁拳《伤拳》、玄功《铁琵琶功》同出《南岳真经》的飞天门失传神通。"
  - split: 1
    subIndex: 1
    text: "飞天脚、仙鹤迷踪步的原始之型。"
  - split: 1
    subIndex: 2
    text: "功成者可以一趾立地，无须屈膝使力，仅凭内力驱使，便能滑行疾飙。出脚时劲由身通腿，腿通脚，脚通趾，将万钧威力收束于一点，视乎意念，可刚可柔，刚能一趾点破金钟罩，柔能以趾劲封人穴道。"
  templates:
  - split: 1
    template: "{0}\\n{1}\\n{2}"
- raw: "Book/Name/6012,八仙指"
  splits:
  - split: 1
    text: "八仙指"
    translated: "Eight Immortals Finger"
- raw: "Book/Desc/6012,唐门女侠唐芬基于青城《八仙剑法》五行学说，以五毒替代之，创成的独门武功。\\n论招式至多二流，却隐含唐门医、毒二术，十分艰涩难读，读了也未必能有多大成就。"
