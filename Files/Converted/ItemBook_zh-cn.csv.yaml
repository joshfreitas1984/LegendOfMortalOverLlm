- raw: "Book/Name/6004,无影爪"
  splits:
  - split: 1
    text: "无影爪"
- raw: "Book/Desc/6004,曾经名动一时的怪盗铁面人所独创的爪功。\\n不循正理，而是剑走偏锋，潜于昏冥，化身为影，遁入黑夜，施以致命一击。\\n铁面人受命于庞太师，意欲袭杀包拯，反心折于包公铁面无私的气魄，不愿以私戕害青天，亦不敢背信，遂自舍优势，暗中行出，向南侠展昭请战，败得光明正大，自断十指，包拯遂赦免死罪。\\n铁面人归隐于崆峒，请人铸造铁爪义手，写就此书。"
  splits:
