- raw: "Book/Name/2200,天师剑法"
  splits:
  - split: 1
    text: "天师剑法"
- raw: "Book/Desc/2200,泥教六道法王，「判官」赵逵的成名绝招。形似起乩的招数匪夷所思，施展开来阴风阵阵、鬼气森森。虽是剑谱，也有符咒等异术的记载，非常诡异。\\n其实正邪焉能貌相，存乎一心而矣！我自一口正气足，何忧世人悠悠之口，不怒自威，宛如钟馗再世，手提三尺天师剑，不斩妖邪誓不休。"
  splits:
  - split: 1
    text: "泥教六道法王，「判官」赵逵的成名绝招。形似起乩的招数匪夷所思，施展开来阴风阵阵、鬼气森森。虽是剑谱，也有符咒等异术的记载，非常诡异。"
  - split: 1
    subIndex: 1
    text: "其实正邪焉能貌相，存乎一心而矣！我自一口正气足，何忧世人悠悠之口，不怒自威，宛如钟馗再世，手提三尺天师剑，不斩妖邪誓不休。"
