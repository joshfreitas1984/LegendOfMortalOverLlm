- raw: "Book/Name/3000,苦恼拳"
  splits:
  - split: 1
    text: "苦恼拳"
- raw: "Book/Desc/3000,嵩山寺中僧人禅修苦行，需得戒断三不善根，贪、嗔、痴是世间一切烦恼的根本，烦恼会驱使人造下种种恶业。\\n若要得解脱，须了知五蕴，远离颠倒梦想，方能究竟涅盘。\\n然而大道在此，世上又有几人能够办到？\\n这时，苦恼拳就是一个良善的治标方案，透过练拳挥洒汗水，累瘫了，自然就没力气胡思乱想了。"
  splits:
  - split: 1
    text: "嵩山寺中僧人禅修苦行，需得戒断三不善根，贪、嗔、痴是世间一切烦恼的根本，烦恼会驱使人造下种种恶业。"
