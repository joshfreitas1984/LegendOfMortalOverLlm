    text: "点苍棒法"
- raw: "Book/Desc/2303,叶云裳擅自涂改点苍剑谱所创的棒法。\\n没有杀伤力可言，但是补完了点苍剑法中不尽人意的缺憾之处，料敌所不料，单论招数变化，不失为妙着，就是卑鄙了一点，正常人不会这样。"
