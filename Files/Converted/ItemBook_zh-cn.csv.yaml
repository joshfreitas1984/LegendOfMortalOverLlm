- raw: "Book/Name/7012,南宫心法"
  splits:
  - split: 1
    text: "南宫心法"
- raw: "Book/Desc/7012,南宫家世代承传的家学心法，人手一本，歌诀大方的抄录在书本内页。\\n揉合道家思想，万变犹定，神怡气静，意守玄关，降伏邪气，虚怀若谷，心神清明。\\n以守心为本，而后护身、保家、卫国，是南宫家学的根基。"
