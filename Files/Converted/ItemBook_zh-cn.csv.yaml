    translated: "Although its effects are powerful and it is widely known, no one practices this qi-gong. This is because it is a practice meant for a virgin, which is a great pity."
    qcReviewedText: "Although its effects are powerful and it is widely known, no one practices this qi-gong. This is because it is a practice meant for a virgin, which is a great pity.\\nIt's said that once you get married, the martial arts skills you've diligently practiced will dissipate. No one wants to spend their old age alone, so no one is willing to train in this set of martial arts. However, this is a misconception. So-called youthful training refers to preserving innate energy to nourish later development, which is why it's most effective to start training from childhood. If you begin training right after birth, you can achieve mastery within twelve years. If you start at the age of ten, when your muscles and bones have already developed and your innate energy has started to dissipate, the effectiveness will be reduced by half. If you begin in your thirties, it will be of no use.\\nIt has nothing to do with whether they get married or not."
