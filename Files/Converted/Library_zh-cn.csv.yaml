    text: "你和夏侯兰回到大雪山，重建雪山派。"
    translated: "You and Xiahou Lan returned to the Great Snow Mountain to rebuild the Snow Mountain Sect."
  - split: 1
    subIndex: 1
    text: "不久夏侯兰诞下一子，忽然变成慈母，"
    translated: "Not long after Xiahou Lan gave birth to a son, they suddenly became a loving mother."
  - split: 1
    subIndex: 2
    text: "往昔暴戾之气荡然无存。"
    translated: "Their former ruthless demeanor is gone without a trace."
  - split: 1
    subIndex: 3
    text: "对你也是千依百顺。"
    translated: "I'll always follow your lead"
  - split: 1
    subIndex: 4
    text: "于是来年又生了一个女儿，子女都像娘亲。"
    translated: "So the following year, they had another daughter, who, like her siblings, took after their mother."
  templates:
  - split: 1
    template: "{0}\\n{1}\\n{2}\\n{3}\\n{4}"
- raw: "Library/Desc/40003,云裳与你执手游江南，乘舟听雨眠。\\n有你纵着宠着，她有恃无恐，\\n劣迹斑斑，到老不曾消停，此生完满无憾。\\n在这礼教森严的时代，没有父母之命，\\n不凭媒妁之言，所以厮守，纯粹投缘。"
  splits:
  - split: 1
    text: "云裳与你执手游江南，乘舟听雨眠。"
    translated: "Wear cloud‑like robes and wander hand in hand through the Jiangnan countryside; sail boats and sleep while listening to the rain."
  - split: 1
    subIndex: 1
    text: "有你纵着宠着，她有恃无恐，"
    translated: "With you indulging and pampering her, she acts without fear or restraint."
  - split: 1
    subIndex: 2
    text: "劣迹斑斑，到老不曾消停，此生完满无憾。"
    translated: "With a life full of misdeeds until the very end, they have no regrets and feel complete."
  - split: 1
    subIndex: 3
    text: "在这礼教森严的时代，没有父母之命，"
    translated: "In this era of strict social etiquette, without parental permission,"
  - split: 1
    subIndex: 4
    text: "不凭媒妁之言，所以厮守，纯粹投缘。"
    translated: "They are together not by arrangement through matchmakers, but because they hit it off."
  templates:
  - split: 1
    template: "{0}\\n{1}\\n{2}\\n{3}\\n{4}"
