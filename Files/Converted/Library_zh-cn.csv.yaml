    text: "毁灭性声波攻击"
    translated: "Destructive sonic attack"
- raw: "Library/Desc/20001,对于世界而言，你来得太早了。你的歌声(咆哮)唤醒了人们沉寂在心底的黑暗情感，使死亡金属音乐提前九百年降临在人间。"
  splits:
  - split: 1
    text: "对于世界而言，你来得太早了。你的歌声"
    translated: "You came too early for the world. Your song"
  - split: 1
    subIndex: 1
    text: "咆哮"
    translated: "Roar loudly"
  - split: 1
    subIndex: 2
    text: "唤醒了人们沉寂在心底的黑暗情感，使死亡金属音乐提前九百年降临在人间。"
    translated: "Awakened the dark emotions buried deep in people's hearts, bringing death metal music nine centuries early to humanity."
  templates:
  - split: 1
    template: "{0}({1}){2}"
- raw: "Library/Title/20002,青春的尾声，梦想的残渣"
  splits:
  - split: 1
    text: "青春的尾声，梦想的残渣"
    translated: "The twilight of youth, the remnants of dreams."
- raw: "Library/Desc/20002,你送别了梦想，成为大人，此后便不再做梦了。你听闻过他们的音讯，那些旧日时光却像前世一样遥远，难以追回。"
  splits:
  - split: 1
    text: "你送别了梦想，成为大人，此后便不再做梦了。你听闻过他们的音讯，那些旧日时光却像前世一样遥远，难以追回。"
    translated: "You bid farewell to your dreams and became an adult, after which you no longer dreamed. You have heard their news, but those old days feel as distant as a past life, difficult to reclaim."
- raw: "Library/Title/20003,唐门叛徒"
  splits:
  - split: 1
    text: "唐门叛徒"
    translated: "Traitor of the Tang Clan"
- raw: "Library/Desc/20003,你背叛了唐门。你说，是为了生存，为了荣华富贵，但内心深处，你知道自己背叛了那份比血还浓的师徒情。"
  splits:
  - split: 1
    text: "你背叛了唐门。你说，是为了生存，为了荣华富贵，但内心深处，你知道自己背叛了那份比血还浓的师徒情。"
    translated: "You betrayed the Tang Clan. You said it was for survival and glory, but deep down, you knew you had betrayed that bond deeper than blood between master and apprentice."
- raw: "Library/Title/20004,独善其身"
  splits:
  - split: 1
    text: "独善其身"
    translated: "To cultivate oneself alone"
- raw: "Library/Desc/20004,比起师门，你选择保全自身，转身逃跑了。纵使无可厚非，你却到老也难以释怀，时时梦见旧事，便热泪盈眶。"
  splits:
  - split: 1
    text: "比起师门，你选择保全自身，转身逃跑了。纵使无可厚非，你却到老也难以释怀，时时梦见旧事，便热泪盈眶。"
    translated: "Compared to the sect, you chose to protect yourself and turned to flee. Even though it is understandable, you will find it hard to let go for the rest of your life, often dreaming of the past and being filled with tears."
- raw: "Library/Title/20005,睡死"
  splits:
  - split: 1
    text: "睡死"
    translated: "Sleep to death"
- raw: "Library/Desc/20005,人世最苦莫过于独自清醒，愿君好梦安息。"
  splits:
  - split: 1
    text: "人世最苦莫过于独自清醒，愿君好梦安息。"
    translated: "The greatest suffering in life is to be awake alone; may you have sweet dreams and rest in peace."
- raw: "Library/Title/20006,孤独死"
  splits:
  - split: 1
    text: "孤独死"
    translated: "Lonely death"
- raw: "Library/Desc/20006,万籁俱寂，天地无声，你终于找到了安宁。"
  splits:
  - split: 1
    text: "万籁俱寂，天地无声，你终于找到了安宁。"
    translated: "In the profound silence, with the world hushed, you have finally found peace."
- raw: "Library/Title/20007,被煮的狗"
  splits:
  - split: 1
    text: "被煮的狗"
    translated: "Boiled dog"
- raw: "Library/Desc/20007,兔死狗烹，你这走狗已经没有用了。用张大饼就能骗得你团团转，可真划算。"
  splits:
  - split: 1
    text: "兔死狗烹，你这走狗已经没有用了。用张大饼就能骗得你团团转，可真划算。"
    translated: "When the rabbit dies, the dog is cooked; you, this running dog, are no longer of any use. With just a flatbread, I can deceive you completely, what a bargain."
- raw: "Library/Title/20008,竹之城"
  splits:
  - split: 1
    text: "竹之城"
    translated: "City of Bamboo"
- raw: "Library/Desc/20008,你托人弄来了竹苗，在岛上种了一片竹林，自称城主，在竹林围绕之下享天年而终。"
  splits:
  - split: 1
    text: "你托人弄来了竹苗，在岛上种了一片竹林，自称城主，在竹林围绕之下享天年而终。"
    translated: "You had someone bring bamboo seedlings and planted a grove of bamboo on the island, declaring yourself the lord of the city, living out your days surrounded by the bamboo forest."
- raw: "Library/Title/20009,退隐江湖"
  splits:
  - split: 1
    text: "退隐江湖"
    translated: "Retire from the Jianghu"
- raw: "Library/Desc/20009,离江湖纷扰，悠悠隔世，往后余生有如笔墨在纸上写下的日记，平淡无奇，日复一日，但每一天都不是虚度。你真实的活过，你自己记得。"
  splits:
  - split: 1
    text: "离江湖纷扰，悠悠隔世，往后余生有如笔墨在纸上写下的日记，平淡无奇，日复一日，但每一天都不是虚度。你真实的活过，你自己记得。"
    translated: "Separated from the turmoil of Jianghu, drifting through the ages, the rest of your life resembles a diary written in ink on paper, plain and unremarkable, day after day. Yet, each day is not wasted. You have truly lived, and you remember it yourself."
- raw: "Library/Title/20010,魂归故里"
  splits:
  - split: 1
    text: "魂归故里"
    translated: "The soul returns to its homeland"
- raw: "Library/Desc/20010,欢迎回家。"
  splits:
  - split: 1
    text: "欢迎回家。"
    translated: "Welcome home"
- raw: "Library/Title/20011,孤独终老"
  splits:
  - split: 1
    text: "孤独终老"
    translated: "Lonely until old age"
- raw: "Library/Desc/20011,你身边的花盛开又谢，来去匆匆，而你始终孤独。"
  splits:
  - split: 1
    text: "你身边的花盛开又谢，来去匆匆，而你始终孤独。"
    translated: "The flowers around you bloom and wither, coming and going in a hurry, while you remain forever alone."
- raw: "Library/Title/20012,西游记"
  splits:
  - split: 1
    text: "西游记"
    translated: "Journey to the West"
- raw: "Library/Desc/20012,你远赴西域，寻了稳妥营生，学当地的语言与风尚礼节，花钱买了妻子，到老没生大病，临终亦有儿女侍疾，该算是美满才对啊……。"
  splits:
  - split: 1
    text: "你远赴西域，寻了稳妥营生，学当地的语言与风尚礼节，花钱买了妻子，到老没生大病，临终亦有儿女侍疾，该算是美满才对啊……。"
    translated: "You traveled far to the Western Regions, sought a stable livelihood, learned the local language and customs, spent money to acquire a wife, lived to old age without serious illness, and had children to care for you in your final days. That should be considered a fulfilling life, right...?"
- raw: "Library/Title/20013,天下寂寥事，与君阔别时"
  splits:
  - split: 1
    text: "天下寂寥事，与君阔别时"
    translated: "The world is desolate, especially when I am apart from you."
- raw: "Library/Desc/20013,仗剑天涯之远，惯看寂寞颜色。天下之大，谁也换不了她开颜浅笑。活该一生煎熬，来赎她眼泪。"
  splits:
  - split: 1
    text: "仗剑天涯之远，惯看寂寞颜色。天下之大，谁也换不了她开颜浅笑。活该一生煎熬，来赎她眼泪。"
    translated: "Wielding a sword across the vast world, accustomed to the colors of solitude. In this great land, no one can replace her gentle smile. It is only right that she endures a lifetime of suffering to atone for her tears."
- raw: "Library/Title/20014,天下寂寥事，与君阔别时"
  splits:
  - split: 1
    text: "天下寂寥事，与君阔别时"
    translated: "The world is desolate, especially when I am apart from you."
- raw: "Library/Desc/20014,仗剑天涯之远，惯看寂寞颜色。天下之大，谁也换不了她嫣然一笑。活该一生煎熬，来赎她眼泪。"
  splits:
  - split: 1
    text: "仗剑天涯之远，惯看寂寞颜色。天下之大，谁也换不了她嫣然一笑。活该一生煎熬，来赎她眼泪。"
    translated: "Wielding a sword across distant horizons, accustomed to the colors of solitude. In this vast world, no one can replace her enchanting smile. She is destined to endure a lifetime of torment to atone for her tears."
- raw: "Library/Title/20015,猿鹤虫沙"
  splits:
  - split: 1
    text: "猿鹤虫沙"
    translated: "Yuanhe Chongsha"
- raw: "Library/Desc/20015,《抱朴子》曰：「周穆王南征，一军尽化，君子为猿为鹤，小人为虫为沙。」死后尽归黄土。"
  splits:
  - split: 1
    text: "《抱朴子》曰"
    translated: "The Book of Master Embracing Simplicity says"
  - split: 1
    subIndex: 1
    text: "「周穆王南征，一军尽化，君子为猿为鹤，小人为虫为沙。」死后尽归黄土。"
    translated: "During King Mu of Zhou's southern campaign, his entire army was transformed: the nobles became apes and cranes, while the commoners turned into insects and grains of sand. After death, all return to the earth."
  templates:
  - split: 1
    template: "{0}：{1}"
- raw: "Library/Title/20016,盲剑客"
  splits:
  - split: 1
    text: "盲剑客"
    translated: "Blind Swordsman"
- raw: "Library/Desc/20016,你瞎眼之后，龙湘十分愧疚，将一身剑法传授给你。你一度凭此扬名于江湖，但是几年以后碰上了狡猾小人，设陷阱害你踏空，随后将你活埋了。"
  splits:
  - split: 1
    text: "你瞎眼之后，龙湘十分愧疚，将一身剑法传授给你。你一度凭此扬名于江湖，但是几年以后碰上了狡猾小人，设陷阱害你踏空，随后将你活埋了。"
    translated: "After you went blind, Long Xiang felt deeply guilty and passed on all their swordsmanship to you. For a time, you gained fame in the Jianghu, but a few years later, you encountered a cunning villain who set a trap to cause you to stumble and subsequently buried you alive."
- raw: "Library/Title/20017,被关到老"
  splits:
  - split: 1
    text: "被关到老"
    translated: "Locked away until old age"
- raw: "Library/Desc/20017,你的后半生都在牢里度过，日复一日都面对同一堵墙。往事既遥远又鲜明，回过神来也已经离你好远好远了。"
  splits:
  - split: 1
    text: "你的后半生都在牢里度过，日复一日都面对同一堵墙。往事既遥远又鲜明，回过神来也已经离你好远好远了。"
    translated: "You spent the latter half of your life in prison, facing the same wall day after day. The past feels both distant and vivid, and when you come to your senses, it has already drifted far away from you."
- raw: "Library/Title/20018,流浪汉"
  splits:
  - split: 1
    text: "流浪汉"
    translated: "Vagrant"
- raw: "Library/Desc/20018,浪迹天涯说得潇洒，说穿便是流浪汉罢。你没有家。"
  splits:
  - split: 1
    text: "浪迹天涯说得潇洒，说穿便是流浪汉罢。你没有家。"
    translated: "Wandering the world sounds carefree, but to put it plainly, it's just being a drifter. You have no home."
- raw: "Library/Title/20019,入无穷之门，游无极之野"
  splits:
  - split: 1
    text: "入无穷之门，游无极之野"
    translated: "Enter the gate of infinity, roam the boundless fields."
- raw: "Library/Desc/20019,道可道，非常道。\\n你所悟越深，能言越少，终至万籁俱寂，天地无声。\\n你没有留下足迹，不施不欠，就像自始自终不曾存在。"
  splits:
  - split: 1
    text: "道可道，非常道。"
    translated: "The Way that can be expressed is not the eternal Way."
  - split: 1
    subIndex: 1
    text: "你所悟越深，能言越少，终至万籁俱寂，天地无声。"
    translated: "The deeper your realization, the fewer words you speak, until finally all is silent, and the world is without sound."
  - split: 1
    subIndex: 2
    text: "你没有留下足迹，不施不欠，就像自始自终不曾存在。"
    translated: "You left no trace, neither owed nor owing, as if you had never existed from the start."
  templates:
  - split: 1
    template: "{0}\\n{1}\\n{2}"
- raw: "Library/Title/20020,退隐江湖"
  splits:
  - split: 1
    text: "退隐江湖"
    translated: "Retire from the Jianghu"
- raw: "Library/Desc/20020,你封剑退隐，一生不再与人动武，活到天命之年。\\n偶尔有人对你友善，但有更多的人无端厌恶你、仇视你、嘲讽你。\\n恶意无处不在，离了江湖亦然，人间就是这样。"
  splits:
  - split: 1
    text: "你封剑退隐，一生不再与人动武，活到天命之年。"
    translated: "You sheathed your sword and retired, never again engaging in combat with others, living until your appointed time."
  - split: 1
    subIndex: 1
    text: "偶尔有人对你友善，但有更多的人无端厌恶你、仇视你、嘲讽你。"
    translated: "Sometimes someone is kind to you, but there are many more who dislike you for no reason, hate you, and mock you."
  - split: 1
    subIndex: 2
    text: "恶意无处不在，离了江湖亦然，人间就是这样。"
    translated: "Malice is everywhere, and even outside the Jianghu, it remains the same; that's just how the world is."
  templates:
  - split: 1
    template: "{0}\\n{1}\\n{2}"
- raw: "Library/Title/20021,恩仇的尽头"
  splits:
  - split: 1
    text: "恩仇的尽头"
    translated: "The End of Grudges and Affections"
- raw: "Library/Desc/20021,你的怒火将天边的云霞都烧得通红。报了恩，也报了仇。\\n恩怨皆成灰，席卷上天，随风远去。"
  splits:
  - split: 1
    text: "你的怒火将天边的云霞都烧得通红。报了恩，也报了仇。"
    translated: "Their anger turned the clouds on the horizon blood‑red. They avenged both a debt of gratitude and a grievance."
  - split: 1
    subIndex: 1
    text: "恩怨皆成灰，席卷上天，随风远去。"
    translated: "All grudges and affections turn to ash, swept up to the heavens, carried away by the wind."
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Library/Title/20022,宦海浮沉"
  splits:
  - split: 1
    text: "宦海浮沉"
    translated: "The ups and downs of the officialdom"
- raw: "Library/Desc/20022,你学会官场交际，对上逢迎拍马，对下蛮横无情。\\n就是面目丑恶，只要权势够大，一样没人敢说你闲话。\\n只是那些噤若寒蝉的人们、那些终生不来看望你的江湖旧友，心底有没有瞧不起你，那就难说了。"
  splits:
  - split: 1
    text: "你学会官场交际，对上逢迎拍马，对下蛮横无情。"
    translated: "You've mastered political flattery, ingratiating yourself with superiors and bullying those below you with callous indifference."
  - split: 1
    subIndex: 1
    text: "就是面目丑恶，只要权势够大，一样没人敢说你闲话。"
    translated: "Even if someone is hideously ugly, as long as they have enough power, no one will dare to gossip about them."
  - split: 1
    subIndex: 2
    text: "只是那些噤若寒蝉的人们、那些终生不来看望你的江湖旧友，心底有没有瞧不起你，那就难说了。"
    translated: "It's uncertain whether those who have kept silent like cicadas in winter, and your old Jianghu friends who never came to visit you, look down on you in their hearts."
  templates:
  - split: 1
    template: "{0}\\n{1}\\n{2}"
- raw: "Library/Title/20023,赶海人"
  splits:
  - split: 1
    text: "赶海人"
    translated: "Beachcomber"
- raw: "Library/Desc/20023,你一相情愿认为她被溪水冲走了，循着岷江穿流一路向东，直到海边，可是那里也没有她的身影。你每日都看着海，日渐苍老，悔不当初。"
  splits:
  - split: 1
    text: "你一相情愿认为她被溪水冲走了，循着岷江穿流一路向东，直到海边，可是那里也没有她的身影。你每日都看着海，日渐苍老，悔不当初。"
    translated: "You stubbornly believe that she was swept away by the stream, flowing along the Min River all the way east to the sea, but there is no trace of her there either. Every day you gaze at the sea, growing older with each passing day, regretting your past decisions."
- raw: "Library/Title/20024,退隐江湖"
  splits:
  - split: 1
    text: "退隐江湖"
    translated: "Retire from the Jianghu"
- raw: "Library/Desc/20024,你退隐之后，江湖故事再也不闻不问。\\n波澜都在头先廿载，余生不受盛名所牵。你来过，你走了，也许没人在意，可是你自己晓得。"
  splits:
  - split: 1
    text: "你退隐之后，江湖故事再也不闻不问。"
    translated: "Since your retirement, you no longer hear anything about the stories of Jianghu."
  - split: 1
    subIndex: 1
    text: "波澜都在头先廿载，余生不受盛名所牵。你来过，你走了，也许没人在意，可是你自己晓得。"
    translated: "The ripples of my past twenty years have all subsided. For the rest of my life, I won't be bound by my fame. You came, you went, perhaps no one cared, but you know yourself."
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Library/Title/20025,山中老人"
  splits:
  - split: 1
    text: "山中老人"
    translated: "Elderly person in the mountains"
- raw: "Library/Desc/20025,你老年被称为山中老人，是天下暗杀者的老祖宗。\\n千面人魔的传说还在延续，恐惧笼罩这片大地。"
  splits:
  - split: 1
    text: "你老年被称为山中老人，是天下暗杀者的老祖宗。"
    translated: "They were known in old age as Old Man of the Mountain, the ancestor of all assassins in the world."
  - split: 1
    subIndex: 1
    text: "千面人魔的传说还在延续，恐惧笼罩这片大地。"
    translated: "The legend of the Thousand Faced Demon continues, and fear casts a shadow over this land."
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Library/Title/20026,世外桃源"
  splits:
  - split: 1
    text: "世外桃源"
    translated: "Paradise on earth"
- raw: "Library/Desc/20026,往昔恩怨随风散，岁月悠悠不染尘，你俩的余生既慢且好。"
  splits:
  - split: 1
    text: "往昔恩怨随风散，岁月悠悠不染尘，你俩的余生既慢且好。"
    translated: "Past grievances scatter with the wind, and the years flow by without taint. May the two of you enjoy a slow and good life in the days to come."
- raw: "Library/Title/20027,血河刀"
  splits:
  - split: 1
    text: "血河刀"
    translated: "Blood River Blade"
- raw: "Library/Desc/20027,江湖人利欲熏心，无人猜得到你不怀好意。\\n你用这把刀给唐门报了仇，未斩一人，刀下已伏尸千万，血流成河。"
  splits:
  - split: 1
    text: "江湖人利欲熏心，无人猜得到你不怀好意。"
    translated: "People in the Jianghu are blinded by greed; no one suspects your ill intentions."
  - split: 1
    subIndex: 1
    text: "你用这把刀给唐门报了仇，未斩一人，刀下已伏尸千万，血流成河。"
    translated: "You avenged the Tang Clan with this knife, yet you spared no one, leaving thousands dead at its blade, with blood flowing in rivers."
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Library/Title/20028,再世庞统"
  splits:
  - split: 1
    text: "再世庞统"
    translated: "Reincarnation of Pang Tong"
- raw: "Library/Desc/20028,深谋远虑是假，只有其貌不扬是真的。\\n拜你所赐，唐门的冤屈得以平反，虽然大家各散东西，却都扬眉吐气。"
  splits:
  - split: 1
    text: "深谋远虑是假，只有其貌不扬是真的。"
    translated: "Their far‑sighted plans are a facade; the only truth is that they are plain‑looking."
  - split: 1
    subIndex: 1
    text: "拜你所赐，唐门的冤屈得以平反，虽然大家各散东西，却都扬眉吐气。"
    translated: "Thanks to you, the Tang Clan's wrongful accusations have been cleared, even though everyone has gone their separate ways, they all feel vindicated."
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Library/Title/20029,山林隐逸"
  splits:
  - split: 1
    text: "山林隐逸"
    translated: "Mountain Forest Retreat"
- raw: "Library/Desc/20029,你俩是隐居的雅士，反正这个时代配不上你们，不妨孤芳自赏、独善其身，晴时耕牧雨读书，夏赏荷花冬赏雪，不也畅怀？"
  splits:
  - split: 1
    text: "你俩是隐居的雅士，反正这个时代配不上你们，不妨孤芳自赏、独善其身，晴时耕牧雨读书，夏赏荷花冬赏雪，不也畅怀？"
    translated: "You two are reclusive scholars; this era is unworthy of you. Why not appreciate your own company, cultivate your character, and spend sunny days farming and herding while reading on rainy days? Enjoy the lotus flowers in summer and the snow in winter‑doesn't that bring joy?"
- raw: "Library/Title/20030,传说之人"
  splits:
  - split: 1
    text: "传说之人"
    translated: "Legendary Person"
- raw: "Library/Desc/20030,世人众说纷纭，都想知道那位头戴人皮面具的前辈高人是何方神圣，然而，你那天根本没戴面具。"
  splits:
  - split: 1
    text: "世人众说纷纭，都想知道那位头戴人皮面具的前辈高人是何方神圣，然而，你那天根本没戴面具。"
    translated: "The world is abuzz with speculation, all wanting to know who that senior expert is, wearing a human skin mask. However, you weren't wearing a mask at all that day."
- raw: "Library/Title/20031,殉志而死"
  splits:
  - split: 1
    text: "殉志而死"
    translated: "Die for one's ideals"
- raw: "Library/Desc/20031,这一路太长太远，本来就强人所难，你已经足够努力了。"
  splits:
  - split: 1
    text: "这一路太长太远，本来就强人所难，你已经足够努力了。"
    translated: "This journey is too long and too far; it was already asking too much of you. You have already tried your best."
- raw: "Library/Title/20032,全军覆没"
  splits:
  - split: 1
    text: "全军覆没"
    translated: "Total defeat"
- raw: "Library/Desc/20032,是日，唐门叛逆全歼于眉山，无一幸还。大院外堡付之一炬，功过皆化乌有。你们活过，只是谁也不记得了。"
  splits:
  - split: 1
    text: "是日，唐门叛逆全歼于眉山，无一幸还。大院外堡付之一炬，功过皆化乌有。你们活过，只是谁也不记得了。"
    translated: "On this day, the rebels of the Tang Clan were completely annihilated at Meishan, with not a single one surviving. The fortress outside the courtyard was set ablaze, and all achievements and failures have turned to nothing. You have survived, but no one remembers you."
- raw: "Library/Title/20033,行尸走肉"
  splits:
  - split: 1
    text: "行尸走肉"
    translated: "Walking Dead"
- raw: "Library/Desc/20033,你活着，却已死了很久。\\n夏侯兰后悔那日不该绑着你，让你多受几十年煎熬。"
  splits:
  - split: 1
    text: "你活着，却已死了很久。"
    translated: "You are alive, yet you have been dead for a long time."
  - split: 1
    subIndex: 1
    text: "夏侯兰后悔那日不该绑着你，让你多受几十年煎熬。"
    translated: "Xiahou Lan regrets that day when they shouldn't have tied you up, making you suffer for decades."
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Library/Title/20034,慷慨就义"
  splits:
  - split: 1
    text: "慷慨就义"
    translated: "Heroic sacrifice"
- raw: "Library/Desc/20034,你有路可活，可你非要做那唐门弟子，笑看生杀，慷慨赴义。"
  splits:
  - split: 1
    text: "你有路可活，可你非要做那唐门弟子，笑看生杀，慷慨赴义。"
    translated: "You have a way to survive, yet you insist on being a Tang Clan Disciple, watching life and death with a smile, generously embracing righteousness."
- raw: "Library/Title/20035,唐门的暗器"
  splits:
  - split: 1
    text: "唐门的暗器"
    translated: "The Hidden Weapons of the Tang Clan"
- raw: "Library/Desc/20035,人死如灯灭，你们燃尽了生命之火，还以颜色。\\n几十年后，世人依然记得唐门绝响。"
  splits:
  - split: 1
    text: "人死如灯灭，你们燃尽了生命之火，还以颜色。"
    translated: "When a person dies, it's like a lamp going out. You have burned out your health, and now it's your turn to taste the same."
  - split: 1
    subIndex: 1
    text: "几十年后，世人依然记得唐门绝响。"
    translated: "Decades later, people still remember the final performance of the Tang Clan."
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Library/Title/20036,唐门薪火"
  splits:
  - split: 1
    text: "唐门薪火"
    translated: "Tang Clan Legacy"
- raw: "Library/Desc/20036,世上再无唐门，可是薪火不曾断绝。有你和小师妹，以及你们未来的家人。\\n唐门最初是一家人，最后仍是一家人。唐家香火，还将继续传承。"
  splits:
  - split: 1
    text: "世上再无唐门，可是薪火不曾断绝。有你和小师妹，以及你们未来的家人。"
    translated: "Though the Tang Clan no longer exists, its legacy continues. With you and Little Junior Sister, and the future families you will build."
  - split: 1
    subIndex: 1
    text: "唐门最初是一家人，最后仍是一家人。唐家香火，还将继续传承。"
    translated: "The Tang Clan started as a family, and in the end, they remain a family. The legacy of the Tang family will continue to be passed down."
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Library/Title/20037,神州旅人"
  splits:
  - split: 1
    text: "神州旅人"
    translated: "Traveler of the Divine Land"
- raw: "Library/Desc/20037,你们的旅行，从出发那一日就没停过，走到哪儿玩到哪，她出钱，你卖命，拜访过旧友，又不吝情去留，绕遍神州大地，足迹止于昆仑山。"
  splits:
  - split: 1
    text: "你们的旅行，从出发那一日就没停过，走到哪儿玩到哪，她出钱，你卖命，拜访过旧友，又不吝情去留，绕遍神州大地，足迹止于昆仑山。"
    translated: "Your journey has not stopped since the day you set off, playing wherever you go. They pay for everything while you give your all, visiting old friends without holding back your feelings, traveling all over the land, with your footsteps finally resting at Kunlun Mountain."
- raw: "Library/Title/20038,富甲一方"
  splits:
  - split: 1
    text: "富甲一方"
    translated: "Wealthy beyond compare"
- raw: "Library/Desc/20038,托上官萤故，赵家成为富甲一方的大户人家。\\n上官萤渐渐把生意交给你，自己执掌中馈。\\n身为贤妻良母，她从来不打小孩，倘若小孩犯了错，就打你。"
  splits:
  - split: 1
    text: "托上官萤故，赵家成为富甲一方的大户人家。"
    translated: "Thanks to Shangguan Ying, the Zhao family became a wealthy household in the area."
  - split: 1
    subIndex: 1
    text: "上官萤渐渐把生意交给你，自己执掌中馈。"
    translated: "Shangguan Ying gradually handed over the business to you and took charge of managing the household."
  - split: 1
    subIndex: 2
    text: "身为贤妻良母，她从来不打小孩，倘若小孩犯了错，就打你。"
    translated: "As a virtuous wife and mother, she never hits children; if a child makes a mistake, she hits you instead."
  templates:
  - split: 1
    template: "{0}\\n{1}\\n{2}"
- raw: "Library/Title/20039,小梅私藏"
  splits:
  - split: 1
    text: "小梅私藏"
    translated: "Xiao Mei's Secret Collection"
- raw: "Library/Desc/20039,小梅平时贤慧温柔，只是一受刺激就会犯病将你放倒蹂躏。她曾持刀把方圆百里所有女子都恐吓过一遍，警告她们不许靠近你。"
  splits:
  - split: 1
    text: "小梅平时贤慧温柔，只是一受刺激就会犯病将你放倒蹂躏。她曾持刀把方圆百里所有女子都恐吓过一遍，警告她们不许靠近你。"
    translated: "Xiao Mei is usually wise and gentle, but when provoked, she can become fierce and overpowering. She once wielded a blade to intimidate all the women within a hundred‑mile radius, warning them not to come near you."
- raw: "Library/Title/20040,千古名匠"
  splits:
  - split: 1
    text: "千古名匠"
    translated: "Master of the Ages"
- raw: "Library/Desc/20040,你和小竹造出了精妙绝伦的机关人，藏于池水之下，因为机关构造过于复杂，不得不造得大些，分为人、狮、鹰，可以合体。\\n如此成就，足以青史留名，但你们唯恐机关人遭到恶用，最终还是决定毁去。"
  splits:
  - split: 1
    text: "你和小竹造出了精妙绝伦的机关人，藏于池水之下，因为机关构造过于复杂，不得不造得大些，分为人、狮、鹰，可以合体。"
    translated: "You and Xiao Zhu created an ingenious mechanical automaton, hiding it beneath the pond water. Due to its intricate design, it had to be larger, divided into human, lion, and eagle forms, which can combine."
  - split: 1
    subIndex: 1
    text: "如此成就，足以青史留名，但你们唯恐机关人遭到恶用，最终还是决定毁去。"
    translated: "Such achievements would have been enough to leave a name in history books, but fearing that Mechanisms might be put to evil use, you ultimately decided to destroy them."
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Library/Title/20041,隐世大儒"
  splits:
  - split: 1
    text: "隐世大儒"
    translated: "Reclusive Sage"
- raw: "Library/Desc/20041,你夫妻有风骨而不骄衿。\\n文士雅士、贩夫走卒都无任欢迎。\\n谈笑有鸿儒，往来亦不拒白丁，士农工商皆可为友，平等尊敬认真生活的每个人。"
  splits:
  - split: 1
    text: "你夫妻有风骨而不骄衿。"
    translated: "You both have integrity and composure without being arrogant."
  - split: 1
    subIndex: 1
    text: "文士雅士、贩夫走卒都无任欢迎。"
    translated: "Scholars and common traders alike are welcome"
  - split: 1
    subIndex: 2
    text: "谈笑有鸿儒，往来亦不拒白丁，士农工商皆可为友，平等尊敬认真生活的每个人。"
    translated: "Chatting with refined scholars, also welcoming commoners without disdain, making friends with people from all walks of life‑scholars, farmers, artisans, and merchants‑respecting and valuing everyone who lives with dignity."
  templates:
  - split: 1
    template: "{0}\\n{1}\\n{2}"
- raw: "Library/Title/20042,失宠"
  splits:
  - split: 1
    text: "失宠"
    translated: "Fallen out of favor"
- raw: "Library/Desc/20042,有了孩子以后，夏侯兰冰冷的心终于化了，而你也失宠了。\\n她专心相夫教子，经常庆幸孩子像她不像你，也不许你打骂小孩，极端宠腻。\\n为了孩子能有良好的教育，某天出门活捉了魏菊回家担任夫子。"
  splits:
  - split: 1
    text: "有了孩子以后，夏侯兰冰冷的心终于化了，而你也失宠了。"
    translated: "After Xiahou Lan had a child, their cold heart finally melted, but you fell out of favor."
  - split: 1
    subIndex: 1
    text: "她专心相夫教子，经常庆幸孩子像她不像你，也不许你打骂小孩，极端宠腻。"
    translated: "She focuses on caring for her husband and raising her children, often feeling fortunate that her kids take after her and not you. She doesn't allow you to hit or scold them, indulging them completely."
  - split: 1
    subIndex: 2
    text: "为了孩子能有良好的教育，某天出门活捉了魏菊回家担任夫子。"
    translated: "To ensure their child could receive a good education, one day they went out and brought Wei Ju home to serve as a tutor."
  templates:
  - split: 1
    template: "{0}\\n{1}\\n{2}"
- raw: "Library/Title/20043,鸡腿大亨"
  splits:
  - split: 1
    text: "鸡腿大亨"
    translated: "Chicken Tycoon"
- raw: "Library/Desc/20043,龙渊悄悄来看过你们，一度气得眼冒金星，想想自己也没啥出息，索性就由着你们。\\n反正轰轰烈烈的活、平平安安的过，同样是一生。你的岳丈对你要求不多，不用你管天下苍生，只要保护自己家人，只做她的英雄足矣。"
  splits:
  - split: 1
    text: "龙渊悄悄来看过你们，一度气得眼冒金星，想想自己也没啥出息，索性就由着你们。"
    translated: "Long Yuan secretly came to see you all once and was so furious that his eyes flashed with golden stars. Thinking about it, he figured he wasn't much better either, so he decided to let you all have your way."
  - split: 1
    subIndex: 1
    text: "反正轰轰烈烈的活、平平安安的过，同样是一生。你的岳丈对你要求不多，不用你管天下苍生，只要保护自己家人，只做她的英雄足矣。"
    translated: "Living life grandly or living it peacefully are both just one life. Your father‑in‑law doesn't expect much from you; you don't need to worry about the welfare of all people. You just need to protect your family and be her hero."
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Library/Title/20044,最后的唐门弟子"
  splits:
  - split: 1
    text: "最后的唐门弟子"
    translated: "Last Tang Clan Disciple"
- raw: "Library/Desc/20044,你打算尽可能活久一点，要是连你都没了，世上就再也没人记得唐门了。"
  splits:
  - split: 1
    text: "你打算尽可能活久一点，要是连你都没了，世上就再也没人记得唐门了。"
    translated: "You plan to live as long as possible; if you are gone, no one in the world will remember the Tang Clan."
- raw: "Library/Title/20045,相声二人组"
  splits:
  - split: 1
    text: "相声二人组"
    translated: "Crosstalk duo"
- raw: "Library/Desc/20045,你们有时甚至不必准备剧本，随口说话就能引人发笑，你长得越奇怪反而越受欢迎，这才知道原来相声是你的天职。在这领域，你比大师兄还受欢迎，拥有他嫉妒不来的才能。"
  splits:
  - split: 1
    text: "你们有时甚至不必准备剧本，随口说话就能引人发笑，你长得越奇怪反而越受欢迎，这才知道原来相声是你的天职。在这领域，你比大师兄还受欢迎，拥有他嫉妒不来的才能。"
    translated: "You don't even need a script sometimes; you can make people laugh off the cuff. The weirder you look, the more popular you become. It's only then that you realize that crosstalk is your calling. In this field, you're more popular than Big Senior Brother, with a talent that even he can't help but envy."
- raw: "Library/Title/20046,君所愿兮江湖行"
  splits:
  - split: 1
    text: "君所愿兮江湖行"
    translated: "What you wish for, let it be a journey through Jianghu."
- raw: "Library/Desc/20046,终于轮你当主角，你的谢幕可歌可泣，世上无人再敢看轻你。"
  splits:
  - split: 1
    text: "终于轮你当主角，你的谢幕可歌可泣，世上无人再敢看轻你。"
    translated: "Finally, it's your turn to take the spotlight. Your farewell is both moving and poignant, and no one in the world dares to look down on you anymore."
- raw: "Library/Title/20047,武林传奇"
  splits:
  - split: 1
    text: "武林传奇"
    translated: "Legend of the Wulin"
- raw: "Library/Desc/20047,耕阳读书斋将你的事迹编撰成书，发行于市。\\n唐门活侠的大名一朝传遍中原，无人不知、无人不晓。\\n你的名字，从今往后便是传说，受万人崇敬。"
  splits:
  - split: 1
    text: "耕阳读书斋将你的事迹编撰成书，发行于市。"
    translated: "Gengyang Reading Pavilion has compiled your deeds into a book and released it in the market."
  - split: 1
    subIndex: 1
    text: "唐门活侠的大名一朝传遍中原，无人不知、无人不晓。"
    translated: "The great name of the Tang Clan's living martial hero spread throughout Central China, known by all and spoken of by all."
  - split: 1
    subIndex: 2
    text: "你的名字，从今往后便是传说，受万人崇敬。"
    translated: "Your name will henceforth be legend, revered by thousands."
  templates:
  - split: 1
    template: "{0}\\n{1}\\n{2}"
- raw: "Library/Title/20048,丧家之犬"
  splits:
  - split: 1
    text: "丧家之犬"
    translated: "A dog of a bereaved family"
- raw: "Library/Desc/20048,你有一间房子可以遮风挡雨，但已没有故乡能够回去。"
  splits:
  - split: 1
    text: "你有一间房子可以遮风挡雨，但已没有故乡能够回去。"
    translated: "You have a house that can shelter you from wind and rain, but there is no hometown to return to."
- raw: "Library/Title/20049,峨嵋弟子"
  splits:
  - split: 1
    text: "峨嵋弟子"
    translated: "Emei Disciple"
- raw: "Library/Desc/20049,你成为峨嵋弟子，享受和旁人一样的待遇与义务。\\n以武林一员的身份参与了几件武林大事，无功无过，老了退隐。"
  splits:
  - split: 1
    text: "你成为峨嵋弟子，享受和旁人一样的待遇与义务。"
    translated: "You become an Emei disciple and enjoy the same treatment and obligations as everyone else."
  - split: 1
    subIndex: 1
    text: "以武林一员的身份参与了几件武林大事，无功无过，老了退隐。"
    translated: "As a member of Wulin, they participated in several major events within the martial arts community, neither gaining fame nor falling into disgrace. With age, they retired."
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Library/Title/20050,窝囊死"
  splits:
  - split: 1
    text: "窝囊死"
    translated: "Utterly useless"
- raw: "Library/Desc/20050,被这无情世道以乱拳加身，你的心比身体还要短寿，老早就死了。"
  splits:
  - split: 1
    text: "被这无情世道以乱拳加身，你的心比身体还要短寿，老早就死了。"
    translated: "In this ruthless world, being struck by chaotic fists, your heart has a shorter lifespan than your body; it has long since died."
- raw: "Library/Title/20051,苟且偷生"
  splits:
  - split: 1
    text: "苟且偷生"
    translated: "To live a life of compromise"
- raw: "Library/Desc/20051,你的骨气打从骨头断掉的那一刻，就烟消云散了。"
  splits:
  - split: 1
    text: "你的骨气打从骨头断掉的那一刻，就烟消云散了。"
    translated: "Your spirit vanished the moment your bones were broken."
- raw: "Library/Title/20052,划地为牢"
  splits:
  - split: 1
    text: "划地为牢"
    translated: "To draw a line and establish a boundary."
- raw: "Library/Desc/20052,谁也没留你，你却不舍走远。终你一生，困守于她坟前，流泪忏悔，可她怎会答应？"
  splits:
  - split: 1
    text: "谁也没留你，你却不舍走远。终你一生，困守于她坟前，流泪忏悔，可她怎会答应？"
    translated: "No one has kept you, yet you are reluctant to walk away. Throughout your life, you remain trapped before her grave, shedding tears of remorse, but how could she ever respond?"
- raw: "Library/Title/20053,与妳同行"
  splits:
  - split: 1
    text: "与妳同行"
    translated: "Walking with you"
- raw: "Library/Desc/20053,无论几度轮回，都愿为她跋涉冥河，穿越地狱。"
  splits:
  - split: 1
