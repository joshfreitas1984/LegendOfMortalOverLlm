- raw: "Library/Desc/40001,你和龙湘结为侠侣，行走江湖，任侠四方。\\n夫妻俩经常切磋，有时你胜她，有时她胜你。\\n输的人负责张罗晚饭，餐餐有鸡腿，\\n无论输赢，都如胶似漆。"
  splits:
  - split: 1
    text: "你和龙湘结为侠侣，行走江湖，任侠四方。"
    translated: "You and Long Xiang became a pair of Jianghu warriors, traveling together and spreading chivalry far and wide."
  - split: 1
    subIndex: 1
    text: "夫妻俩经常切磋，有时你胜她，有时她胜你。"
    translated: "The husband and wife often practice and compete with each other; sometimes they win, sometimes they lose."
  - split: 1
    subIndex: 2
    text: "输的人负责张罗晚饭，餐餐有鸡腿，"
    translated: "The loser has to prepare dinner and make sure there are chicken legs in every meal."
  - split: 1
    subIndex: 3
    text: "无论输赢，都如胶似漆。"
    translated: "Whether they win or lose, they remain as close as glue to lacquer."
  templates:
  - split: 1
    template: "{0}\\n{1}\\n{2}\\n{3}"
- raw: "Library/Desc/40002,你和夏侯兰回到大雪山，重建雪山派。\\n不久夏侯兰诞下一子，忽然变成慈母，\\n往昔暴戾之气荡然无存。\\n对你也是千依百顺。\\n于是来年又生了一个女儿，子女都像娘亲。"
  splits:
