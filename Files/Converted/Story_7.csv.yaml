- raw: "Story/D_Meet_Option_01_01_003,近来，常有慕名上山拜师的新人。有些人兴冲冲的来，见了大院如今情状，又打退堂鼓了。我在想是不是好歹得粉刷一下门面，才不堕本门威风。"
  splits:
  - split: 1
    text: "近来，常有慕名上山拜师的新人。有些人兴冲冲的来，见了大院如今情状，又打退堂鼓了。我在想是不是好歹得粉刷一下门面，才不堕本门威风。"
    translated: "Lately, many newcomers have come up the mountain seeking to join our school. Some arrived full of enthusiasm but were discouraged when they saw the current state of the courtyard. I've been thinking that perhaps we should at least do some painting to maintain our reputation."
- raw: "Story/D_Meet_Option_01_01_004,近来慕名上山拜师的新人、访客不少。我想下山置办材料，修补一些破墙、破檐，好不教外人、新人看了笑话。"
  splits:
  - split: 1
    text: "近来慕名上山拜师的新人、访客不少。我想下山置办材料，修补一些破墙、破檐，好不教外人、新人看了笑话。"
    translated: "Lately, many newcomers have been coming up the mountain to seek our master. I think about going down the mountain to buy supplies and repair some broken walls and eaves so that outsiders won't laugh at newbies when they see them."
- raw: "Story/D_Meet_Option_01_01_005,……你心系本门荣辱，本座甚是欣慰。可以，不过不能偏劳你一人，既然要干，就该大展拳脚。"
  splits:
  - split: 1
    text: "……你心系本门荣辱，本座甚是欣慰。可以，不过不能偏劳你一人，既然要干，就该大展拳脚。"
    translated: "...You are concerned about the honor and shame of our sect, and I am greatly pleased. You may do it, but you cannot burden yourself alone. If we are going to do this, we should give it a proper effort."
- raw: "Story/D_Meet_Option_01_01_006,唐升，修缮唐家大院一事，由你操办。设法调出款项来，该买的便买，不必太省。传本座谕令，门中弟子停止修练两日，悉数供你调度。"
  splits:
  - split: 1
    text: "唐升，修缮唐家大院一事，由你操办。设法调出款项来，该买的便买，不必太省。传本座谕令，门中弟子停止修练两日，悉数供你调度。"
    translated: "Tang Sheng, the renovation of the Tang Family Manor will be handled by you. Make sure to secure the necessary funds and spend them wisely; don't be too frugal. I hereby order that all the disciples in the door stop their training for two days so that they can be fully mobilized under your command."
- raw: "Story/D_Meet_Option_01_01_007,弟子领命！"
  splits:
  - split: 1
    text: "弟子领命！"
    translated: "Disciple receives the command!"
- raw: "Story/D_Meet_Option_01_01_008,惟元，竣工之时，你下山买些鸡鸭回来，大家吃一顿饱。"
