- raw: "Story/D_6_9_2_1_052,这是命数里注定的天赐良缘吗？夫苍天以书授我以礼，以人授我以深，以饥授我以苦。跌跌撞撞至今无一事成全。"
  splits:
  - split: 1
    text: "这是命数里注定的天赐良缘吗？夫苍天以书授我以礼，以人授我以深，以饥授我以苦。跌跌撞撞至今无一事成全。"
    translated: "Is this a destiny‑forgiven match from the heavens? Father Heaven taught me propriety by bestowing books upon me, knowledge through people, and hardship through hunger. Yet, despite all these, I have achieved nothing so far."
- raw: "Story/D_6_9_2_1_053,我自云端跌落凡尘，一身尘土，方知踏实可贵，始得看清人间。学贵明志贵实践，不以矫饰辞藻为贤。至于金玉其外，附庸风雅之辈，更是面目可厌。"
  splits:
  - split: 1
    text: "我自云端跌落凡尘，一身尘土，方知踏实可贵，始得看清人间。学贵明志贵实践，不以矫饰辞藻为贤。至于金玉其外，附庸风雅之辈，更是面目可厌。"
    translated: "I fell from the clouds into the mundane world, covered in dust, and realized the preciousness of grounded reality. Learning is valuable when it comes with clear intent and practical application, not through pretentious rhetoric. As for those adorned with gold and jade on the outside, merely following superficial elegance‑such individuals are especially repulsive."
- raw: "Story/D_6_9_2_1_054,唯我夫郎，灼灼耀目，不缁在涅。其晖皮相不能掩，在天可辉映日月，在地堪后世照鉴，在朝须史书厚写，在野亦是明灯，千秋不灭！"
  splits:
  - split: 1
    text: "唯我夫郎，灼灼耀目，不缁在涅。其晖皮相不能掩，在天可辉映日月，在地堪后世照鉴，在朝须史书厚写，在野亦是明灯，千秋不灭！"
    translated: "Only I, my lord, shine brightly like the sun, unwavering in purity despite trials. His radiance cannot be concealed by superficial appearances; in the heavens, he can illuminate even the sun and moon; on earth, he will be a guide for posterity, his name inscribed thickly in official histories; in the wilderness, he is a beacon that will never fade through the ages!"
- raw: "Story/D_6_9_2_1_055,这、这也太夸我了！你这样乱夸，我、我是会飞天的。"
