    translated: "You carry the chest and baggage, this time traveling much farther, covering over four or five hundred miles. You sell all the rare items you have carried at high prices to the people of distant lands, then buy local specialties and return to increase their prices for your fellow villagers and neighbors. Cunning as they may be, these transactions yield legitimate profits."
