    text: "有意来窥探唐门锻冶秘方的外派弟子大失所望，认定唐门藏私藏得太狠了些。得不到他们要的，索性便在锻冶场大吵大嚷起来，闹得你心烦意乱，又顾忌他们不时瞟来的视线，压根无法好好做事。"
    translated: "Disciples dispatched by the Tang Clan were greatly disappointed to find that they could not pry into the Tang Clan's forging secrets. They concluded that the Tang Clan was hiding too much. Without getting what they wanted, these disciples started making a ruckus in the forge hall, causing you to become annoyed and distracted. Furthermore, their constant sidelong glances added to the disturbance, leaving no chance for you to concentrate on your work."
- raw: "Story/N_Forge_Work_502_001,自己做过了打铁的活，才知道这门手艺的深奥。外派来客纷纷收起了轻视之心，对你抱持尊敬。不惜出钱，也要排队请你帮忙保养兵器。"
