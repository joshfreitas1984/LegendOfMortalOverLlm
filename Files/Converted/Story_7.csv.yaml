    translated: "It's not the Asura Path! It's just the Tang Clan! I do as I please, neither good nor evil, no black or white. I'm too lazy to be pretentious with you, and I don't have any false pretenses. When I do good, I don't hide it, and when I do wrong, I do it openly!"
