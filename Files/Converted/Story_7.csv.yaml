    translated: "Is it the same? No, not at all. Lady Wen's intention was to focus on the overall situation, compelling Lord Shangguan to accept the conditions. On the other hand, Little Jue's plan is targeted at Shi Ming; whether you accept or reject it, it will lead to hell."
