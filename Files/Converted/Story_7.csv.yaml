- raw: "Story/N_Door_Work_402_001,你背着箧笥、行囊，这回走得更远，足有四、五百里路。将所携的罕见事物全都高价卖给异乡百姓，又买了当地特产，回来抬价卖给乡亲街坊，狡猾归狡猾，赚的是正财。"
  splits:
