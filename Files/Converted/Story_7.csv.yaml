- raw: "Story/D_Meet_Option_501_01_027,距今二十多年前，崆峒火龙仙君、全真丘道长、郝道长、青城邹掌门，以及今时今日堕落成为地狱道法王的赵逵，曾经齐聚一堂，谈经论道。辩论会中，邹掌门与郝道长相谈甚欢，一见如故。"
  splits:
  - split: 1
    text: "距今二十多年前，崆峒火龙仙君、全真丘道长、郝道长、青城邹掌门，以及今时今日堕落成为地狱道法王的赵逵，曾经齐聚一堂，谈经论道。辩论会中，邹掌门与郝道长相谈甚欢，一见如故。"
    translated: "More than twenty years ago, the Fire Dragon Immortal Monarch of Kongtong, Daoist Qiu from Quanzhen, Daoist Hao, Sect Master Zou from Qingcheng, and Zhao Kui, who has since fallen to become the Hell's Path Dharma King, gathered together to discuss scriptures and daoism. During their discussion, Sect Master Zou and Daoist Hao hit it off immediately and talked with great pleasure."
- raw: "Story/D_Meet_Option_501_01_028,邹掌门遂将符箓法术传授郝真人，而郝道长则报以炼丹精要。否则青城正一道本来是不崇尚炼丹的，而郝道长也不会无故钻研老庄易学。"
  splits:
  - split: 1
    text: "邹掌门遂将符箓法术传授郝真人，而郝道长则报以炼丹精要。否则青城正一道本来是不崇尚炼丹的，而郝道长也不会无故钻研老庄易学。"
    translated: "Master Zou then imparted the techniques of talisman and magical arts to Master Hao. In return, Daoist Hao taught him the essence of alchemy. Otherwise, the main branch of Qingcheng Dao would not have favored alchemy, and Daoist Hao would not have randomly delved into the studies of Laozi, Zhuangzi, and I Ching."
