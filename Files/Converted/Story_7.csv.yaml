    text: "赵兄弟，抱歉了。南宫世家对你唐门成见太深。我方接任家主，尚须族老及分家支持才能安内，不宜立刻起冲突。唯有顺势而为，先委屈了你，待我暗中使力替你们洗刷冤屈吧。"
    translated: "Brother Zhao, I apologize. The Nangong House holds too much grudge against your Tang Clan. As the new head of the household, I still need the support of the clan elders and branch families to stabilize things internally; we shouldn't provoke any conflicts right away. We must go with the flow for now and bear with this. Once I secretly exert my influence, I will clear your name."
- raw: "Story/D_6_8_3_226,南宫世家既然得了「武林之心」的美誉，那便必须不偏不倚。后学南宫深新任家主，自也不敢违抗祖训。"
