- raw: "Story/D_Meet_Option_01_02_004,如今本门业大，日日来大院请安、操练之人众多。将来只怕还得分批进正心堂问安。"
  splits:
  - split: 1
    text: "如今本门业大，日日来大院请安、操练之人众多。将来只怕还得分批进正心堂问安。"
    translated: "Now that our sect has grown so large, many people come to the main courtyard daily to pay respects and train. In the future, we may have to divide them into batches to ask Ancestral Hall for permission."
- raw: "Story/D_Meet_Option_01_02_005,我才想说这事呢！前天我刚回山上，就碰到一堆人堵在门口，水泄不通，我还道出了什么大事，结果居然是排队团练。"
  splits:
  - split: 1
    text: "我才想说这事呢！前天我刚回山上，就碰到一堆人堵在门口，水泄不通，我还道出了什么大事，结果居然是排队团练。"
    translated: "I was just about to bring up this matter! The day before yesterday, I returned to the mountain, only to find a crowd blocking the entrance, with no room to move. I thought something important must have happened, but it turned out to be a queue for exercise training."
- raw: "Story/D_Meet_Option_01_02_006,这……对不住，都是我言不及义，教得慢。"
  splits:
  - split: 1
    text: "这……对不住，都是我言不及义，教得慢。"
    translated: "This... I apologize, it's all because I explained too slowly and inadequately."
- raw: "Story/D_Meet_Option_01_02_007,掌门，您怎么还笑啊。"
  splits:
  - split: 1
    text: "掌门，您怎么还笑啊。"
    translated: "Master, why are you still smiling?"
- raw: "Story/D_Meet_Option_01_02_008,这是好事，怎么不笑？往昔唐门如日中天，人比现在还多，如何不堵？"
  splits:
  - split: 1
    text: "这是好事，怎么不笑？往昔唐门如日中天，人比现在还多，如何不堵？"
    translated: "This is a good thing; why not laugh? In the past, the Tang Clan was at the height of its power, with more people than now. How could it be overcrowded then?"
- raw: "Story/D_Meet_Option_01_02_009,那是因为……门中弟子均由各位师伯、师叔带开各自传授。或在练功塔、或在外堡空地，又或者另觅场地，至于大院中的练武场，也仅就考核之用。"
  splits:
