- raw: "Story/N_Door_Work_401_001,你放弃了身为人的良知，只要能赚到盆满钵满，压根不在意人家是否家破人亡，那怕是人家母亲唯一的遗物，你也会毫不留情地巧取豪夺。今天也不择手段，满载而归了。"
  splits:
  - split: 1
    text: "你放弃了身为人的良知，只要能赚到盆满钵满，压根不在意人家是否家破人亡，那怕是人家母亲唯一的遗物，你也会毫不留情地巧取豪夺。今天也不择手段，满载而归了。"
