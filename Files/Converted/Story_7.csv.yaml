    translated: "Lately, many newcomers have come up the mountain seeking to join our school. Some arrived full of enthusiasm but were discouraged when they saw the current state of the courtyard. I've been thinking that perhaps we should at least do some painting to maintain our reputation."
- raw: "Story/D_Meet_Option_01_01_013,近来慕名上山拜师的新人、访客不少。我想下山置办材料，修补一些破墙、破檐，好不教外人、新人看了笑话。"
  splits:
  - split: 1
    text: "近来慕名上山拜师的新人、访客不少。我想下山置办材料，修补一些破墙、破檐，好不教外人、新人看了笑话。"
    translated: "Lately, many newcomers have been coming up the mountain to seek our master. I think about going down the mountain to buy supplies and repair some broken walls and eaves so that outsiders won't laugh at newbies when they see them."
- raw: "Story/D_Meet_Option_01_01_014,……有道理，本门正该改头换面，开创新气象。好多墙面斑驳、屋檐漏水、木材腐朽，都一股脑儿处置吧。"
  splits:
  - split: 1
    text: "……有道理，本门正该改头换面，开创新气象。好多墙面斑驳、屋檐漏水、木材腐朽，都一股脑儿处置吧。"
    translated: "...That makes sense. Our sect should indeed undergo a transformation, opening up new prospects. Many walls are damaged, the roof leaks, and the wood is rotting‑let's address all of these issues at once."
- raw: "Story/D_Meet_Option_01_01_015,甚好。"
  splits:
  - split: 1
    text: "甚好。"
    translated: "Good"
- raw: "Story/D_Meet_Option_01_01_016,我也没意见。"
  splits:
  - split: 1
    text: "我也没意见。"
    translated: "I have no objections either"
- raw: "Story/D_Meet_Option_01_01_017,既然如此，我便调派人力，着手办理此事。不免要借助大家的力量，上下齐心把事办好，届时还请多担待。"
  splits:
  - split: 1
    text: "既然如此，我便调派人力，着手办理此事。不免要借助大家的力量，上下齐心把事办好，届时还请多担待。"
    translated: "Since that is the case, I will mobilize manpower and start handling this matter. It would be necessary to leverage everyone's strength; let us work together from top to bottom to ensure its success. At that time, please bear with us."
- raw: "Story/N_Meet_Option_01_01_001,唐门上下一心，卷起袖子干起活来，一早吃过饭便忙进忙出。大家说说笑笑热闹非凡，冷清唐家大院难得充满了欢快的气氛。"
  splits:
  - split: 1
    text: "唐门上下一心，卷起袖子干起活来，一早吃过饭便忙进忙出。大家说说笑笑热闹非凡，冷清唐家大院难得充满了欢快的气氛。"
    translated: "The Tang Clan, united in heart and mind, rolled up their sleeves to get to work. After breakfast, they moved about busily from morning till night. Everyone chatted and laughed, creating a lively atmosphere. The usually quiet Tang compound was unusually filled with joy."
