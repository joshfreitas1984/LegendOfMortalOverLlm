- raw: "Story/D_Meet_Option_01_01_012,近来，常有慕名上山拜师的新人。有些人兴冲冲的来，见了大院如今情状，又打退堂鼓了。我在想是不是好歹得粉刷一下门面，才不堕本门威风。"
  splits:
  - split: 1
