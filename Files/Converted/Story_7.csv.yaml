- raw: "Story/D_Meet_01_035,谁也没说那椅子只能由入室弟子来坐，你何须忐忑？今夜令你过来，也是想集思广益，听听你以外姓弟子的身份，对本门方针的见解。"
  splits:
  - split: 1
    text: "谁也没说那椅子只能由入室弟子来坐，你何须忐忑？今夜令你过来，也是想集思广益，听听你以外姓弟子的身份，对本门方针的见解。"
    translated: "No one said that the chair could only be taken by initiates; why should you be anxious? Tonight, I asked you here to gather diverse opinions and hear your insights on our sect's policies from the perspective of an external disciple."
