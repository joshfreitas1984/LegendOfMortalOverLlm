    translated: "Following the diagram in the Tang Clan's Manual of Hidden Weapons, you crafted high‑quality iron weapons by integrating your own experiences. Having spent so much time in a hot environment, it seemed to have imparted a bit of fiery temperament, making you slightly more irritable."
- raw: "Story/N_Forge_Work_501_001,有意来窥探唐门锻冶秘方的外派弟子大失所望，认定唐门藏私藏得太狠了些。得不到他们要的，索性便在锻冶场大吵大嚷起来，闹得你心烦意乱，又顾忌他们不时瞟来的视线，压根无法好好做事。"
