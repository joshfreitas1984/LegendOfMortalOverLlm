- raw: "Story/D_6_8_3_189,唐门与我嵩山派僧人昔年齐心力抗极乐教入主中原。老衲心有大恐怖，未能舍身随师兄弟入世赴义，多年来惭愧反侧，时时梦中惊醒，涕泪肆流。"
