    text: "哈，多管闲事也要有个限度，好啊，你自己送上门来，正合我心意。我料定这个人铁定就是拿了药立刻闹失踪，由你这面熟的小子来担保更好。他若跑了，我就着落在你头上索款。"
    translated: "Haha, meddling also has its limits. Well then, you've come to me yourself; just as I expected. I figured this person would definitely go missing immediately after taking the medicine, and it's even better if you, this familiar face, guarantee it. If he runs away, I'll come after you for payment."
