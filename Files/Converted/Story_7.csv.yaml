  splits:
  - split: 1
    text: "无条件不信任对方，互相猜忌、互相残杀，与南宫盟主悲愿背道而驰。唐门擅长用毒，崆峒也不是软柿子，就算覆灭，两败俱伤亦在所难免。这便是各位想要强留唐门所必须付出的代价。"
