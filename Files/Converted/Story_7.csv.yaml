- raw: "Story/D_6_8_4_042,反之您若肯接受条件，作人质换取唐门信赖，则免去一番争斗杀伐。《六度集经》中不就有佛陀割肉喂鹰的故事吗？大师常教导信女，处世当以慈悲为怀，岂忍见仁人义士白流鲜血。"
  splits:
  - split: 1
    text: "反之您若肯接受条件，作人质换取唐门信赖，则免去一番争斗杀伐。《六度集经》中不就有佛陀割肉喂鹰的故事吗？大师常教导信女，处世当以慈悲为怀，岂忍见仁人义士白流鲜血。"
    translated: "Conversely, if you are willing to accept the terms and be held as a hostage to gain the Tang Clan's trust, then it can avoid unnecessary fighting. In the 'Six Perfections Sutra', isn't there the story of Buddha offering his flesh to feed the eagle? Master often teaches laywomen to approach worldly matters with compassion, how could one bear to see righteous warriors shed their blood in vain?"
- raw: "Story/D_6_8_4_043,大师是有道高僧，更该当了断执着，为大我捐躯才是，即便身殒亦造福武林，功德无量，有什么好犹豫的？"
