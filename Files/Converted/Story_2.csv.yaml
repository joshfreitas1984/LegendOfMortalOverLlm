- raw: "Story/D_2_5_3_4_2_023,我行经茶铺时，要不太晚，要不就是累得要死了，只想赶快回家倒头大睡。\\n那茶铺由旁人顶去后，茶水已经要收钱了，最便宜的一壶也要十钱。\\n也不是点茶，不过是茶叶往壶里一放，叫客人自己去舀热水冲开而已。"
  splits:
  - split: 1
    text: "我行经茶铺时，要不太晚，要不就是累得要死了，只想赶快回家倒头大睡。"
