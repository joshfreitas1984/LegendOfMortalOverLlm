- raw: "Story/D_2_5_3_4_2_024,舍不得花钱就口渴，花了钱又舍不得茶叶，又得赶路回山复命。\\n于是就只好妥协，茶叶嚼烂，热水兑点凉水含着，一路上慢慢咽下。"
  splits:
  - split: 1
    text: "舍不得花钱就口渴，花了钱又舍不得茶叶，又得赶路回山复命。"
