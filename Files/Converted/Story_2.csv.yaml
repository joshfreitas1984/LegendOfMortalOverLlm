- raw: "Story/D_2_5_3_4_2_021,时间宽裕一点的，还能叫碗面吃了才走，但也不会逗留；\\n至于那些归心似箭的，连屁股也不沾板凳，\\n仰脖子对壶饮干了，铜钱拍桌上就走。"
  splits:
  - split: 1
    text: "时间宽裕一点的，还能叫碗面吃了才走，但也不会逗留；"
