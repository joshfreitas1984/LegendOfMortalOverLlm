- raw: "Story/D_2_5_3_4_2_022,我那时还不知道他们为何如此，直到我自己也变成其中一个行色匆匆的人。\\n那茶铺后来卖掉了，我每回被师门指派下山办事，都会路过。"
  splits:
  - split: 1
    text: "我那时还不知道他们为何如此，直到我自己也变成其中一个行色匆匆的人。"
