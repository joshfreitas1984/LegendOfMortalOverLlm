- raw: "Story/D_2_5_3_4_3_006,铁臂神拳是外壮筋骨的苦功夫，和嵩山铁砂掌差不多道理。\\n因为铁拳门良莠不齐，来的人多，去的人也多，其中难免有顺手牵羊之辈。\\n因此此拳经早已流传到江湖上去了，铁拳门人反而不会用，呵呵。"
