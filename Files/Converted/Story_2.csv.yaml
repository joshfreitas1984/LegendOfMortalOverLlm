- raw: "Story/D_2_5_1_005,众所周知，我崆峒山古来便是宝地，博纳中原、西夏、吐蕃武学。\\n是以飞天门为首，与夺魄门、铁拳门、玄功门合并成的古老大派。\\n各门皆有掌门，而负责统辖四门的，则称为『掌派人』。"
