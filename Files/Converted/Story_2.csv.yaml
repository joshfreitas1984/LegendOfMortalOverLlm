- raw: "Story/D_2_5_3_4_2_020,茶水不收钱，面点、馒头还是要收的。\\n我就招呼过不少客人，他们不是正要回家，或是去往某处的路上，\\n压根没有闲心坐下来品味茶香。"
  splits:
