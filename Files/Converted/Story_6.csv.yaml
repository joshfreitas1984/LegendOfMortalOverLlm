- raw: "Story/N_6_5_3_002,宋悲为官清廉，身居高位而奔走于江湖，又通情达理，名声极佳，江湖莫不以神捕尊称，如今这一席话字字铿锵，于公于私皆在理。由他来说自然动听。"
