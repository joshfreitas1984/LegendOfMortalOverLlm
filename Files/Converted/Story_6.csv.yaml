- raw: "Story/D_6_4_4_3_003,思前想后，唯有唐门傲骨嶙峋，敢与朝廷相抗衡，力足以庇荫宫人，不为利向强权折腰。又远在蜀中，在地县府难管，朝廷又鞭长莫及。"
