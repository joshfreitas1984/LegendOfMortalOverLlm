- raw: "Story/D_6_4_3_3_4_010,你当时中门大开，我要是没收招，当身一靠，你就口吐鲜血了。又不是生死相搏，我自然不会下重手，而且我靠到你身上，总是不妥吧？所以才临时收招，放过你的破绽。"
  splits:
