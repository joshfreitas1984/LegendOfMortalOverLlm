    text: "南宫大侠虽不见得是武功第一，但也相去不远，只是深藏不露罢了。更且仁义为怀，数十年来急公好义，有目共睹，他来担任武林盟主，有谁不服？"
    translated: "Great Hero Nangong, though not necessarily the foremost in martial arts, is close enough. He simply keeps his abilities concealed. Moreover, he harbors benevolence and righteousness; for decades, he has been eager to serve the public and uphold justice, a fact evident to all. Who would fail to acknowledge him as the Leader of the Wulin Alliance?"
