- raw: "Story/D_6_6_2_Break_01_145,请你别去了，我方丈师叔性喜清静，不与江湖中人结交。回山不久就要交卸衣钵，无意沾染凡尘。你和小僧打交道不也一样吗？将来八九不离十，小僧会当上嵩山方丈。"
  splits:
  - split: 1
    text: "请你别去了，我方丈师叔性喜清静，不与江湖中人结交。回山不久就要交卸衣钵，无意沾染凡尘。你和小僧打交道不也一样吗？将来八九不离十，小僧会当上嵩山方丈。"
    translated: "Please don't go. Our Master Uncle prefers seclusion and does not mingle with people from the Jianghu. He is about to relinquish his position as Abbot soon and has no interest in worldly affairs. Are you not dealing with a novice like me now? In the future, it's almost certain that I will become the Abbot of Songshan, just as you are doing now."
