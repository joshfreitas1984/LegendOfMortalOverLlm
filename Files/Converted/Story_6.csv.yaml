  splits:
  - split: 1
    text: "我被大猿猴捉回巢穴后，天天被殴打，为了保命只好每天尝试攀岩逃跑。大猿猴不拦我，但我每次失败掉下来，牠都会及时接住我，然后打我。久而久之我个子虽然没长高，筋骨却茁壮不少。"
    translated: "After being captured by the large ape and brought back to its den, I was beaten every day. To preserve my life, I had to try climbing to escape every day. The large ape didn't stop me, but each time I failed and fell, it would catch me in time and then beat me. Over time, although my height didn't increase, my muscle and bone grew stronger."
