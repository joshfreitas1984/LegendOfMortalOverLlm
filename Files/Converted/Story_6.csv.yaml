    translated: "Soldiers defending the country and martial heroes maintaining internal peace are both serving the nation and people. They are all subjects of the same country and should not be suspicious or cautious of each other. The current emperor is filial, kind, compassionate, and benevolent, temperate, wise, and prudent. He does not discuss the previous emperor's governance to align with the ancestors. However, regarding the division between the court and the people, he is deeply distressed."
- raw: "Story/D_6_5_3_016,而今风雨山外风雨飘摇，外有金贼虎视眈眈，内有魔教居心叵测，江湖之危，等若中原之危，是大宋之危，更是江山社稷之危。我辈侠士，安忍坐视黎民百姓身陷水火？"
  splits:
  - split: 1
    text: "而今风雨山外风雨飘摇，外有金贼虎视眈眈，内有魔教居心叵测，江湖之危，等若中原之危，是大宋之危，更是江山社稷之危。我辈侠士，安忍坐视黎民百姓身陷水火？"
