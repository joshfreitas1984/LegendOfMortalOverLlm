- raw: "Story/N_6_6_2_Break_01_008,你哪知道李富贵从前家道尚未中落，也曾真的富贵过，随狐朋狗友一块儿慕名去诗会见过这位大才女，为她惊世才华倾倒。那时就自惭形秽，如今成了乞丐头子，更是唯恐被她认出来。"
  splits:
