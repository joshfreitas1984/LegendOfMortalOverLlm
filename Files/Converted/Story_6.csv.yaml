    text: "听海居士何尝没有手下容情？向闻点苍双尊练的是双剑合壁联击之术。若是与点苍掌门观云居士连手，纵有两个向某，亦非敌手。"
    translated: "How could the Listening Sea Hermit not show mercy to his subordinates? It is said that the Diancang Shuangzun practices the dual‑sword combined attack technique. If the Diancang's master, Guanyun Jushi, were to team up with him, even if there were two of me, I would still not be a match."
