- raw: "Story/D_6_6_1_148,大道之行也，天下为公，选贤与能，讲信修睦，故人不独亲其亲，不独子其子，使老有所终，壮有所用，幼有所长，矜寡孤独废疾者皆有所养；"
  splits:
  - split: 1
    text: "大道之行也，天下为公，选贤与能，讲信修睦，故人不独亲其亲，不独子其子，使老有所终，壮有所用，幼有所长，矜寡孤独废疾者皆有所养；"
    translated: "When the great way is in practice, the world is held in common; the virtuous and capable are selected, trust is promoted, and harmony is cultivated. Thus, people do not merely love their own parents or children; the elderly are cared for until the end of their days, the strong find their place in society, the young grow up in peace, and the lonely, the poor, the orphans, and the disabled are all provided for."
- raw: "Story/D_6_6_1_149,男有分，女有归。货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己，是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭，是谓「大同」。"
  splits:
  - split: 1
    text: "男有分，女有归。货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己，是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭，是谓「大同」。"
    translated: "Men have their roles, women have their places. Goods are not discarded, they need not be kept by oneself; strength is not withheld, it need not be for oneself. Therefore, conspiracies do not arise, theft and chaos do not occur, so doors are left unbarred, which is called 'Great Harmony'."
