- raw: "Story/D_6_6_2_Break_01_148,非也，在其位方能有所作为，小僧欲整饬僧众，订定字辈，发心振作，弘扬佛法，必先以身作则，所以方丈之位，势在必得。我有意往而讳其言，反而不诚实了。"
  splits:
  - split: 1
    text: "非也，在其位方能有所作为，小僧欲整饬僧众，订定字辈，发心振作，弘扬佛法，必先以身作则，所以方丈之位，势在必得。我有意往而讳其言，反而不诚实了。"
    translated: "Not so. Only when one is in a position can they achieve something. I, as a monk, wish to organize the monastic community, establish a hierarchy, inspire diligence, and promote the Dharma. To do this, I must first lead by example; therefore, the position of abbot is essential. If I intend to go and avoid speaking of it, I would be acting insincerely."
