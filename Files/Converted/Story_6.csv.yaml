- raw: "Story/D_6_4_3_4_2_028,飞天门性急如火，不思苦修，成日想不劳而获，速成武功。所以将一趾驭风简化成仙鹤迷踪拳，又将仙鹤迷踪拳简化成飞天脚。堂堂神功被糟蹋成废物，这不是有迹可寻吗？是人祸啊。"
