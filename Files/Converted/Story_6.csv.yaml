    translated: "After much consideration, only the Tang Clan, with their unyielding pride, dared to challenge the Imperial Court, their strength sufficient to protect the palace attendants, refusing to bow to power for personal gain. Moreover, they are located in Sichuan, far from the local county administrations, which are difficult to control, and the Imperial Court's reach is limited there."
- raw: "Story/D_6_4_4_3_004,而今尔等在锦香宫作客已有一段时日，令师弟妹与宫人相处融洽，或生情愫，或结为友。锦香宫散后，若有流离失所的，想来贵门也不会拒之门外。"
