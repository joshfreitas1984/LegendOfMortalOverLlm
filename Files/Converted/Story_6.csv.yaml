- raw: "Story/D_6_4_4_2_037,吾人与世所争，不过『公平』，不会知难而退。此事在江湖尚且难为，匆匆二十载，始有薄名，得天下人敬。倘若本宫向朝廷折腰，则无异于谄媚于强权，随于俗流。"
  splits:
  - split: 1
    text: "吾人与世所争，不过『公平』，不会知难而退。此事在江湖尚且难为，匆匆二十载，始有薄名，得天下人敬。倘若本宫向朝廷折腰，则无异于谄媚于强权，随于俗流。"
    translated: "Our struggle with the world is about fairness, and we will not retreat in the face of difficulty. This matter is even difficult in Jianghu; after twenty years of effort, we have earned a modest reputation and the respect of the world. If this court bows to the Imperial Court, it would be no different from flattering the powerful and following the crowd."
- raw: "Story/D_6_4_4_2_038,一甲子过去，锦香宫之名必遭历史潮流淹没，后世子孙不复得闻，而天下女子依然永世不得翻身，因一句『男尊女卑』，被歧视、贱待，甚至视如货品买卖。"
  splits:
  - split: 1
    text: "一甲子过去，锦香宫之名必遭历史潮流淹没，后世子孙不复得闻，而天下女子依然永世不得翻身，因一句『男尊女卑』，被歧视、贱待，甚至视如货品买卖。"
    translated: "Sixty years later, the name of Jinxiang Palace will inevitably be submerged by the tide of history, and future descendants will no longer hear of it. Women across the land will forever remain oppressed, forever unable to rise, due to the single phrase male superiority and female inferiority, being discriminated against, despised, and even treated as commodities for trade."
- raw: "Story/D_6_4_4_2_039,前辈所言，未免骇人听闻，您想与抗者，是整个人间。"
