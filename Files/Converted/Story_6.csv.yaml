- raw: "Story/D_6_4_4_3_011,唐门的作派，本宫略知一二，也信得过。正邪算个什么事？要说正，谁正得过朝廷？可我们偏偏不服朝廷。不求你们照单全收，只愿将来宫人落难，能念今日情份，稍加照拂。"
