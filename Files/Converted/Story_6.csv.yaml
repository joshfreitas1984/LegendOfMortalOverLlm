- raw: "Story/D_6_5_3_015,将士攘外，侠士安内，都是为国为民，同是一国之臣，不该生份戒慎。今官家孝友慈仁，温文睿哲，不议先帝施政，以配祖考。然则对于朝野离心，亦是痛心疾首。"
