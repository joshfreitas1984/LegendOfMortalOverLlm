- raw: "Story/N_6_5_2_Break_01_017,自结识以来，你早看惯她在人前好强，意气风发的骄傲模样，她在人后拼命努力，倒了楣、委屈到哭的惨状也曾有幸目睹。然而再多挫折，她至多哭一哭便罢，抹掉眼泪不服输。"
  splits:
  - split: 1
    text: "自结识以来，你早看惯她在人前好强，意气风发的骄傲模样，她在人后拼命努力，倒了楣、委屈到哭的惨状也曾有幸目睹。然而再多挫折，她至多哭一哭便罢，抹掉眼泪不服输。"
    translated: "Since we've met, you've long been used to seeing her strong and proud in public, her arrogant and full‑of‑spirit demeanor. Behind the scenes, she works tirelessly, and the heartbreaking sight of her running into bad luck and being humiliated to tears has also been witnessed by me. Yet no matter how many setbacks she faces, she'll only cry a little and then move on, wiping away her tears without giving up."
