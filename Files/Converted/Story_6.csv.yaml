    text: "宋官爷说的好哇！剿灭魔教，为我官家分忧！这是尽忠，也是大义所在！为民为利，在公在私都没话可说！总不能坐视魔教日渐势大，祸国殃民！"
    translated: "Well said, Lord Song! Eliminate the Demon Sect, relieve my sovereign's worries! This is loyalty, and it is the righteousness of the matter! For the people and for profit, in public and in private, there's nothing to say! We can't just sit idly by as the Demon Sect grows stronger, bringing calamity to the country and its people!"
- raw: "Story/D_6_5_3_034,正是！正该如此！难得有这样一位体恤民生通情达理的好官家，何必为反而反？活腻歪了不成？"
