- raw: "Story/N_6_5_4_007,二位当世高手施展上乘武功交锋，势均力敌，看得众人叹为观止。胜者不骄而能谦辞，一番话给足了脸面。听海生虽败犹荣，对视一笑，拱手而退。"
  splits:
  - split: 1
    text: "二位当世高手施展上乘武功交锋，势均力敌，看得众人叹为观止。胜者不骄而能谦辞，一番话给足了脸面。听海生虽败犹荣，对视一笑，拱手而退。"
    translated: "Two top martial artists displayed their superior martial arts in a duel, evenly matched, leaving the crowd in awe. The victor remained humble and offered a respectful apology, their words giving enough face. Ting Haisheng, though defeated, still maintained honor, exchanged a respectful smile, and bowed before retreating."
