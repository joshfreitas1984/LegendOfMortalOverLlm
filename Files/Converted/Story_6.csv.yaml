    text: "与文人结交，却又自矜武林家世；胸有城府却不深不浅；琴棋书画皆沾却不求甚解，又佯作高深莫测，附庸风雅罢了；好逸而恶劳，追捧有才名的士人，居高临下使唤工民，却轻贱农商。"
