  splits:
  - split: 1
    text: "夺魄、铁拳更别说了。夺魄门心思阴沉，上下交相贼，教徒弟藏招，《镇魂功》失传不足为奇。然后铁拳门，你们都知道就那德行，怎么保得住七路《伤拳》？"
