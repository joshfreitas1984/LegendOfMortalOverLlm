    text: "南宫家主虽不是武功最强的，但八成是最天真的。从前还不十分笃定，今日听他一席话，想来他当上武林盟主，一定顾念旧情，优柔寡断，唐门当可高枕无忧。"
    translated: "Nangong Family Leader may not be the most skilled in martial arts, but he is likely the most innocent. Before, his resolve was not yet firm, but today hearing him speak, it seems that when he becomes the Alliance Leader of Wulin, he will certainly cherish old feelings and be hesitant. Therefore, the Tang Clan can rest easy without worry."
