- raw: "Story/N_6_5_4_006,那向掌门是形意拳大宗师，境界远超凡人想象。所象已非猿猴、螳螂、鹤等活物，而是山岳、流水、清风。招式连贯近乎没有缝隙可言，无招无式，浑然天成。"
  splits:
  - split: 1
    text: "那向掌门是形意拳大宗师，境界远超凡人想象。所象已非猿猴、螳螂、鹤等活物，而是山岳、流水、清风。招式连贯近乎没有缝隙可言，无招无式，浑然天成。"
    translated: "The sect's master is a grand master of Xingyi Quan, their realm far beyond ordinary people's imagination. The forms they embody are no longer of living creatures like apes, mantises, or cranes, but rather of mountains, flowing water, and clear winds. The techniques flow seamlessly, with no gaps to speak of, no set forms or techniques, naturally formed as if born from nature."
