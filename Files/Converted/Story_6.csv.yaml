- raw: "Story/D_6_5_3_031,朝廷都已主动释出好意，鼓励江湖门派自立团结，倘若讲不出个所以然还硬要反对，到时朝廷翻脸，治你一个反逆之罪，大家都得吃不了兜着走。"
