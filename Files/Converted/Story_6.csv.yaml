- raw: "Story/D_6_4_4_2_040,人间有人，人与人方为人间，本宫能令锦香宫受江湖重看，锦香宫的后代传人，未始不能青出于蓝，令后世改观。总有一日男女可以平起平坐，女子亦能身居朝廷要职，纳多男为妾。"
  splits:
  - split: 1
    text: "人间有人，人与人方为人间，本宫能令锦香宫受江湖重看，锦香宫的后代传人，未始不能青出于蓝，令后世改观。总有一日男女可以平起平坐，女子亦能身居朝廷要职，纳多男为妾。"
    translated: "There are people in the world; it is through people that the world exists. This palace can restore the Jinxiang Palace's prestige in the Jianghu. The descendants of the Jinxiang Palace may not be unable to surpass their predecessors, changing the perspective of future generations. There will come a day when men and women can stand on equal footing, and women can also hold important positions in the Imperial Court, taking multiple male concubines."
- raw: "Story/D_6_4_4_2_041,女子纳多男为妾！这、这也太离谱了！"
  splits:
  - split: 1
    text: "女子纳多男为妾！这、这也太离谱了！"
    translated: "A woman taking multiple men as concubines! This, this is too absurd!"
- raw: "Story/D_6_4_4_2_042,男子天生力大，古时一夫多妻是为增产报国，无可厚非。今我大宋富饶，重文抑武，崇尚风雅，何以墨守成规？女子的才学、见识，可不见得逊于男儿，端看教育而已。"
  splits:
  - split: 1
    text: "男子天生力大，古时一夫多妻是为增产报国，无可厚非。今我大宋富饶，重文抑武，崇尚风雅，何以墨守成规？女子的才学、见识，可不见得逊于男儿，端看教育而已。"
    translated: "Men are naturally strong; in ancient times, polygamy was seen as a way to boost productivity and serve the nation, which was not unreasonable. Now that our Great Song is affluent and culturally rich, we emphasize literature over military strength and revere elegance‑why should we cling to outdated traditions? Women's talents, knowledge, and insight may not be inferior to men's; it all depends on education."
