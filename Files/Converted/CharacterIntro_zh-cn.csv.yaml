- raw: "CharacterIntro3/girl4,在实战中逐渐熟练，已经能够不骄不躁，随心所欲驱使剑术，成为了有名的女侠，兼而貌美如花，慕名而来追求者络绎不绝。\\n龙湘情窦初开，亦不免心下窃喜，只是笨拙未解风情，为了遮羞，便以武会友，以剑交心，结果求爱者纷纷败于剑下，灰头土脸而去，就是她好言相慰，亦不能免其挫折，好些心气高者，封剑退隐亦不足为奇。\\n久而久之，便看淡了，见了谁来示好，都下重手，打得对方越惨，越能看出对方心性，江湖男儿到底好面子，谁能容她这般剽悍呢。\\n武功虽然高，但是生活一团糟，没有自理能力，没有人弄她，就可以害死自己。"
