- raw: "CharacterIntro1/special103,懵懂记事之初，就跟着母亲。\\n那时不知贫穷为何物，日子单纯而美好，他相貌长得好，又活泼聪明，心地善良，人见人爱，乡里孩子都爱跟他玩。\\n那时他不叫南宫浅，似乎有别的乳名，如今已经不记得了。\\n某天他玩得一身泥回家，好奇问了母亲一句：「为何我没有爹爹？我爹爹上哪儿去了？」\\n他美好的童年就此戛然而止。"
