- raw: "CharacterIntro2/special401,本名王春晓，祖上世代是武官，王春晓也得了余荫，被封定远郎。\\n但他文质彬彬，比起武功，更爱吟诗下棋，至于兵书读是读了，可一想到要上战场保家卫国，就直打哆嗦。\\n直到认识南宫远、邂逅苏迎香，为了博得美人青睐，才勉为其难入江湖闯荡。\\n他样样都比南宫远行，可是苏迎香眼里，就只偏袒南宫远，王春晓为此伤心不已，哭哭啼啼，自暴自弃，还曾泪奔东林寺，想要剃度出家，因此得遇改变一生的契机。\\n他拜于春眠大师膝下，只想学佛，春眠大师却非要逼他习武，王春晓很久以后才知道他师父便是东十三州武霸王，传说中的红蓬王。"
