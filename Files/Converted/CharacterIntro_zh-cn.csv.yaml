- raw: "CharacterIntro1/girl5,一身红白衣裙，恰似雪里梅花，清丽绝俗。\\n年纪虽轻，位份却高，比飞天门大弟子都要金贵，除却四掌门，当属小梅地位最尊。\\n饶是如此，却没半分臭架子，每日都在崆峒山上下跑窜，热心助人，活泼开朗，爱闹爱笑，擅长结交朋友。\\n豢有仙鹤一只，名曰火闪电。\\n是当代崆峒四姝中声望最高的一位，将来嫁予崆峒掌派人，成为第一夫人，彷佛已是既定之数。"
