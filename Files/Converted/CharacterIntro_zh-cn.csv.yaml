- raw: "CharacterIntro2/special999,本来个性更加桀傲不驯，颇有轻狂之色，自认剑法已臻大成，放眼当世不见抗手，正意气风发准备下山闯出一番名堂，便被族妹唤去南阳杏花林，以奇门阵法监禁了足有三个月之久，叫天天不应，叫地地不灵，砍了树还会长，飞天遁地都逃不出杏花仙的五指山。\\n被放出来以后，人消瘦了几圈，人也变得谦虚善良了，同时理解了那是他所不能染指的危险人物。\\n也被下令不准引诱魏菊，非常委屈。"
