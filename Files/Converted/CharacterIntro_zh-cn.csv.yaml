- raw: "CharacterIntro0/special825,瑞笙的红颜知己之一，苗疆巫灵教圣女。还在娘亲腹中便被族中巫婆指作蛟龙妻。瑞笙与三五好友入苗疆，闯越五仙阵，挥剑斩大蛇，揭穿金蟾娘子和银蛇公子的阴谋，喜闻乐见的英雄救美。"
  splits:
  - split: 1
    text: "瑞笙的红颜知己之一，苗疆巫灵教圣女。还在娘亲腹中便被族中巫婆指作蛟龙妻。瑞笙与三五好友入苗疆，闯越五仙阵，挥剑斩大蛇，揭穿金蟾娘子和银蛇公子的阴谋，喜闻乐见的英雄救美。"
    translated: "One of Rui Sheng's beautiful confidants, the Holy Maiden of the Witch Spirit Sect from Miaojiang. Even while still in their mother's womb, they were foretold by the clan's witch to be the wife of a dragon. Rui Sheng, along with a few close friends, ventured into Miaojiang, broke through the Five Immortals Array, wielded their sword to slay a giant serpent, and uncovered the schemes of the Golden Toad Lady and the Silver Serpent Young Lord, delighting in the heroic rescue of the damsel in distress."
