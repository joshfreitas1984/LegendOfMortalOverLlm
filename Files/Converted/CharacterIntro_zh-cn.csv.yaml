    flaggedMistranslation: "Failed"
  - split: 1
    subIndex: 4
    text: "他拜于春眠大师膝下，只想学佛，春眠大师却非要逼他习武，王春晓很久以后才知道他师父便是东十三州武霸王，传说中的红蓬王。"
