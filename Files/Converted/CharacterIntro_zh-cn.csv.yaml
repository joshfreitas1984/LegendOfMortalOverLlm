- raw: "CharacterIntro1/special404,豪爽而憨厚老实，一心求仙，跟随火龙仙君修真，对于自己修练多年始终不能喷火感到十分羞愧。\\n虽然修练仙法不成，实则是福缘深厚之人，机缘巧合习得风刀火剑，为业师所妒，遂以「要突破大乘期就必须累积功德」、「最快累积功德的办法就是上战场救国」为由，骗到宋金战场去送死。\\n但他常住战场，始终没死，反而深受官兵将士信赖，被誉为「道法将军」，战功彪炳，连襄阳守将赵方老将军都破格礼遇。"
