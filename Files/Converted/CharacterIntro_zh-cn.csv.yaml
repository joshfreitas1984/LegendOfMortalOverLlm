- raw: "CharacterIntro4/girl6,事到如今已经无法把视线从你身上挪开了，看着你变得强大、变得坚强的模样，比自己有所成就还令她骄傲。\\n想看你变得更有出息，从旁见证你能走到多远，就算没了师徒名份，还能以你的友人自居，或是按你所想，将自己当奖励嫁你作妻子亦无妨。\\n青出于蓝，更胜于蓝，夏侯兰逢人就想炫耀自己是你师父，亦是你心上之人。\\n你是她恋栈人间的理由。"
