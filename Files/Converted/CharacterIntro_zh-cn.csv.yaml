- raw: "CharacterIntro2/special800,他曾捉拿过一个被人囚于地窖当作禁脔、逃亡之际为了自保而刺死凶徒的稚龄女子。\\n因为心生怜悯，纵放了那无辜的加害者，被兄长的政敌拿住了把柄，向大理寺告发。\\n宋悲凛然辩曰：「刑统立法二百年，民风变移，不宜墨守成规，何况法为先人制订，先人亦人，高居庙堂之上，不知民情，必有疏漏，不近情理，反害天下。我于法不及意处容情，问心无愧。」\\n然而抗辩失败，宋悲被罚俸半年，幽禁府中，幸得其兄宋慈在朝中走动，又有万民请愿，大理寺才收回成命，特赦于他。"
