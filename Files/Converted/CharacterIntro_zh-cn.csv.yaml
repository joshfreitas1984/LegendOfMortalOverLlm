- raw: "CharacterIntro1/girl8,先掌派人临终之前，特地从耕阳读书斋招来的远亲，易旧名为菊，袭任玄功掌门，兼作嫡传女弟子。\\n莫看她柔若无骨，总是笑容可掬的样子，实则御下有方，现为崆峒派司书，上掌高深典籍，下掌一切户籍、六畜、收支用度，崆峒派有她，一切才井井有条。\\n从不与人动武，却深得派中上下敬重，听说她武功之高，惊世骇俗，连山中一门独大的飞天掌门火龙仙君也对这位小娘子忌惮三分。"
