    text: "点苍第一快剑手，苍松剑客……？"
    translated: "Diancang's fastest swordsmaster, Cypress Sword Guest...?"
- raw: "CharacterIntro0/girl2_4,叶家排行第二，点苍第一怪贱手。\\n是叶云裳作案后，用以推卸责任的第二重身份。"
  splits:
  - split: 1
    text: "叶家排行第二，点苍第一怪贱手。"
    translated: "The second in the Ye family, Diancang's first eccentric and miserly hand."
  - split: 1
    subIndex: 1
    text: "是叶云裳作案后，用以推卸责任的第二重身份。"
    translated: "It was Ye Yunshang's secondary identity, which they used to shift the blame after committing the crime."
