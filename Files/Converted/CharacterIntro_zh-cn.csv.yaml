- raw: "CharacterIntro4/girl7,她朦朦胧胧的憧憬逐渐有了鲜明的模样，看起来像你。\\n就算眼力不好，唯独你绝不会错认。\\n她记得你的轮廓，记得你的声音，记得你走路的步伐，记得你身上淡淡药香混杂着金铁之气的味道。\\n你在她眼中，与任何人所见的相貌都不一样，人生难得知己，志同道合，何其有幸？她眼力不好，恰能穿透躯壳而已。\\n小竹的心意没有细究，只是顺其自然，你能见其本心，她也认得真实的你。\\n含羞为君妆容，那身鲜艳的翠绿衣衫，除你之外，再无旁人得见。\\n此外比起铁匠、比起铸剑，其实更喜欢制作玩具，已经是个适婚的姑娘了，对磨喝乐一类精致人偶依然爱不释手，只是怕玩坏，所以不敢拥有。"
