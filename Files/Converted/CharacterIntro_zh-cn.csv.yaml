- raw: "CharacterIntro2/special103,第一眼见到南宫世家那堂皇气派的五进大院时，南宫浅两眼放光，这些人身上的衣料都那么好，肩膀还有金子，想来王孙公子也不过如此。\\n爹爹比想象中更潇洒、威风，便是官府中人，见了都得客客气气。\\n哥哥知书达理，刚见面那会儿，还给了自己糖吃。\\n自己居然能成为他们家人，以为好日子要来了。\\n然而并非如此。\\n家主对谁都和气，唯独对他母子的嫌恶之情藏也藏不住，族人、下人见此，日渐轻蔑。\\n母亲辞世以后，没人护着，更是每况愈下，就连下人都能任意欺凌。\\n在南宫世家的日子不愁吃穿，但南宫家连狗都不愁吃穿呀。\\n从前无忧无虑的孩子，变得畏畏缩缩，终日看人脸色度日。"
