- raw: "CharacterIntro4/girl2,家破人亡那一日，年幼的云裳被朝廷派遣的武林高手给拍了一掌，丹田破碎，经脉尽断，眼见难活。\\n后来历经千难万险，才勉强保住性命，拜入点苍门下。\\n她貌似天真烂漫，其实一直心怀戒慎，就连救她性命的恩师，也不敢轻信。\\n直到你和默铃出现为止。\\n只恨她身作女儿身，这辈子想娶默铃是指望不上了，好在还能够退而求其次，嫁你为妻。\\n虽说你丑，她本来是宁可死了也不愿以身相许，谁知道你这人当真死心塌地，追到地狱也不肯松手。\\n被这样宠过，试问天底谁能不动心呢？\\n总之她不行。"
