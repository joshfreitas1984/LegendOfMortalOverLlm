- raw: "CharacterIntro3/girl2,她身上藏有重大的秘密。\\n叶氏兄妹的曾祖，乃是抗金名将武穆王之子岳云手下的得力大将之一。\\n相传高宗连下十二道金牌，岳飞为全忠义，自甘赴死，惟叹抗金大业未竟，若兵权被奸佞所夺，大宋势将无力回天。故将岳家军主力支散，并藏宝于山中，铸铁兵符交由长子岳云保管，以期未来能执兵符号令旧部，继承护国之志。\\n岂料岳云竟先于其父身死，危难之中托付兵符于部属，嘱其遁隐江湖，静待武穆后人来取。\\n那名部署就此隐姓埋名，避世隐居山林，实则代代死守兵符。\\n白风峒变乱之时，叶家因言获罪，得咎于当朝天子，惨遭灭门之灾，叶家兄妹就此成为孤儿。"
  splits:
