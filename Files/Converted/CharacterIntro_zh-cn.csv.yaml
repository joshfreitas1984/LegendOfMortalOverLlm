- raw: "CharacterIntro3/brother2,比起幼时诀别的亲生父亲，更敬爱师父唐中翎。\\n比起泥教，唐门更像是家。\\n他未曾忘却使命，心念却早不在此，对泥教特使阳奉阴违，想方设法守护唐门。\\n为掌门的旧患翻遍古今典籍，对大师兄得掌门偏爱深感忌妒。\\n和小师妹默铃是同母的兄妹关系，即使说话刻薄，却十分宠溺这个异父妹妹。"
