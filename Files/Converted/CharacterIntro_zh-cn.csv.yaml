- raw: "CharacterIntro3/girl5,就连可怜身世也是虚假的，不过是为了取信崆峒派而刻意编造、安排的假亲人。\\n其真实身份，乃是神秘组织「千灯楼」精心培养的冷血刺客，新任千面人魔候补，精擅易容、毒术、诡计、话术，甚至能以迷魂大法惑人心智。\\n暗中分化崆峒四门，以美色诱杀崆峒才俊无数，只待时机一至，将偌大崆峒覆灭于己手，以此邀功，承袭千面人魔之名。\\n如是种种，亦为假象，是为取信监视者勾魂叟，骗得尸心蛊解药所布的迷障。\\n小梅深藏的憎恶所向，唯有千灯楼主一人而已，心中无所爱，残喘至今，愿杀一人而已。"
