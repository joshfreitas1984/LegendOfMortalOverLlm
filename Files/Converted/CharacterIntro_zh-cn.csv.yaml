- raw: "CharacterIntro0/special7,飞石帮主，形貌剽悍的豪杰。\\n起初是落草于茂州的土匪，成亲后金盆洗手，不再滋扰民生，转而租赁人力包揽粗活，飞石帮名声渐响，隐然能与三大帮派分庭抗礼。"
