- raw: "CharacterIntro4/girl5,每当你出现在附近，小梅心中就会萌生一股又爱又恨的矛盾悸动，恨不得捅你几刀，终究不忍；嘴上嫌你难看，偏又爱不释手。\\n好歹你只是卖相不佳，不似其他人都一张嘴脸，淡而乏味，谁是谁都分不清楚。\\n尽管隐藏得很好，但是小梅对你的执着，已经近乎病态。\\n假如你不忠，打算三妻四妾的话，她会笑着答应，再找机会把你推下楼梯，弄个半死不活，以迷魂法软禁，让你哪里也不能去，只能仰仗她过余生。\\n可你若专心无猜，她就是为你舍了性命，也甘之如饴。\\n你目光远眺的方向，就是她的未来，无论天涯海角，都奉陪到底，与你既是生死之交，也是伴侣。"
