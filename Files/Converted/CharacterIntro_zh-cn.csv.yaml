- raw: "CharacterIntro2/special3,纵使身负绝艺，他为人处世始终兢兢业业，不骄不燥。\\n从不轻易与人相斗，听云宝剑出鞘，当者必杀不留。\\n下山闯荡以来，从未有过例外，饶是如此，\\n不怕死的家伙依然前仆后继拥上来送死。\\n也许是因为这趟旅程带着妹妹的缘故，他格外的小心，连同门师兄弟亦避不见面。\\n高超的武艺，冷静的头脑，谨慎的个性，\\n俊美的容貌，使叶云舟成为了一名传奇剑客。\\n各式各样花巧的头衔开始不顾当事人感受擅自戴到他顶上，但他个人还是比较中意「苍松剑客」。\\n在认识你之前，他对唐门的印象并不好。"
