- raw: "CharacterIntro3/special4,从前毒打八袋长老的那件事，是有原因的。\\n他是百年前灭国的契丹辽人后裔，打从出生以来，就只记得跟随父母流浪中原，而今那些记忆也已经很模糊了。\\n双亲亡故后，只留下一只老狗「阿花」给他。阿花很有灵性，为年幼的他驱蚊赶蛇，朝夕相伴，就像家人一样。\\n有一日他夜里冷醒来，不见了阿花，却见到老乞丐们捧着碗分食狗肉汤。他茫然若失，很久很久才落下泪来。\\n自那一日起，他便举目无亲了，再没什么舍不得的。"
