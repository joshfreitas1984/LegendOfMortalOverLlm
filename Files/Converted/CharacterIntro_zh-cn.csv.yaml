- raw: "CharacterIntro1/special405,常有女香客为了争睹他的英俊面容，佯称被妖魔缠身，上青城求他施法解救，申屠龙明知是假，却照顾大家的心情从不拆穿。\\n青城道士以降妖除魔为己任，但申屠龙压根不信世上有妖怪。\\n要说世上真有什么称得上邪恶，那便是人。"
