- raw: "CharacterIntro1/special809,他爹还没加入丐帮以前，曾有功名在身，只得李富贵一个儿子，所以极其宠腻，李富贵不学无术，不到五岁就会掀姑娘的裙子。\\n后来千金叟散尽家才，加入丐帮，李富贵依然跋扈任性，仗着他爹的脸面狐假虎威，直至王二壮掌毙千金叟，夺权霸占帮主宝座，再也无人撑伞，李富贵才收敛气焰，改名易姓认王二壮作父，意图行刺。\\n殊不知他这点心机，王二壮全都看在眼里，还以为此子能够卧薪尝胆，孺子可教，不想李富贵半点沉不住气，认父当晚就行刺，结果当然是功败垂成。\\n罚当然是要罚的，但不是打骂杀，而是逼他读书、学武，摧残他的心智、煎熬他的肉体。"
