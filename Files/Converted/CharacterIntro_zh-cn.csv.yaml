- raw: "CharacterIntro3/brother1,看似逍遥，万事不萦挂于怀的飒爽模样，其实本性十分叛逆固执。\\n少时曾千方百计逃出唐门，逃回家中，父母无可奈何，方始告知他身世，指点他去见亲生母亲。\\n他在花月楼，见到了身染梅毒，已经神智不清的生母，从旁人那里得知，母亲是散尽了积蓄，才托人收养他，为他洗白身世，再送入唐门拜师。\\n图的便是不让爱子似自己这般，一生由人摆布，受人轻贱。\\n那一日后，唐布衣洗心革面，决心为天下女子撑腰。"
