- raw: "CharacterIntro3/special6,许多年前，有人在藏经阁中，偷塞了一部传奇小说《虬髯客传》。\\n少年僧人觉空偶然读之，心潮澎湃，对书中所描述的豪情心生向往，醉心学武。\\n无奈他自少便在少林寺出家，对世事一窍不通，耳濡目染又都是戒杀远离贪嗔痴、爱憎会的佛法，纵想入世游历，亦难过得了自个儿设下的那道坎，心痒难搔之际，只得下打几套烦恼拳排解。\\n身在世外，心却落在人间，他忍过了几度春秋，即使身任达摩院首座，亦只有换得空虚。\\n直至旧魔教极乐教猖獗之时，少年英雄龙渊号召群雄，少林随即响应，他躬逢其盛，在那一役中打响了偌大名声，达摩院首座技惊四座。"
  splits:
  - split: 1
    text: "许多年前，有人在藏经阁中，偷塞了一部传奇小说《虬髯客传》。"
