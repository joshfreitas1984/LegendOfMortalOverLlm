- raw: "CharacterIntro4/sister1,唐门里姓唐的全是家人，只有你不姓唐，偏生又那么熟稔，不知该怎么归类。\\n默铃变得非常的关注你。\\n无时不刻想要靠近你，安静地在你附近待着。\\n她纯真的眼里见不到皮相的美丑，只是单纯地贪恋着安心的感觉。\\n对江湖事不太上心，连下山的路都认不清，却十分清楚自己倾慕着你。\\n面无表情的少女像花一样绽放着，与你相偕的平凡岁月，每一天都无与伦比。"
