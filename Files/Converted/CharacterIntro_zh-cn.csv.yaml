- raw: "CharacterIntro2/girl2,不知为何与兄长下得山来，\\n却被点苍山派人缉拿。\\n江湖中人觊觎者亦在所多有，\\n为此不得不藏匿行踪。\\n放着无忧无虑的好日子不过，宁可任性地浪迹天涯。旅途艰辛，使她发烧病倒的频率变得更高了，每当意识朦胧，只要捉着兄长的衣襬就能安然睡去。\\n「有哥哥在就好，其他的什么我都不要了，\\n像现在这样相依为命，跟从前一样......」"
