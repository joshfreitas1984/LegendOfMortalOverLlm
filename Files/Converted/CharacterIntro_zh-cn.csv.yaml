- raw: "CharacterIntro4/brother4,四师兄知道了自己的生世，得知父母健在，家有兄弟姊妹十人，都在温饱环境下长大，既感妒忌，又觉不甘，可心头的大石始终放了下来。\\n踌躇了好多年的怨言，见了有血缘关系的双亲，却说不出口，究竟是怎么回事，也说不清楚，总觉得那些人似乎不是可以撒娇的对象。\\n最终他婉拒了亲生父母的慰留，回到了唐门。\\n有大鱼大肉不吃，还是死皮赖脸跟师兄弟们抢粗茶淡饭。\\n为人一样奸滑贪财，对掌门依然孝顺。\\n四师兄也有他的家人，就在唐门。"
