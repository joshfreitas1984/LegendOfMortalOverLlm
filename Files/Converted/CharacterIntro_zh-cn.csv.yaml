- raw: "CharacterIntro0/special2,最为江湖人津津乐道的武林传奇之一。在他的诸般传奇事迹之中，尤以决战极乐教主为最。其后旧魔教覆灭，而正邪两道最强高手亦销声匿迹，完结了一个时代。"
