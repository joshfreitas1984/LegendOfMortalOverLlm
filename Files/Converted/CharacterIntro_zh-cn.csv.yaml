- raw: "CharacterIntro2/brother1,经常出入花月楼，大把银子如流水般撒将出去，被花月楼的姑娘戏称为楼主，连老鸨也爱煞了他。\\n侠名远播，同时恶名昭彰。\\n江湖人都怕了这位少年英雄，偏生又没名分治他，只得把自家妻女看管得严严实实的，就怕这人会偷心。\\n对于小师妹向来是当成亲生妹妹一般疼爱，\\n没别的想法。"
