- raw: "CharacterIntro1/special6,他曾是故事中人，位嵩山寺达摩院首席，法名觉空。觉空禅师身兼七十二武技之七，尤以外功龙爪手最为拿手。武功之高，不下于身有易筋经功力的方丈师兄。位高而德重，等闲不在江湖中行走，及至天命之年后，辞退首座一席，远赴襄阳六道峡挑战泥教天王，及后不知所踪。再出没时已然还俗，改号自称鹰人。"
  splits:
  - split: 1
    text: "他曾是故事中人，位嵩山寺达摩院首席，法名觉空。觉空禅师身兼七十二武技之七，尤以外功龙爪手最为拿手。武功之高，不下于身有易筋经功力的方丈师兄。位高而德重，等闲不在江湖中行走，及至天命之年后，辞退首座一席，远赴襄阳六道峡挑战泥教天王，及后不知所踪。再出没时已然还俗，改号自称鹰人。"
    translated: "He was once a figure in the tale, the head of the Dharma Academy at Songshan Temple, with his dharma name being Juekong. Juekong Zen Master possessed seven out of seventy‑two martial arts skills, and was particularly skilled in external skill Dragon Claw Hand. His martial prowess was no less than that of Senior Brother Abbot. Despite his high position and great virtue, he seldom walked among the Jianghu. Upon reaching the age of natural destiny, he resigned from his post as chief monk and journeyed far to Pengyang's Six Paths Canyon to challenge the Mud Cult's Heavenly King. After that, there was no trace of him. When he reappeared, he had already renounced his vows, taking on the name Eagle Man for himself."
- raw: "CharacterIntro2/special6,为求名而入世涉江湖，可任他如何积极走动，鹰人的名号都传不开来。\\n他仍不绝游走于宋金两国交界，时有耳闻他会助纣为虐，给零星战役后得胜宋兵泼冷水说教惹人嫌。\\n年纪虽大，行事却颇具血性，中原群侠虽不与之结交，在两国百姓之间却很受欢迎。\\n嗜酒，但是酒量却不太行。"
  splits:
