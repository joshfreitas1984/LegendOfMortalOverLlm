- raw: "CharacterIntro1/girl6,容姿凄艳，武艺高超，令诸多年轻侠客神魂颠倒，曾是最有望成为第一掌派夫人的崆峒女弟子。\\n只可惜昔年那一出悲剧，改写了这位姑娘的人生，那日起她就像失了魂般，再也不曾开怀笑过，不知目视何方，纵使晴天也撑着伞，彷佛她眼中的世界，大雨从未消停过。"
