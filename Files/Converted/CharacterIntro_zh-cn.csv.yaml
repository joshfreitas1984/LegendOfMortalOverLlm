- raw: "CharacterIntro1/special4,来自丐帮，近年来崛起的江湖新秀。他坚信弱肉强食的道理，弱者注定受人欺压，唯有强者才能在这世道生存。莫欺他个头矮小，打起架来却有如狂犬一般，拳爪膝肘牙样样皆来，端的是天不怕地不怕，狠的要命。不知打哪学来的一套《揍狗拳》，命名粗俗，却拙中有巧，讲究一字心诀：「狠」，招招都把人往死里揍。曾经趁一名年迈的八袋长老半夜起身如厕时尾行其后，将其狂殴透扁，打断四肢推进粪坑。此后帮中即令是老资历的多袋长老，也不敢在他面前倚老卖老，因为这人是疯的。别说不管男女老少，只怕这人连大宋皇帝都敢打。"
  splits:
