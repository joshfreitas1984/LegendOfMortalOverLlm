- raw: "CharacterIntro4/special4,她的芳名叫做「樊咲嫣」，是她母亲学了汉语后，希望她生活无忧，能够巧笑嫣然。\\n然则，却不幸碰上了专干采生折割阴损事的恶丐，将年幼的她拐了去，本欲将她制成「人狗」，\\n却可惜她天生丽质，转念便将她收为禁脔，藏于乞丐窝取乐戏弄，只待她身骨长成就下手。\\n因王帮主介入，没有成真，饶是如此，被当狗养也让她的身心体无完肤。\\n这人间兴许有乐土，纵使边疆兵争不断，也有一隅偏安；天黑了也有夜市，有光，有家可归，可是哪里都没有该她回的地方。\\n直至你的出现。\\n她信仰你，对你忠心耿耿，唯有你才是家。"
