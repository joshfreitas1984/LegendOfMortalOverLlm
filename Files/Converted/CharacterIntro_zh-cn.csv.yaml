- raw: "CharacterIntro2/special4,他在丐帮之中，也是格格不入的，没有特别亲近的同辈人，劝得住他的人也屈指可数。\\n因为自小唱不好莲花落，行乞总是失败收场，若无老丐「阿叔」照料，只怕早已饿死。\\n兴许是此故，从来只肯听从阿叔说话，人前是狂犬，在阿叔身侧就很老实。\\n虽然和人不相亲，但是似乎喜欢小动物，时常有人看见他将得来不易的食物分给流浪动物吃。"
