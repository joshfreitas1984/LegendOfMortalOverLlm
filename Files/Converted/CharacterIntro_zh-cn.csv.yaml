- raw: "CharacterIntro2/girl5,据说，小梅生母是极乐教妖女。\\n其母脱离魔爪以后，嫁人生女，安贫乐道，无奈好景不常，火龙仙君美其名曰刬恶除奸，狠心拆散天伦，强收虞氏孤女为门下弟子，改名小梅，着意培养，欲图第一掌派夫人之位，以此稳固的权势。\\n是以小梅看似天真烂漫，其实对崆峒派揣怀着仇恨，总是笑吟吟的穿针引线，将种种事情往恶劣的局势诱导，作为报复。\\n甚至私下将本门秘籍《仙鹤迷踪拳》传授给火闪电，强迫鸟学武功，都不顾火闪电的感受，简直不可理喻。"
