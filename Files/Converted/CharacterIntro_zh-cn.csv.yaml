- raw: "CharacterIntro3/girl7,力大无穷，是因幼时受小梅所蒙骗，吞服了灵药「铁鳞黑蟒血」的缘故。\\n此后高烧一场，眼力大不如前，兼而体质豹变，不再长高长大，取而代之的是即使不练武功，力气、体重也会与日俱增，再这样下去，迟早变得力拔山兮气盖世，亦未可知。\\n小竹嘴上虽然满不在乎，其实对素未谋面的未来掌派人，抱持着一丝淡淡的期待。\\n希望他会是好人；希望他会比任何人都重视自己；希望他武功盖世，相形之下，自己会显得可怜楚楚。\\n抱着不切实际的想象，这位怀春少女日复一日磨练技艺，想为她将来夫君献上绵薄之力。\\n衣箱底下，珍而重之收藏着一件鲜艳衣裳，逢年过节也舍不得穿，之所以带着手套，是由于两手尽是老茧伤疤，不愿让人看见的缘故。"
