- raw: "CharacterIntro0/girl7,崆峒派．铁拳门当代的嫡传女弟子。\\n身材娇小，眼神凶恶的绿衣少女。\\n因为锻冶手艺高明，颇负盛名，传闻她力大无穷，能徒手掐碎旁人手骨，故而江湖人称「裂骨魔」。"
