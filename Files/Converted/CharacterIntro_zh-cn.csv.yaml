- raw: "CharacterIntro1/special7,石公远少年时，曾投身军旅，\\n为名将毕再遇军中小卒。\\n及后逃兵，落草于茂州茂湿山，成为山贼。\\n石公远胸无大志，过得一日是一日，与帮众成日饮酒吃肉，醉生梦死，以逞凶为勇，\\n横练外功有成，生得孔武有力，\\n更加肆无忌惮。\\n更曾大胆劫持徒步上任的新知州，强娶知州千金为压寨夫人。"
