- raw: "CharacterIntro2/girl7,因为生父滥赌而被卖到崆峒，身价五贯钱，那还是看她天生美人胚子、又是完璧之身的份上，才有这价。还道前途可期，怎料不知何时起，这丫头就长不高了，令铁拳门人大失所望。\\n小竹本人对掌派夫人之位不抱期望，但旁人轻蔑眼光怎么也无法习以为常，内心越是自卑，就越是逞强。\\n内心深处羡煞了寻常人家的小娘子，能以蒲柳之姿，纤纤弱质，惹人见怜。可惜天不从人愿，这姑娘看似娇小玲珑的身躯之中，蕴藏着无穷怪力，没半分福态，体重却是异于常人。\\n唯一尚足庆幸的，便是买她作徒弟的老掌门，临终之际将大铁铺留给了她，从此小竹一手包办山中木工铁器，有时铸造农具，有时锻打兵器，闲来无事，也自己琢磨机关巧术，每有灵感，便废寝忘食，作不成掌派夫人也怡然自得。\\n梦想是成为像鲁班、欧冶子那样的不世名匠。"
