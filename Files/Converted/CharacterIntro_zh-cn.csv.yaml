- raw: "CharacterIntro2/special7,知州千金成了压寨夫人后，\\n石公远的浪荡生活也到头了。\\n谁也不知那位娇滴滴的千金，\\n竟是个母老虎，凶得过这彪形大汉，\\n可怜山贼头领沦为妻管严。\\n在妻子温言劝谏下，负荆至衙门请罪，\\n下狱刑求，只道此番必死，\\n却是他的年轻妻子求情纵放了他。\\n知州引入内堂，赦免从前罪衍，令其拜地，\\n总算是认了这个女婿。"
