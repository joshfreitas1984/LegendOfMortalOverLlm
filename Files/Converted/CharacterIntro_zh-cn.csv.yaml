- raw: "CharacterIntro2/special102,有感于楚霸王烏江自刎，引以为惕，认为光凭武勇不能成事，试问古来哪位开国君王是自己武功高强？逞匹夫之勇者，枉送性命而已。\\n为此诸事都仅浅尝即止，大公子四艺皆全，也都不求甚解。\\n学文学武的态度也都得过且过，善以巧舌敷衍。\\n他认为自己真正的课题，应该是知人善用，能使唤最强的武人，驱策最博学的文人，方为真正的人上之人。\\n虽然颇有才略，但也免不了公子哥的习性，贪花好色，与三五好友并称花城四少，是烟花柳巷的常客。\\n要不是上官萤脸皮薄、拳头硬，保不定未过门就得出乱子。"
