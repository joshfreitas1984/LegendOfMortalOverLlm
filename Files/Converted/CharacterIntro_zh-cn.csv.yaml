- raw: "CharacterIntro1/special401,眼神慵懒，消极颓废，嗜好是钓鱼。\\n自称不爱喝酒，但是经常烂醉如泥。\\n王二壮是丐帮由黑转白的关键，统帅丐帮以来，大力宣扬侠义，令年轻丐帮弟子眼里重新有光，愿意相信自己身陷泥泞，仍能出淤泥而不染。\\n只要心怀侠义，便是鹑衣百结也能自豪，那些最清廉的官儿，可不就是两袖清风吗？\\n新派崛起，一扫丐帮从前恶习，所行无不光明正大，再也不干偷鸡摸狗的事，恨不能行侠仗义。\\n老派依然势众，一边斥骂新派不伦不类，沦为乞丐还自命清高，一边又坐享新派挣来的美名。"
