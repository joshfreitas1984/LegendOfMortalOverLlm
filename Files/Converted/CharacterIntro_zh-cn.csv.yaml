- raw: "CharacterIntro1/special999,年纪轻轻，不知怎地一身武功高得出奇，自言出身孤云山派，可任谁也没曾听闻这名不见经传的小门派。\\n对江湖充满憧憬，背着宝剑四处游历，好管闲事，爱打抱不平，处世谦抑而重情义，人缘绝佳，各派都结识了朋友。\\n出山以来，对他一见倾心的女子大有人在，可他在意的小娘子，全都不是易与之辈，因此备受挫折。"
