- raw: "CharacterIntro1/special800,官拜和安至保安郎，虽是从七品，但加个御前带刀的头衔，便是当朝一品大员也不能对他任意辱骂，他可是官家的刀，也以此为豪。\\n除非天子，否则对谁都不亢不卑，这既是官家的期许，也是他自江湖熬来的胆气。\\n要是查明贪官污吏，王爷都敢捉拿，反之也极富人情味，宋刑统倒背如流，可遇着于法难容，但情有可原的情况，也常睁一只眼闭一只眼，或求情请从宽发落。"
