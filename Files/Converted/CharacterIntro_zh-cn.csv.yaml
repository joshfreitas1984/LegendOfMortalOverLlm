- raw: "CharacterIntro4/special3,他无时不刻在试探着你，寄与厚望，同时也等着你背叛他。\\n当你露出贪婪面孔的那一刻，他便会一剑捅死你，同时灭绝自己最后一丝良心，化为复仇的恶鬼，扑杀所有仇敌。\\n然而你似乎令他的期望落空了，你并非圣人，只是对人情的执着远超于宝藏吸引，从而使他相信「义」确实存于天地之间。\\n隐约变得能够体谅曾祖自私的决定了。\\n你救活了他唯一亲人的性命，也救活了他的心，使他不再是一个为复仇而行动、无法想象未来的行尸走肉。此刻他方始作为自己活着。"
