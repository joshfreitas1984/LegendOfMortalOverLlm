- raw: "CharacterIntro2/brother3,那一年的大雨凉亭中，与唐中翎相逢忘机，畅谈天下事，好不快哉。\\n一个寒窗穷书生，一个落拓江湖人。\\n一文一武，纵然见地相左，\\n也互生了敬重之意。\\n纵然拜入唐门习武，二人相处却更似忘年知己，经常一块品茶话春秋。\\n大师兄、二师兄都在他眼皮子底下长大，\\n虽然位份高，却从来不敢以兄长自居。\\n只可惜起步习武太晚，要与天下英雄争高低，终究是迟了。\\n话虽如此，他天性也不爱逞强斗狠便是，\\n孙子兵法有云，上兵伐谋。\\n不打架的才是赢家。"
