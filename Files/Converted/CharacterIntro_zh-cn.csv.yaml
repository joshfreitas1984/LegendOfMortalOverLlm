- raw: "CharacterIntro1/girl9,师从嵩山派福建分院，自小便受佛法熏陶，也学些拳脚功夫防身，武功不算高明，唯独天赋异禀，是个能将苦恼拳发挥到突破十二成功力的奇女子，你最好招子放亮点，别太惹人生气。\\n自小便与南宫世家大公子有婚姻之约，尽管尽心经营这段关系，但相处始终不大融洽。\\n与崆峒派魏菊曾有同窗之谊，引为至交，幼时经常花钱收买小菊帮忙写作业。\\n长大以后投桃报李，不时会去崆峒探望，将自家御贡的茶叶送给对方，二人均对传说中的杏花仙抱持着敬畏的心情。"
