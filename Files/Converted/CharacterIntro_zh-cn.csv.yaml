- raw: "CharacterIntro1/girl7,由于眼力不好，经常瞇着眼睛瞧人，产生了无论对谁都目露凶光的恶劣印象，其实是位性情纯良的姑娘。\\n身为铁拳门当代嫡传女弟子，有权角逐将来掌派夫人之位的人选，按理应该备受尊崇，但实际上谁也不将这臭脸矮冬瓜当作一回事，铁拳门似乎也已经放弃挣扎了，由着她窝居在大铁铺中敲敲打打，浑不似个大家闺秀。\\n手头爱用的铁槌虽是凡物，但一双貌不惊人的手套却是价值连城的宝物，乃由天山「乌蚕丝」织就，水火不侵，刀枪不入。"
