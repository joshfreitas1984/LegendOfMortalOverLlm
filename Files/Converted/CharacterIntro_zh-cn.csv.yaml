- raw: "CharacterIntro1/brother3,唐门掌门第三位亲传弟子。\\n少时满腔热血，寒窗苦读十数载，\\n立誓考取功名，将才学见识用以造福社稷。\\n岂料却因开罪权贵而致名落孙山，引来杀身之祸。\\n万幸者是，他曾与犹未接任掌门的唐中翎有过同一个亭下避雨的缘分。\\n危难之中，为唐中翎所救，\\n鬼门关前走一遭，万念俱灰，遂绝了报效朝廷的念头，拜入唐门。\\n兴趣是说书，闲来笑谈江湖事，\\n不问生杀，自也豁达。"
