- raw: "CharacterIntro2/sister1,虽然练功不辍，但其实不喜欢练功。\\n起初时常哭出来。\\n练功很辛苦，又怕父亲责打，每当难过便逃奔母亲怀抱，否则便是求庇于大师兄、二师兄。母亲辞世以后，便不再逃跑了。\\n不知不觉，已经练到出完一套拳收功，连一滴汗也不会流的地步。\\n连眼泪也一并忘记该怎么流了。\\n她将感情深锁在心底，谁也见不到她的真实面容。"
