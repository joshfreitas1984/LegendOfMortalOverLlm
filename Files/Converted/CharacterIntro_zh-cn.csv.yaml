- raw: "CharacterIntro2/girl4,对父亲的记忆，如今很稀薄了。\\n遥远记忆里那一日，他摸摸她小脑袋瓜，一笑出门去，便再也不曾回来。\\n后来锦香宫温夫人才接了她去，收入门墙。\\n辗转听人传闻，才知道父亲是武林传奇，既悲伤又骄傲，沿着父亲的足迹，造访故人，想搜集更多已故生父的故事，凭此怀念。\\n一身剑法皆得于家传秘籍，龙渊七绝中，尤擅剑法，自小便以鸡腿为剑，悟出人剑合一的奥义而浑不自觉，至今也不太清楚自己究竟算不算高手。\\n不过武功再高，依然会迷路、被骗钱、饿晕在路边，这样都能生存，运气实在不得了。"
