- raw: "CharacterIntro0/girl5,崆峒派‧飞天门当代的嫡传女弟子，天真烂漫，活泼开朗的妙龄少女。\\n江湖名声不响，在崆峒派却是四门嫡传女弟子之中呼声最高的一位，第一掌派夫人之位，势在必得。"
