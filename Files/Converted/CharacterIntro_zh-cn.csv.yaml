- raw: "CharacterIntro1/brother1,唐门掌门座下第一大弟子。\\n武林中声望最高的年轻侠客之一，\\n为人放荡不羁，爽朗豪迈，不拘小节。\\n曾经听闻不平事，下山越省杀贪官，\\n开仓济民，事了拂衣而去；\\n亦曾慕美人芳名，不远千里争见，\\n片面之缘后，又消失无踪，徒惹薄幸名声。\\n来去如风，江湖人称之飞侠。\\n对于唐门区分内外弟子的陋习嗤之以鼻，\\n经常怂恿外姓师弟们一块偷懒玩耍，\\n非常擅长惹师父生气。"
