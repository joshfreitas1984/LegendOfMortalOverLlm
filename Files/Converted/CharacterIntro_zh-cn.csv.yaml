    text: "他样样都比南宫远行，可是苏迎香眼里，就只偏袒南宫远，王春晓为此伤心不已，哭哭啼啼，自暴自弃，还曾泪奔东林寺，想要剃度出家，因此得遇改变一生的契机。"
