- raw: "CharacterIntro4/girl4,放眼江湖，挨她毒打最多次的人，莫过于你了。\\n怎么打都锲而不舍，反是她越打越不舍得。\\n她厌倦了空有皮相，锦衣华服，卖弄潇洒风流的武林少侠，偏爱你的骨气。\\n『我的心上人，是天下第一的大英雄，大豪杰，铁骨铮铮，顶天立地。』就像父亲一样，如是说道，龙湘事后脸红了三天，见了你就会立刻拔剑相向。\\n但是离不开你的照顾，最终都只能强抑着羞耻心回到你身边。\\n偶尔也想振作起来，干些为人妻子的本份，因此在缝补衣物时撕烂了你的衣衫、在煮菜时烧了房子。\\n你最好别对这人心怀期待。"
