- raw: "CharacterIntro1/girl2,叶云舟的胞妹，我见犹怜的病美人。\\n生来体弱，经常发烧卧病在床，\\n幸而生性达观，不以为意。\\n爱撒娇，点苍上下无不溺爱于她，\\n可谓呼风唤雨。\\n虽然在兄长督促下习练点苍武功心法，但限于体质，纵使记得滚瓜烂熟，亦难有进境，连走得稍微快些都会喘，更遑论舞刀弄剑。\\n没有特别的爱好，但是对于山下的世界充满好奇。\\n讨厌吃苦，讨厌吃药，硬是强喂就会吐，\\n吐完还会一副幸灾乐祸的嘴脸嘲讽人。"
