- raw: "CharacterIntro2/girl6,夏侯兰是如今已遭灭门的雪山派遗孤。未出世之际，便与上官世家有指腹为婚之谊，她爹娘想让孩儿在温暖的地方落地生根，离此苦寒之地，一世无忧。\\n如今一切都成了梦幻泡影。\\n她走过雨水风霜，见过人情冷暖，挺身力抗过不可抗衡的权威，战过无法战胜的敌人。\\n深爱过某人，把心弄得伤痕累累。\\n渴望的事物求不得，手中仅存的也抓不牢。\\n夏侯兰的故事已经结束了。\\n往后的事，与你相遇的事也不过是味如嚼蜡的余兴而已。"
