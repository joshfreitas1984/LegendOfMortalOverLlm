- raw: "CharacterIntro2/girl8,曾以女儿身，独占鳌头的当代大才女，金陵城中，无人不知她魏才女的名声。每日千金相赠，为争见一面的才子不知凡几，这位才女读书多了，心气也傲，常以对联难人，推辞不见。\\n就像许多文人那般，她自视甚高，心怀天下，遂束发应科举，及第省元，又赴皇宫成为天子门生，以洋洋洒洒三千文惊动朝堂，高中状元。\\n本以为纵使不像林幼玉那般，能受封作官，也总算能似吴志端青史留名，证明她魏招弟的惊世才学。\\n岂料朝中重臣早已受够了这些女子牝鸡司晨，一个个都太有才干，倒显得自己很无能，于是费劲唇舌怂恿官家下诏：「此女才貌双全，宜配德宣节校尉」，亦即是将她许配给人为妻，还是一个从八品上的武官。那人钦慕她的名声，却因有虐妻致死的恶名，被魏才女拒之门外，如今花了重金买通上层，才将她纳入阁中。\\n新婚之夜，魏才女涕泪纵横，想保全名节，觅三尺白绫亦不可得，哭了一阵，只觉校卫府静得出奇，推门一看，才发现全家上下三十口人尽数上吊死绝。\\n晃荡尸林下，杏花仙似笑非笑，招手邀她同游。"
