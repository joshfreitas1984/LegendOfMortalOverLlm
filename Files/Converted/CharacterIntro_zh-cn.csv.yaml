- raw: "CharacterIntro3/special7,在贤内助的辅佐下，召集从前匪众，另起炉灶，是为飞石帮。\\n专门出租人力，包揽粗工杂活，做外包生意。\\n招人无论品行好坏，却得谨记帮规，不得滋扰民生，石公远亦洗心革面，变成了急公好义的善人。\\n飞石帮崛起极快，不到二十年间，已有数百帮众，隐能与江湖三大帮分庭抗礼。"
