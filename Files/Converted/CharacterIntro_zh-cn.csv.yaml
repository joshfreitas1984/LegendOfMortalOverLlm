- raw: "CharacterIntro3/sister1,掌门师娘辞世前，曾哄骗女儿道：「我要下到唐门幽谷中闭关十年，若你想我了，便折一只纸鹤，送到谷底，我见了，便知道你在思念娘亲。」因此小师妹十年来一日不绝，每夜都会在窗边折纸鹤，写满对母亲的思念之情。她畏惧着人间，害怕认识的人一个接一个离开，每夜都怕得不能自已。"
