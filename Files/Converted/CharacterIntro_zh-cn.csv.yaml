- raw: "CharacterIntro3/special3,他的心中秘藏着沸腾的热血，握紧着宝剑，在心中演练数千万次出鞘的时刻。\\n「叶」其实不是他家的姓氏。就为了信守一个恐怕永远没有实现之日的诺言，他们家族放弃了自己的姓氏。\\n他们兄妹的「叶云」二字，则是为了纪念曾祖所侍之主岳云而取。\\n身为叶家第三代男丁，犹未出世就被安排了人生，要作船舟，为国尽忠，死而后已。\\n世人皆云，点苍叶云舟乃是用剑的奇才，他本人深不以为然，世上哪有什么天才呢？那是日以继夜勤练不辍，苦心孤诣修得的成果。"
