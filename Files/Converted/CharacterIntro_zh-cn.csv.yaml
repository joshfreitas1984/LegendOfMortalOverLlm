- raw: "CharacterIntro3/girl6,你是当世最后一个知晓她本来姓名的人－－『夏侯梅』。\\n被带到崆峒派以后，就被篡夺了爹娘为她取的名字，从师命，改名为夏侯兰。后又得先掌派人亲传，一身兼得夺魄、雪山两家阴阳内功，融会贯通，实为当代崆峒第一高手，离绝世境界只欠一步之遥。\\n你的出现，占了她心上最后一席空缺，毕竟她并没收过弟子。\\n起初不过是玩笑话，越教越认真，不禁连她都感到不可思议，对旁人没有半点耐心，可你的驽钝、蠢笨都能令她莞尔，就连你的相貌都令她心生怜惜，怕留你独活于世，不知要受多少苦楚。\\n是该珍惜时光，倾囊相授，令你不受人欺呢，还是辞世之际，带你一起走才好呢……？"
