- raw: "Story/D_S2002_02_004,上官小娘子好。唐某早听闻，上官家有女英华外放，不让须眉，今日得见，果然名不虚传。"
  splits:
  - split: 1
    text: "上官小娘子好。唐某早听闻，上官家有女英华外放，不让须眉，今日得见，果然名不虚传。"
    translated: "Greetings, Lady Shangguan. I, Tang, have long heard that the Shangguan family has a daughter whose brilliance shines outward, surpassing men. Now that I see you in person, indeed, the reputation is well deserved."
- raw: "Story/D_S2002_02_005,唐三爷，切莫取笑小女子，要知我只是无可奈何呀。只怕在唐三爷这等大儒眼中，女儿家这般抛头露面，又是从商，怕是不好吧。"
  splits:
  - split: 1
    text: "唐三爷，切莫取笑小女子，要知我只是无可奈何呀。只怕在唐三爷这等大儒眼中，女儿家这般抛头露面，又是从商，怕是不好吧。"
    translated: "Third Master Tang, please do not mock the young lady. You see, I am merely in a bind. Afraid that in Your Excellency's eyes, a woman appearing in public and doing business might not be appropriate."
- raw: "Story/D_S2002_02_006,哪儿的话，我再酸儒，也不至于这般迂腐。入得江湖来，立身已然不易，何况上官姑娘是未出阁的千金，足见手段高明。"
  splits:
  - split: 1
    text: "哪儿的话，我再酸儒，也不至于这般迂腐。入得江湖来，立身已然不易，何况上官姑娘是未出阁的千金，足见手段高明。"
    translated: "Nonsense, even if I were overly refined, I wouldn't be this rigid. Having entered Jianghu, establishing oneself is already difficult, let alone Lady Shangguan, an unmarried maiden, clearly demonstrating her remarkable skills."
- raw: "Story/D_S2002_02_007,我岂能说是高明？不过倚仗家业罢了。上官家世居福州，不过讨海人家，家父本想捐得虚衔，在地不至给人欺侮。岂知竟蒙官家钦选为御船监造，只累得分身乏术。"
  splits:
  - split: 1
    text: "我岂能说是高明？不过倚仗家业罢了。上官家世居福州，不过讨海人家，家父本想捐得虚衔，在地不至给人欺侮。岂知竟蒙官家钦选为御船监造，只累得分身乏术。"
    translated: "How could I claim to be skilled? It's just that I rely on my family's resources. The Shangguan family has lived in Fuzhou for generations, originally as fishermen. My father intended to purchase an honorary title to avoid being bullied locally. Little did they know they were unexpectedly appointed as the imperial shipbuilding supervisor, only to be overwhelmed with responsibilities."
- raw: "Story/D_S2002_02_008,家中生意无人可托，可上下家仆、雇人都等着吃饭呢。无法可想，只得由我这个亲生女儿硬着头皮，出面帮忙打点一二。万幸生意上的伙伴尚算仗义，家计勉强还过得去吧。"
  splits:
  - split: 1
    text: "家中生意无人可托，可上下家仆、雇人都等着吃饭呢。无法可想，只得由我这个亲生女儿硬着头皮，出面帮忙打点一二。万幸生意上的伙伴尚算仗义，家计勉强还过得去吧。"
    translated: "The family business has no one to entrust, but the servants and hired workers are all waiting for meals. There's no way to think of, so I, my own daughter, have to dare to face it head‑on and step forward to help manage a bit. Fortunately, the business partners are still considerate, so the family's finances are barely manageable."
