- raw: "Story/D_S2002_02_018,都是些大米、布匹，不是名贵事物，请唐三爷切莫推辞。恕我不讳言，唐门困境，我远在福建亦有耳闻。以我二家的交情，早该仗义相助，不过来得迟，总比不来的好。"
