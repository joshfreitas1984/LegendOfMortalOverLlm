- raw: "Story/D_S2002_02_013,说来唐门与上官家同为三大世家，只因天南海北，难免疏远，淡了情分。我这回外出经商，临时起意，绕道前来瞻仰唐门前辈，希望不算唐突。"
  splits:
  - split: 1
    text: "说来唐门与上官家同为三大世家，只因天南海北，难免疏远，淡了情分。我这回外出经商，临时起意，绕道前来瞻仰唐门前辈，希望不算唐突。"
    translated: "The Tang Clan and the Shangguan family are both among the Three Great Families. Due to being scattered across the land and sea, they inevitably grew distant, and the bond between them faded. This time, on my business trip, I spontaneously decided to detour and visit the Tang Clan's elders, hoping it was not impolite."
