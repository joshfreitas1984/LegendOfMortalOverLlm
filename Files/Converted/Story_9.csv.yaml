    text: "你学着从前大师兄的样，拽着本该用功练武的师弟们游山玩水，唱山歌、喝酒、玩水、赛跑、捉溪鱼来烤、用暗器打野味。武林盟一役后，若这些师弟们侥幸能活，今日自会成为他们珍贵的记忆吧。"
