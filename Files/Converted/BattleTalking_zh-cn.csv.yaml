  splits:
  - split: 1
    text: "是哪个王八蛋走漏了风声？"
    translated: "Who's the bastard who spilled the beans?"
- raw: "BattleDialog/Ch_2_4_9_4_003,那个姓赵的灰孙子是内奸！宰了他！"
  splits:
  - split: 1
    text: "那个姓赵的灰孙子是内奸！宰了他！"
    translated: "That Zhao surname gray grandson is an internal traitor! Kill him!"
- raw: "BattleDialog/Ch_2_4_9_4_004,风紧，扯乎！"
  splits:
  - split: 1
    text: "风紧，扯乎！"
    translated: "The wind is strong, it's pulling!"
- raw: "BattleDialog/Ch_2_4_9_4_005,哎唷魔教的你滚开啦！"
  splits:
  - split: 1
    text: "哎唷魔教的你滚开啦！"
    translated: "Oh no, get out of the way, Demon Sect!"
- raw: "BattleDialog/Ch_2_4_9_5_001,唐门真是孬种，竟还要六大派遣人保护！"
  splits:
  - split: 1
    text: "唐门真是孬种，竟还要六大派遣人保护！"
    translated: "The Tang Clan are truly cowards, they even need six major dispatched people to protect them!"
- raw: "BattleDialog/Ch_2_4_9_5_002,本想待会儿再来对付唐门，尔等自己来送死就另当别论！"
  splits:
  - split: 1
    text: "本想待会儿再来对付唐门，尔等自己来送死就另当别论！"
    translated: "I was going to deal with the Tang Clan later, but if you all come to your own death, that's a different matter!"
- raw: "BattleDialog/Ch_2_4_9_5_003,这群正派人士看穿了咱们打算袭击唐门的！"
  splits:
  - split: 1
    text: "这群正派人士看穿了咱们打算袭击唐门的！"
    translated: "These righteous people have figured out our plan to attack the Tang Clan!"
