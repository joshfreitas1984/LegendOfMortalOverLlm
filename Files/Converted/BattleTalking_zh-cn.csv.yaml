- raw: "BattleDialog/HitPlayer,扁他！"
  splits:
  - split: 1
    text: "扁他！"
    translated: "Take him down!"
- raw: "BattleDialog/Stone_001,呀阿阿阿阿阿阿！"
  splits:
  - split: 1
    text: "呀阿阿阿阿阿阿！"
    translated: "Ah! Ah! Ah! Ah! Ah! Ah!"
- raw: "BattleDialog/Ch_2_4_9_1_001,唐门果然跟魔教同流合污！"
  splits:
  - split: 1
    text: "唐门果然跟魔教同流合污！"
    translated: "The Tang Clan has indeed aligned with the Demon Sect!"
- raw: "BattleDialog/Ch_2_4_9_1_002,唐门的你们长不长眼，魔教分明也是来害你们的！"
  splits:
  - split: 1
    text: "唐门的你们长不长眼，魔教分明也是来害你们的！"
    translated: "You people of the Tang Clan, you're blind as a bat! The Demon Sect is clearly here to harm you!"
- raw: "BattleDialog/Ch_2_4_9_1_003,我们中计了！"
  splits:
  - split: 1
    text: "我们中计了！"
    translated: "We fell into a trap!"
- raw: "BattleDialog/Ch_2_4_9_1_004,是哪个王八蛋走漏了风声？"
  splits:
  - split: 1
    text: "是哪个王八蛋走漏了风声？"
    translated: "Who's the bastard who spilled the beans?"
- raw: "BattleDialog/Ch_2_4_9_1_005,那个姓赵的灰孙子是内奸！宰了他！"
  splits:
  - split: 1
    text: "那个姓赵的灰孙子是内奸！宰了他！"
    translated: "That Zhao surname gray grandson is an internal traitor! Kill him!"
- raw: "BattleDialog/Ch_2_4_9_1_006,风紧，扯乎！"
  splits:
  - split: 1
    text: "风紧，扯乎！"
    translated: "The wind is strong, it's pulling!"
- raw: "BattleDialog/Ch_2_4_9_2_001,犯贱的玩意，敢来唐门撒野！"
  splits:
  - split: 1
    text: "犯贱的玩意，敢来唐门撒野！"
    translated: "Despicable scum, dare to come to the Tang Clan and cause trouble!"
- raw: "BattleDialog/Ch_2_4_9_2_002,把这群贼人给拿下，交给二师兄盘问！"
  splits:
  - split: 1
    text: "把这群贼人给拿下，交给二师兄盘问！"
    translated: "Take down these bandits and hand them over to Second Senior Brother for interrogation!"
- raw: "BattleDialog/Ch_2_4_9_2_003,劝你们即刻自刎，还可以免受我二师兄的摧残！"
  splits:
  - split: 1
    text: "劝你们即刻自刎，还可以免受我二师兄的摧残！"
    translated: "Urge you to commit suicide immediately, you can also avoid the torment of my Second Senior Brother!"
- raw: "BattleDialog/Ch_2_4_9_2_004,泥教的，我是不知你们打什么主意，别碍手碍脚！"
  splits:
  - split: 1
    text: "泥教的，我是不知你们打什么主意，别碍手碍脚！"
    translated: "Mud Cult's, I don't know what your intentions are, don't get in the way!"
- raw: "BattleDialog/Ch_2_4_9_2_005,臭乞丐，你好臭！"
  splits:
  - split: 1
    text: "臭乞丐，你好臭！"
    translated: "Smelly beggar, you're so smelly!"
- raw: "BattleDialog/Ch_2_4_9_3_001,这群唐门的疯了不成？竟跟我们连手！"
  splits:
  - split: 1
    text: "这群唐门的疯了不成？竟跟我们连手！"
    translated: "Are these Tang Clan people crazy? They even teamed up with us!"
- raw: "BattleDialog/Ch_2_4_9_3_002,这群唐门的好像打错人了，暗器尽往六大派的人身上招呼！"
  splits:
  - split: 1
    text: "这群唐门的好像打错人了，暗器尽往六大派的人身上招呼！"
    translated: "This group of Tang Clan members must have targeted the wrong people; their hidden weapons are all aimed at the members of the Six Great Sects!"
- raw: "BattleDialog/Ch_2_4_9_3_003,对，唐门就是我魔教的同胞，大家齐心协力打垮正派！"
  splits:
  - split: 1
    text: "对，唐门就是我魔教的同胞，大家齐心协力打垮正派！"
    translated: "Yes, the Tang Clan is like my fellow sect members in the Demon Sect. Let's unite and overthrow the righteous factions together!"
- raw: "BattleDialog/Ch_2_4_9_3_004,这群正派人士看穿了咱们打算袭击唐门的！"
  splits:
  - split: 1
    text: "这群正派人士看穿了咱们打算袭击唐门的！"
    translated: "These righteous people have figured out our plan to attack the Tang Clan!"
- raw: "BattleDialog/Ch_2_4_9_3_005,哈哈，天太黑了，正派的跟唐门认不清彼此，竟打成一团！"
  splits:
  - split: 1
    text: "哈哈，天太黑了，正派的跟唐门认不清彼此，竟打成一团！"
    translated: "Haha, it's too dark, the righteous and the Tang Clan couldn't tell each other apart, and ended up fighting in a group!"
- raw: "BattleDialog/Ch_2_4_9_3_006,先料理六大派的走狗！"
  splits:
  - split: 1
    text: "先料理六大派的走狗！"
    translated: "First, deal with the Six Major Sects' running dogs!"
- raw: "BattleDialog/Ch_2_4_9_4_001,我们中计了！"
  splits:
  - split: 1
    text: "我们中计了！"
    translated: "We fell into a trap!"
