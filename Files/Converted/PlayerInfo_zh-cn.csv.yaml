- raw: "PlayerInfo/FictionDesc/6,唐门的威望，空前绝后，傲视群豪。\\n俨然已成当朝武林的第一大派，泥教既衰，已不能与抗。\\n能与唐门争雄者，天下唯有武林盟。时代的分水岭就在眼前，你的名字已成为不朽传说。"
  splits:
  - split: 1
    text: "唐门的威望，空前绝后，傲视群豪。"
    translated: "The prestige of the Tang Clan is unmatched, surpassing all others."
    qcReviewedText: "The prestige of the Tang Clan is unmatched, surpassing all others.\\nHaving become the foremost sect in the current court of Wulin, the Mud Cult has declined so much that it can no longer compete.\\nThose who can rival Tang Clan are but one: the Wulin Alliance. The dividing line of the era is before your eyes, and your name has already become an immortal legend."
    qcStatus: Passed
    qcQualityScore: 100
    qcDefectCategory: None
