  - split: 1
    template: "{0}\\n{1}\\n{2}"
- raw: "PlayerInfo/FictionDesc/5,唐门以一介世家，几乎能与大派分庭抗礼。\\n门中能人辈出，声名鹊起者不绝，其中便有你在列。\\n外姓弟子的印记已从世人脑海淡忘，你不再是某某人，而是你自己。\\n你的身后则跟随着许多望着你背影的人。"
  splits:
  - split: 1
    text: "唐门以一介世家，几乎能与大派分庭抗礼。"
    translated: "The Tang Clan, as a prominent family, is nearly on par with the major sects."
    qcReviewedText: "The Tang Clan, as a prominent family, is nearly on par with the major sects.\\nOur sect has produced many talented individuals, and those whose reputations have risen are countless, including you.\\nThe mark of an outsider disciple has faded from people's memories. You are no longer someone else; you are yourself.\\nMany people are looking at your back as they follow behind you."
    qcStatus: Passed
    qcQualityScore: 100
    qcDefectCategory: None
