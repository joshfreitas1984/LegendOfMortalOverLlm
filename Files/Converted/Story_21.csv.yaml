    text: "我派将欲南下之时，忽然撞破西夏阴谋。原来夏贼向金借道，欲和极乐教里应外合谋夺蜀地，瓜分宋土。魏掌门与道法将军当机立断，亲率崆峒弟子与当地官军会合抗击夏兵。"
