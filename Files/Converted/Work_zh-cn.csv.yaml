- raw: "Work/Dialog/Room2,为了不被发现，必须从大白天就伏在女弟子房外悬崖边上守株待兔。\\n等到入了夜，小师妹就会在窗边折纸鹤。\\n我没打算做坏事，我只是想听她的呼吸声！"
