    translated: "Red bean bun"
- raw: "Misc/Desc/5008,揉以甜豆馅中和苦味的药包子，叶云裳咬了一口。"
  splits:
  - split: 1
    text: "揉以甜豆馅中和苦味的药包子，叶云裳咬了一口。"
    translated: "Ye Yunshang took a bite of the medicinal bun filled with sweet bean paste to balance its bitterness."
- raw: "Misc/Name/5009,湘妃鱼糕"
  splits:
  - split: 1
    text: "湘妃鱼糕"
    translated: "Xiangfei Fish Cake"
- raw: "Misc/Desc/5009,相传是女英所创，因为娥皇想吃鱼却怕刺，故以鱼糜混以蛋清、蜂蜜、糯米粉，蒸煮成糕。江陵无羡居的鱼膏尤为名贵，价格不斐。\\n四师兄送你的这一块，是从地上捡到的，沾了灰尘，还发霉。"
  splits:
  - split: 1
    text: "相传是女英所创，因为娥皇想吃鱼却怕刺，故以鱼糜混以蛋清、蜂蜜、糯米粉，蒸煮成糕。江陵无羡居的鱼膏尤为名贵，价格不斐。"
    translated: "It is said that this dish was created by Nu Ying because Empress Ehuang wanted to eat fish but was afraid of the bones. So, they mixed fish paste with egg white, honey, and glutinous rice flour, steaming it into a cake. The fish paste from the Wu brothers' residence in Jingling is especially precious and comes with a high price."
  - split: 1
    subIndex: 1
    text: "四师兄送你的这一块，是从地上捡到的，沾了灰尘，还发霉。"
    translated: "Fourth Senior Brother gave you this one; it was picked up off the ground, covered in dust, and even moldy."
  templates:
  - split: 1
    template: "{0}\\n{1}"
