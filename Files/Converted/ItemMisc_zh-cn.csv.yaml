- raw: "Misc/Name/4102,穿心龙胆汤"
  splits:
  - split: 1
    text: "穿心龙胆汤"
    translated: "Chuanxinlongdan Soup"
- raw: "Misc/Desc/4102,用穿心莲、龙胆等药草熬汁炖煮的汤药，其苦非常人之所能受，药性之重业已成毒，常人服之心悸头疼，唐门弟子服之清热解渴。"
  splits:
  - split: 1
    text: "用穿心莲、龙胆等药草熬汁炖煮的汤药，其苦非常人之所能受，药性之重业已成毒，常人服之心悸头疼，唐门弟子服之清热解渴。"
    translated: "The soup medicine made by simmering herbs like Chuanxinlian and Longdan is extremely bitter, something that most people cannot tolerate. The potency of the medicine has already turned it into poison; ordinary people who consume it experience heart palpitations and headaches, while Tang Clan Disciples take it to clear heat and quench thirst."
