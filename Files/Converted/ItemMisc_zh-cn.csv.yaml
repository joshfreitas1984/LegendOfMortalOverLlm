- raw: "Misc/Name/7003,磨喝乐"
  splits:
  - split: 1
    text: "磨喝乐"
    translated: "Mo he le"
- raw: "Misc/Desc/7003,时下流行的玩具，在京师贵人口里谓之磨喝乐，源自梵文音译。\\n但在你西蜀乡下，就朴实的称作泥孩儿。\\n以土、木为材料做成的玩偶，栩栩如生。"
  splits:
  - split: 1
    text: "时下流行的玩具，在京师贵人口里谓之磨喝乐，源自梵文音译。"
    translated: "The popular toy of the time, known as Mohele in the mouths of the nobility in Jing Shi, is derived from a transliteration of the Sanskrit term."
  - split: 1
    subIndex: 1
    text: "但在你西蜀乡下，就朴实的称作泥孩儿。"
    translated: "In your western Shu countryside, it is simply and plainly called muddy child."
  - split: 1
    subIndex: 2
    text: "以土、木为材料做成的玩偶，栩栩如生。"
    translated: "Dolls made from clay and wood are incredibly lifelike."
