    template: "{0}\\n{1}\\n{2}"
- raw: "Misc/Name/7100,失败木剑"
  splits:
  - split: 1
    text: "失败木剑"
    translated: "Failed Wooden Sword"
- raw: "Misc/Desc/7100,叶云舟应外堡孩童要求所削的木剑，因为不太熟练，所以削得像狗啃，惨不忍睹。"
  splits:
  - split: 1
    text: "叶云舟应外堡孩童要求所削的木剑，因为不太熟练，所以削得像狗啃，惨不忍睹。"
    translated: "The wooden sword that Ye Yunzhao carved at the request of the children from the outer fortress was poorly done, resembling something chewed by a dog, and was a sight to behold."
- raw: "Misc/Name/7101,木剑"
  splits:
  - split: 1
    text: "木剑"
    translated: "Wooden Sword"
- raw: "Misc/Desc/7101,叶云舟应外堡孩童要求所削的木剑，削得多了自然掌握诀窍，因此变得熟练了一点，可以削出笔直的剑形了。"
  splits:
  - split: 1
    text: "叶云舟应外堡孩童要求所削的木剑，削得多了自然掌握诀窍，因此变得熟练了一点，可以削出笔直的剑形了。"
    translated: "At the request of the children from the outer fortress, Ye Yunzhao carved wooden swords. With practice, they naturally grasped the technique and became a bit more skilled, able to carve straight sword shapes."
- raw: "Misc/Name/7102,听云木剑"
  splits:
  - split: 1
    text: "听云木剑"
    translated: "Listening to the Cloudwood Sword"
- raw: "Misc/Desc/7102,叶云舟应外堡孩童要求所削的木剑，最近削出心得来了。\\n不仅学会用工具，还有闲心雕花，做成了听云剑的造型。"
  splits:
  - split: 1
    text: "叶云舟应外堡孩童要求所削的木剑，最近削出心得来了。"
    translated: "Ye Yunzhao has recently gained new insights into the wooden Swords they carved at the request of the children from the outer fortress."
  - split: 1
    subIndex: 1
    text: "不仅学会用工具，还有闲心雕花，做成了听云剑的造型。"
    translated: "Not only did they learn to use tools, but they also took the time to carve flowers, crafting it into the shape of a Listening to the Clouds Sword."
  templates:
