- raw: "Misc/Name/2001,黄酒"
  splits:
  - split: 1
    text: "黄酒"
    translated: "Huangjiu"
- raw: "Misc/Desc/2001,四师兄从山下酒家打来，兑水抬价卖给师兄弟们的廉价酒。\\n喝了心情会变好，但是喝多不太健康。"
  splits:
  - split: 1
    text: "四师兄从山下酒家打来，兑水抬价卖给师兄弟们的廉价酒。"
    translated: "Fourth Senior Brother brought cheap wine from the tavern at the foot of the mountain, watering it down and selling it at inflated prices to their fellow disciples."
  - split: 1
    subIndex: 1
    text: "喝了心情会变好，但是喝多不太健康。"
    translated: "Drinking might improve your mood, but drinking too much isn't very healthy."
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Misc/Name/2002,茅台酒"
  splits:
  - split: 1
    text: "茅台酒"
    translated: "Moutai liquor"
- raw: "Misc/Desc/2002,产自贵州，酱香型大曲白酒，气味芳香浓郁，\\n一瓶能顶两次喝，够劲儿赞。"
  splits:
  - split: 1
    text: "产自贵州，酱香型大曲白酒，气味芳香浓郁，"
    translated: "A fragrant and richly aromatic sauce‑flavored strong spirit produced in Guizhou."
  - split: 1
    subIndex: 1
    text: "一瓶能顶两次喝，够劲儿赞。"
    translated: "This bottle is good for two drinks and packs a punch; well done."
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Misc/Name/2003,烧刀子"
  splits:
  - split: 1
    text: "烧刀子"
    translated: "Burning the blade"
- raw: "Misc/Desc/2003,不调味、酒气浓烈，似火烧，故得此名。\\n是百姓的酒，是天下万民的酒。"
  splits:
  - split: 1
    text: "不调味、酒气浓烈，似火烧，故得此名。"
    translated: "Undiluted, the liquor is strong and fiery, like a burning flame, hence its name."
  - split: 1
    subIndex: 1
    text: "是百姓的酒，是天下万民的酒。"
    translated: "It's the people's wine, the wine of all the common folk across the land."
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Misc/Name/2004,苏合香酒"
  splits:
  - split: 1
    text: "苏合香酒"
    translated: "Su He Xiang Wine"
- raw: "Misc/Desc/2004,相传为宫廷御用的药酒，与苏合香同煮，融其效于酒水中，能安顺五气之气，极为名贵。\\n此酒是四师兄历时数月，冒着被官府追缉的风险与同伙私酿的，只敢卖熟人。"
  splits:
  - split: 1
    text: "相传为宫廷御用的药酒，与苏合香同煮，融其效于酒水中，能安顺五气之气，极为名贵。"
    translated: "This court‑exclusive medicinal wine, when brewed with styrax, infuses its effects into the wine, harmonizing the five types of qi, making it incredibly valuable."
  - split: 1
    subIndex: 1
    text: "此酒是四师兄历时数月，冒着被官府追缉的风险与同伙私酿的，只敢卖熟人。"
    translated: "This wine was privately brewed by Fourth Senior Brother over several months, risking arrest by the authorities. They only dare to sell it to acquaintances."
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Misc/Name/2005,羊羔酒"
  splits:
  - split: 1
    text: "羊羔酒"
    translated: "Lamb's wine"
- raw: "Misc/Desc/2005,起源于汉魏，兴盛于唐宋之间的高级酒。\\n《东京梦华录》有云：色泽白莹，入口绵甘，是以羊羔肉、木香、杏仁等药材入锅煮烂，与黍米同酿而成。能健脾胃、益腰身、大捕元气。"
  splits:
  - split: 1
    text: "起源于汉魏，兴盛于唐宋之间的高级酒。"
    translated: "A high‑grade liquor that originated in the Han and Wei dynasties and flourished during the Tang and Song periods."
  - split: 1
    subIndex: 1
    text: "《东京梦华录》有云"
    translated: "According to the Tokyo Dream Splendor Record"
  - split: 1
    subIndex: 2
    text: "色泽白莹，入口绵甘，是以羊羔肉、木香、杏仁等药材入锅煮烂，与黍米同酿而成。能健脾胃、益腰身、大捕元气。"
    translated: "White and translucent, with a sweet and smooth taste, this dish is made by simmering lamb, agarwood, almonds, and other herbs until tender, then brewing them together with millet. It strengthens the spleen and stomach, benefits the waist and body, and greatly replenishes vital energy."
  templates:
  - split: 1
    template: "{0}\\n{1}：{2}"
