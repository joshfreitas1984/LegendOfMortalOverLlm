- raw: "Misc/Name/5006,中药蜜饯"
  splits:
  - split: 1
    text: "中药蜜饯"
    translated: "Traditional Chinese herbal candied fruits"
- raw: "Misc/Desc/5006,唐芳之姐发明的甜点，以川贝母、枇杷叶、甘草、白芍、蜂蜜、桔梗、三阴虫草胶所腌渍的蜜饯，不仅有清热止血的功效，常用于治疗喉咙痛、咳嗽等症状，而且还很好吃，哄骗小孩的利器，二师兄孩提时候曾因此蛀牙。"
  splits:
  - split: 1
    text: "唐芳之姐发明的甜点，以川贝母、枇杷叶、甘草、白芍、蜂蜜、桔梗、三阴虫草胶所腌渍的蜜饯，不仅有清热止血的功效，常用于治疗喉咙痛、咳嗽等症状，而且还很好吃，哄骗小孩的利器，二师兄孩提时候曾因此蛀牙。"
    translated: "The dessert invented by Tang Fang's sister is a candied treat made with Fritillaria, loquat leaves, licorice, white peony, honey, balloon flower, and Cordyceps sinensis gel. It not only has the effects of clearing heat and stopping bleeding, often used to treat symptoms like sore throat and cough, but it is also very delicious, a perfect tool for deceiving children. Second Senior Brother once got a cavity because of it during their childhood."
