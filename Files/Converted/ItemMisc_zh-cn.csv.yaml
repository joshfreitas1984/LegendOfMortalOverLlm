    text: "方便保存的干粮。"
    translated: "Portable dried rations"
  - split: 1
    subIndex: 1
    text: "有时是炙鸡、有时是鹿脯、獐豝、猪肉。"
    translated: "Sometimes it's grilled chicken, sometimes it's deer meat, roe deer, or pork."
  - split: 1
    subIndex: 2
    text: "吃起来风味不同，滋味也过得去，没赶上饭点的时候可以充饥。"
