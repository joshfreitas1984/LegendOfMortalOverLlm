- raw: "Story/D_8_4_10_1_030,只有喜事才放烟火不是吗？大院想必无事。便是猜错了那又如何？死也要死的轰轰烈烈，就像烟火一样！便是烈日当空，只有一剎也好，我们要比太阳更光！"
