- raw: "Story/D_6_9_2_3_071,总之你们要牢牢记住，不要觉得一个人跟我们无冤无仇，就心慈手软。你要恨他！别讲什么道理，生存就是战争，照样是杀人，没有谁更高尚，用嘴、用刀剑还不是一样？我们没有错！"
