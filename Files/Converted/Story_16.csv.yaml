- raw: "Story/D_6_9_2_3_051,跑了以后，我越想越觉得心痒。他们兄妹那样精致的人儿，又是什么忠良高尚的后裔，却被我轻描淡写几句话给害到不得不脱衣服、赌誓自证清白～"
