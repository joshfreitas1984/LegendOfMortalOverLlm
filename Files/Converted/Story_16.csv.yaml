- raw: "Story/D_6_9_2_3_157,「顷闻叶氏避迹山林，世代严守军令，忠贞不渝，任八十寒暑，星霜荏苒，忠魂未泯。云公有知，亦当如珂，不胜悲喜。」"
  splits:
  - split: 1
    text: "「顷闻叶氏避迹山林，世代严守军令，忠贞不渝，任八十寒暑，星霜荏苒，忠魂未泯。云公有知，亦当如珂，不胜悲喜。」"
    translated: "I have recently heard that the Ye family has retreated to the mountains and forests, generations adhering strictly to military orders, faithful and steadfast without wavering, enduring eighty years of cold and heat. The stars and frost have passed, yet their loyal spirit remains unextinguished. If Master Yun were aware, he would also be like Ke, overwhelmed with sorrow and joy."
- raw: "Story/N_6_9_2_3_005,「幸赖孝宗皇帝圣明，先祖父忠武王沉冤始得昭洗，云公与张统制亦追复原官，史官笔正，此诚天道有知，人理犹存也。」"
  splits:
  - split: 1
    text: "「幸赖孝宗皇帝圣明，先祖父忠武王沉冤始得昭洗，云公与张统制亦追复原官，史官笔正，此诚天道有知，人理犹存也。」"
    translated: "Luckily, under the sage wisdom of Emperor Xiaozong, our ancestor Grand General Zhongwu Wang's wrongful accusation was finally cleared. Cloud Senior and Zhang Commander also had their original ranks restored. The historiographers have set the record straight; truly, this is evidence that heavenly path knows right from wrong, and human justice still exists."
- raw: "Story/N_6_9_2_3_006,「方今圣上英明，在外亦得良将戍守边疆，大宋国泰民安，尔辈无须忧虑。」"
  splits:
  - split: 1
    text: "「方今圣上英明，在外亦得良将戍守边疆，大宋国泰民安，尔辈无须忧虑。」"
    translated: "The current emperor is wise, and capable generals are stationed at the borders. The Great Song Dynasty enjoys national peace and prosperity; you need not worry."
- raw: "Story/N_6_9_2_3_007,「叶氏之节可告泉壤，至此功德圆满，当解甲归田，释怀矣。山中岁久，幸能保全，此心此志，天下共仰。披阅此书，尚祈珍重。岳珂谨启」"
  splits:
  - split: 1
    text: "「叶氏之节可告泉壤，至此功德圆满，当解甲归田，释怀矣。山中岁久，幸能保全，此心此志，天下共仰。披阅此书，尚祈珍重。岳珂谨启」"
    translated: "The virtue of the Ye family can be recounted to the afterlife; by now, their meritorious deeds are complete, and they should retire from military service and return to the fields, letting go of their worries. Having remained in the mountains for a long time, they have fortunately been preserved; this heart and this resolve are admired by all under heaven. When reading this book, please take care. Yue Ke respectfully submits."
