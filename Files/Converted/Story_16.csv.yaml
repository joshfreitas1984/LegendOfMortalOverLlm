- raw: "Story/D_6_9_2_3_050,我顺势就造了个小小谣言，说我偷窥了那叶小妹子洗身，窥见她身上有宝藏藏宝图，转移焦点，那些大人登时都坐不住了，都急着要拿人问个明白，没人留心我，我便顺势跑了。"
  splits:
