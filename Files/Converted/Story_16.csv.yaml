- raw: "Story/D_6_9_2_3_061,想我当年在临安，贬低抹黑魏才女，搞得她人没入仕就先得罪同僚，堂堂女状元，被逼下嫁粗鄙武官，最后全家死个精光。这份功绩，也不亚于你吧？"
