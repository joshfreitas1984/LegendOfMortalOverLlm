- raw: "Story/D_Travel_601_902_03_030,邹掌门，叶某虽非亲身经历，但信我兄弟为人。愿以苍松剑客的名声作赌，保证他所言非虚，还请邹真人明察秋毫，勿受奸人蒙蔽。"
