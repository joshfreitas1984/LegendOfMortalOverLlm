- raw: "Story/D_6_5_3_015,将士攘外，侠士安内，都是为国为民，同是一国之臣，不该生份戒慎。今官家孝友慈仁，温文睿哲，不议先帝施政，以配祖考。然则对于朝野离心，亦是痛心疾首。"
  splits:
  - split: 1
    text: "将士攘外，侠士安内，都是为国为民，同是一国之臣，不该生份戒慎。今官家孝友慈仁，温文睿哲，不议先帝施政，以配祖考。然则对于朝野离心，亦是痛心疾首。"
- raw: "Story/D_6_5_3_016,而今风雨山外风雨飘摇，外有金贼虎视眈眈，内有魔教居心叵测，江湖之危，等若中原之危，是大宋之危，更是江山社稷之危。我辈侠士，安忍坐视黎民百姓身陷水火？"
  splits:
  - split: 1
    text: "而今风雨山外风雨飘摇，外有金贼虎视眈眈，内有魔教居心叵测，江湖之危，等若中原之危，是大宋之危，更是江山社稷之危。我辈侠士，安忍坐视黎民百姓身陷水火？"
