    text: "有一天朝廷招兵买马，兄弟俩决定分开，投效不同的主公，各自闯荡。为了来日相认，他们捡了一颗漂亮石头，雕刻成老虎形状，又分成两半，当作虎符。你们知道什么是虎符吗？"
