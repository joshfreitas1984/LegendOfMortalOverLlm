- raw: "Story/D_S2914_03_072,剑在人在，剑亡人亡，谁折了手里兵刃，不免当场身亡。胜者独得一切，败者连命也保不住，只配成为剑底亡魂。若是怕了，就得自毁兵器，或者交出宝剑苟全性命。"
