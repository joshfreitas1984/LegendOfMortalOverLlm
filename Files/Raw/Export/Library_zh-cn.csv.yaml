- raw: "Library/Title/20023,赶海人"
  splits:
  - split: 1
    text: "赶海人"
- raw: "Library/Desc/20023,你一相情愿认为她被溪水冲走了，循着岷江穿流一路向东，直到海边，可是那里也没有她的身影。你每日都看着海，日渐苍老，悔不当初。"
  splits:
  - split: 1
    text: "你一相情愿认为她被溪水冲走了，循着岷江穿流一路向东，直到海边，可是那里也没有她的身影。你每日都看着海，日渐苍老，悔不当初。"
- raw: "Library/Title/20024,退隐江湖"
  splits:
  - split: 1
    text: "退隐江湖"
- raw: "Library/Desc/20024,你退隐之后，江湖故事再也不闻不问。\\n波澜都在头先廿载，余生不受盛名所牵。你来过，你走了，也许没人在意，可是你自己晓得。"
  splits:
  - split: 1
    text: "你退隐之后，江湖故事再也不闻不问。"
  - split: 1
    subIndex: 1
    text: "波澜都在头先廿载，余生不受盛名所牵。你来过，你走了，也许没人在意，可是你自己晓得。"
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Library/Title/20025,山中老人"
  splits:
  - split: 1
    text: "山中老人"
- raw: "Library/Desc/20025,你老年被称为山中老人，是天下暗杀者的老祖宗。\\n千面人魔的传说还在延续，恐惧笼罩这片大地。"
  splits:
  - split: 1
    text: "你老年被称为山中老人，是天下暗杀者的老祖宗。"
  - split: 1
    subIndex: 1
    text: "千面人魔的传说还在延续，恐惧笼罩这片大地。"
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Library/Title/20026,世外桃源"
  splits:
  - split: 1
    text: "世外桃源"
- raw: "Library/Desc/20026,往昔恩怨随风散，岁月悠悠不染尘，你俩的余生既慢且好。"
  splits:
  - split: 1
    text: "往昔恩怨随风散，岁月悠悠不染尘，你俩的余生既慢且好。"
- raw: "Library/Title/20027,血河刀"
  splits:
  - split: 1
    text: "血河刀"
- raw: "Library/Desc/20027,江湖人利欲熏心，无人猜得到你不怀好意。\\n你用这把刀给唐门报了仇，未斩一人，刀下已伏尸千万，血流成河。"
  splits:
  - split: 1
    text: "江湖人利欲熏心，无人猜得到你不怀好意。"
  - split: 1
    subIndex: 1
    text: "你用这把刀给唐门报了仇，未斩一人，刀下已伏尸千万，血流成河。"
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Library/Title/20028,再世庞统"
  splits:
  - split: 1
    text: "再世庞统"
- raw: "Library/Desc/20028,深谋远虑是假，只有其貌不扬是真的。\\n拜你所赐，唐门的冤屈得以平反，虽然大家各散东西，却都扬眉吐气。"
  splits:
  - split: 1
    text: "深谋远虑是假，只有其貌不扬是真的。"
  - split: 1
    subIndex: 1
    text: "拜你所赐，唐门的冤屈得以平反，虽然大家各散东西，却都扬眉吐气。"
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Library/Title/20029,山林隐逸"
  splits:
  - split: 1
    text: "山林隐逸"
- raw: "Library/Desc/20029,你俩是隐居的雅士，反正这个时代配不上你们，不妨孤芳自赏、独善其身，晴时耕牧雨读书，夏赏荷花冬赏雪，不也畅怀？"
  splits:
  - split: 1
    text: "你俩是隐居的雅士，反正这个时代配不上你们，不妨孤芳自赏、独善其身，晴时耕牧雨读书，夏赏荷花冬赏雪，不也畅怀？"
- raw: "Library/Title/20030,传说之人"
  splits:
  - split: 1
    text: "传说之人"
- raw: "Library/Desc/20030,世人众说纷纭，都想知道那位头戴人皮面具的前辈高人是何方神圣，然而，你那天根本没戴面具。"
  splits:
  - split: 1
    text: "世人众说纷纭，都想知道那位头戴人皮面具的前辈高人是何方神圣，然而，你那天根本没戴面具。"
- raw: "Library/Title/20031,殉志而死"
  splits:
  - split: 1
    text: "殉志而死"
- raw: "Library/Desc/20031,这一路太长太远，本来就强人所难，你已经足够努力了。"
  splits:
  - split: 1
    text: "这一路太长太远，本来就强人所难，你已经足够努力了。"
- raw: "Library/Title/20032,全军覆没"
  splits:
  - split: 1
    text: "全军覆没"
- raw: "Library/Desc/20032,是日，唐门叛逆全歼于眉山，无一幸还。大院外堡付之一炬，功过皆化乌有。你们活过，只是谁也不记得了。"
  splits:
  - split: 1
    text: "是日，唐门叛逆全歼于眉山，无一幸还。大院外堡付之一炬，功过皆化乌有。你们活过，只是谁也不记得了。"
- raw: "Library/Title/20033,行尸走肉"
  splits:
  - split: 1
    text: "行尸走肉"
- raw: "Library/Desc/20033,你活着，却已死了很久。\\n夏侯兰后悔那日不该绑着你，让你多受几十年煎熬。"
  splits:
  - split: 1
    text: "你活着，却已死了很久。"
  - split: 1
    subIndex: 1
    text: "夏侯兰后悔那日不该绑着你，让你多受几十年煎熬。"
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Library/Title/20034,慷慨就义"
  splits:
  - split: 1
    text: "慷慨就义"
- raw: "Library/Desc/20034,你有路可活，可你非要做那唐门弟子，笑看生杀，慷慨赴义。"
  splits:
  - split: 1
    text: "你有路可活，可你非要做那唐门弟子，笑看生杀，慷慨赴义。"
- raw: "Library/Title/20035,唐门的暗器"
  splits:
  - split: 1
    text: "唐门的暗器"
- raw: "Library/Desc/20035,人死如灯灭，你们燃尽了生命之火，还以颜色。\\n几十年后，世人依然记得唐门绝响。"
  splits:
  - split: 1
    text: "人死如灯灭，你们燃尽了生命之火，还以颜色。"
  - split: 1
    subIndex: 1
    text: "几十年后，世人依然记得唐门绝响。"
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Library/Title/20036,唐门薪火"
  splits:
  - split: 1
    text: "唐门薪火"
- raw: "Library/Desc/20036,世上再无唐门，可是薪火不曾断绝。有你和小师妹，以及你们未来的家人。\\n唐门最初是一家人，最后仍是一家人。唐家香火，还将继续传承。"
  splits:
  - split: 1
    text: "世上再无唐门，可是薪火不曾断绝。有你和小师妹，以及你们未来的家人。"
  - split: 1
    subIndex: 1
    text: "唐门最初是一家人，最后仍是一家人。唐家香火，还将继续传承。"
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Library/Title/20037,神州旅人"
  splits:
  - split: 1
    text: "神州旅人"
- raw: "Library/Desc/20037,你们的旅行，从出发那一日就没停过，走到哪儿玩到哪，她出钱，你卖命，拜访过旧友，又不吝情去留，绕遍神州大地，足迹止于昆仑山。"
  splits:
  - split: 1
    text: "你们的旅行，从出发那一日就没停过，走到哪儿玩到哪，她出钱，你卖命，拜访过旧友，又不吝情去留，绕遍神州大地，足迹止于昆仑山。"
- raw: "Library/Title/20038,富甲一方"
  splits:
  - split: 1
    text: "富甲一方"
- raw: "Library/Desc/20038,托上官萤故，赵家成为富甲一方的大户人家。\\n上官萤渐渐把生意交给你，自己执掌中馈。\\n身为贤妻良母，她从来不打小孩，倘若小孩犯了错，就打你。"
  splits:
  - split: 1
    text: "托上官萤故，赵家成为富甲一方的大户人家。"
  - split: 1
    subIndex: 1
    text: "上官萤渐渐把生意交给你，自己执掌中馈。"
  - split: 1
    subIndex: 2
    text: "身为贤妻良母，她从来不打小孩，倘若小孩犯了错，就打你。"
  templates:
  - split: 1
    template: "{0}\\n{1}\\n{2}"
- raw: "Library/Title/20039,小梅私藏"
  splits:
  - split: 1
    text: "小梅私藏"
- raw: "Library/Desc/20039,小梅平时贤慧温柔，只是一受刺激就会犯病将你放倒蹂躏。她曾持刀把方圆百里所有女子都恐吓过一遍，警告她们不许靠近你。"
  splits:
  - split: 1
    text: "小梅平时贤慧温柔，只是一受刺激就会犯病将你放倒蹂躏。她曾持刀把方圆百里所有女子都恐吓过一遍，警告她们不许靠近你。"
- raw: "Library/Title/20040,千古名匠"
  splits:
  - split: 1
    text: "千古名匠"
- raw: "Library/Desc/20040,你和小竹造出了精妙绝伦的机关人，藏于池水之下，因为机关构造过于复杂，不得不造得大些，分为人、狮、鹰，可以合体。\\n如此成就，足以青史留名，但你们唯恐机关人遭到恶用，最终还是决定毁去。"
  splits:
  - split: 1
    text: "你和小竹造出了精妙绝伦的机关人，藏于池水之下，因为机关构造过于复杂，不得不造得大些，分为人、狮、鹰，可以合体。"
  - split: 1
    subIndex: 1
    text: "如此成就，足以青史留名，但你们唯恐机关人遭到恶用，最终还是决定毁去。"
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Library/Title/20041,隐世大儒"
  splits:
  - split: 1
    text: "隐世大儒"
- raw: "Library/Desc/20041,你夫妻有风骨而不骄衿。\\n文士雅士、贩夫走卒都无任欢迎。\\n谈笑有鸿儒，往来亦不拒白丁，士农工商皆可为友，平等尊敬认真生活的每个人。"
  splits:
  - split: 1
    text: "你夫妻有风骨而不骄衿。"
  - split: 1
    subIndex: 1
    text: "文士雅士、贩夫走卒都无任欢迎。"
  - split: 1
    subIndex: 2
    text: "谈笑有鸿儒，往来亦不拒白丁，士农工商皆可为友，平等尊敬认真生活的每个人。"
  templates:
  - split: 1
    template: "{0}\\n{1}\\n{2}"
- raw: "Library/Title/20042,失宠"
  splits:
  - split: 1
    text: "失宠"
- raw: "Library/Desc/20042,有了孩子以后，夏侯兰冰冷的心终于化了，而你也失宠了。\\n她专心相夫教子，经常庆幸孩子像她不像你，也不许你打骂小孩，极端宠腻。\\n为了孩子能有良好的教育，某天出门活捉了魏菊回家担任夫子。"
  splits:
  - split: 1
    text: "有了孩子以后，夏侯兰冰冷的心终于化了，而你也失宠了。"
  - split: 1
    subIndex: 1
    text: "她专心相夫教子，经常庆幸孩子像她不像你，也不许你打骂小孩，极端宠腻。"
  - split: 1
    subIndex: 2
    text: "为了孩子能有良好的教育，某天出门活捉了魏菊回家担任夫子。"
  templates:
  - split: 1
    template: "{0}\\n{1}\\n{2}"
- raw: "Library/Title/20043,鸡腿大亨"
  splits:
  - split: 1
    text: "鸡腿大亨"
- raw: "Library/Desc/20043,龙渊悄悄来看过你们，一度气得眼冒金星，想想自己也没啥出息，索性就由着你们。\\n反正轰轰烈烈的活、平平安安的过，同样是一生。你的岳丈对你要求不多，不用你管天下苍生，只要保护自己家人，只做她的英雄足矣。"
  splits:
  - split: 1
    text: "龙渊悄悄来看过你们，一度气得眼冒金星，想想自己也没啥出息，索性就由着你们。"
  - split: 1
    subIndex: 1
    text: "反正轰轰烈烈的活、平平安安的过，同样是一生。你的岳丈对你要求不多，不用你管天下苍生，只要保护自己家人，只做她的英雄足矣。"
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Library/Title/20044,最后的唐门弟子"
  splits:
  - split: 1
    text: "最后的唐门弟子"
- raw: "Library/Desc/20044,你打算尽可能活久一点，要是连你都没了，世上就再也没人记得唐门了。"
  splits:
  - split: 1
    text: "你打算尽可能活久一点，要是连你都没了，世上就再也没人记得唐门了。"
- raw: "Library/Title/20045,相声二人组"
  splits:
  - split: 1
    text: "相声二人组"
- raw: "Library/Desc/20045,你们有时甚至不必准备剧本，随口说话就能引人发笑，你长得越奇怪反而越受欢迎，这才知道原来相声是你的天职。在这领域，你比大师兄还受欢迎，拥有他嫉妒不来的才能。"
  splits:
  - split: 1
    text: "你们有时甚至不必准备剧本，随口说话就能引人发笑，你长得越奇怪反而越受欢迎，这才知道原来相声是你的天职。在这领域，你比大师兄还受欢迎，拥有他嫉妒不来的才能。"
- raw: "Library/Title/20046,君所愿兮江湖行"
  splits:
  - split: 1
    text: "君所愿兮江湖行"
- raw: "Library/Desc/20046,终于轮你当主角，你的谢幕可歌可泣，世上无人再敢看轻你。"
  splits:
  - split: 1
    text: "终于轮你当主角，你的谢幕可歌可泣，世上无人再敢看轻你。"
- raw: "Library/Title/20047,武林传奇"
  splits:
  - split: 1
    text: "武林传奇"
- raw: "Library/Desc/20047,耕阳读书斋将你的事迹编撰成书，发行于市。\\n唐门活侠的大名一朝传遍中原，无人不知、无人不晓。\\n你的名字，从今往后便是传说，受万人崇敬。"
  splits:
  - split: 1
    text: "耕阳读书斋将你的事迹编撰成书，发行于市。"
  - split: 1
    subIndex: 1
    text: "唐门活侠的大名一朝传遍中原，无人不知、无人不晓。"
  - split: 1
    subIndex: 2
    text: "你的名字，从今往后便是传说，受万人崇敬。"
  templates:
  - split: 1
    template: "{0}\\n{1}\\n{2}"
- raw: "Library/Title/20048,丧家之犬"
  splits:
  - split: 1
    text: "丧家之犬"
- raw: "Library/Desc/20048,你有一间房子可以遮风挡雨，但已没有故乡能够回去。"
  splits:
  - split: 1
    text: "你有一间房子可以遮风挡雨，但已没有故乡能够回去。"
- raw: "Library/Title/20049,峨嵋弟子"
  splits:
  - split: 1
    text: "峨嵋弟子"
- raw: "Library/Desc/20049,你成为峨嵋弟子，享受和旁人一样的待遇与义务。\\n以武林一员的身份参与了几件武林大事，无功无过，老了退隐。"
  splits:
  - split: 1
    text: "你成为峨嵋弟子，享受和旁人一样的待遇与义务。"
  - split: 1
    subIndex: 1
    text: "以武林一员的身份参与了几件武林大事，无功无过，老了退隐。"
  templates:
  - split: 1
    template: "{0}\\n{1}"
- raw: "Library/Title/20050,窝囊死"
  splits:
  - split: 1
    text: "窝囊死"
- raw: "Library/Desc/20050,被这无情世道以乱拳加身，你的心比身体还要短寿，老早就死了。"
  splits:
  - split: 1
    text: "被这无情世道以乱拳加身，你的心比身体还要短寿，老早就死了。"
- raw: "Library/Title/20051,苟且偷生"
  splits:
  - split: 1
    text: "苟且偷生"
- raw: "Library/Desc/20051,你的骨气打从骨头断掉的那一刻，就烟消云散了。"
  splits:
  - split: 1
    text: "你的骨气打从骨头断掉的那一刻，就烟消云散了。"
- raw: "Library/Title/20052,划地为牢"
  splits:
  - split: 1
    text: "划地为牢"
- raw: "Library/Desc/20052,谁也没留你，你却不舍走远。终你一生，困守于她坟前，流泪忏悔，可她怎会答应？"
  splits:
  - split: 1
    text: "谁也没留你，你却不舍走远。终你一生，困守于她坟前，流泪忏悔，可她怎会答应？"
- raw: "Library/Title/20053,与妳同行"
  splits:
  - split: 1
    text: "与妳同行"
- raw: "Library/Desc/20053,无论几度轮回，都愿为她跋涉冥河，穿越地狱。"
  splits:
  - split: 1
    text: "无论几度轮回，都愿为她跋涉冥河，穿越地狱。"
- raw: "Library/Title/30000,命中有数"
  splits:
  - split: 1
    text: "命中有数"
- raw: "Library/Desc/30000,尽管未必如意，能够坦然走到这里，也很了不起。"
  splits:
  - split: 1
    text: "尽管未必如意，能够坦然走到这里，也很了不起。"
