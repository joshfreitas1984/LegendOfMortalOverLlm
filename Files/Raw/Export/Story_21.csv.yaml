- raw: "Story/D_8_1_1_1_413,我军多次经官驿、飞雁传书求援，然而战报十有八九石沉大海。可见极乐教在宋为策应，为侵宋做足了准备，恐怕临安官家得到音讯，已是数月以后，蜀地早已陷落。"
  splits:
  - split: 1
    text: "我军多次经官驿、飞雁传书求援，然而战报十有八九石沉大海。可见极乐教在宋为策应，为侵宋做足了准备，恐怕临安官家得到音讯，已是数月以后，蜀地早已陷落。"
