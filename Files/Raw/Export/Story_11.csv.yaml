- raw: "Story/D_7_5_5_3_043,早有耳闻向掌门性情恬淡，身着宽袍大袖，有古之遗直，似画里仙人。如今一见，果然名不虚传。山中暮鼓晨钟，日复一日，浑无江湖人的戾气、狠劲。"
  splits:
