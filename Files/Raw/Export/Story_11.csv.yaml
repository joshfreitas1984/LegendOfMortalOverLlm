    text: "早有耳闻向掌门性情恬淡，身着宽袍大袖，有古之遗直，似画里仙人。如今一见，果然名不虚传。山中暮鼓晨钟，日复一日，浑无江湖人的戾气、狠劲。"
- raw: "Story/D_7_5_5_3_044,我在峨嵋山作客几日，亦随主便，朝夕受佛法熏陶。我一生苦读圣贤书，是治国齐家修身的道理。"
