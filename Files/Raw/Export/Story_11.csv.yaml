  - split: 1
    text: "原来邹掌门亦深感江湖水寒。南宫大侠亡故以后，更是心灰意冷，已不愿再掺和武林纠纷。"
- raw: "Story/D_7_5_5_4_019,邹掌门言道，江湖腥风扑鼻，弥漫暴戾之气，有害修道人平和心境。既不愿响应西武林盟号召，却也无心与唐门拼斗。"
  splits:
  - split: 1
    text: "邹掌门言道，江湖腥风扑鼻，弥漫暴戾之气，有害修道人平和心境。既不愿响应西武林盟号召，却也无心与唐门拼斗。"
- raw: "Story/D_7_5_5_4_020,我和邹掌门密谈的时候，武林盟派来的使者也捎来盟主檄文。邹掌门当着我的面，就婉拒了来使要求。"
