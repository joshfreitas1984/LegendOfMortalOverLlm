  splits:
  - split: 1
    text: "向掌门，执意与唐门为难吗。"
- raw: "Story/D_7_5_5_3_1_003,是。那释明恶僧早我们一步，已向峨嵋掌门灌了迷魂汤洗脑，他是南嵩山老住持，云游时不止一次到峨嵋开坛说法，在峨嵋人望绝佳。便是向掌门，也佩服他的佛法修为，但有所言无不信。"
  splits:
  - split: 1
    text: "是。那释明恶僧早我们一步，已向峨嵋掌门灌了迷魂汤洗脑，他是南嵩山老住持，云游时不止一次到峨嵋开坛说法，在峨嵋人望绝佳。便是向掌门，也佩服他的佛法修为，但有所言无不信。"
- raw: "Story/D_7_5_5_3_1_004,我追随业师时也曾侍奉释明，虽无师徒之名，却有师徒之情。平心而论，他不针对唐门时，言行举止截然不同，确有高僧风范。"
  splits:
  - split: 1
    text: "我追随业师时也曾侍奉释明，虽无师徒之名，却有师徒之情。平心而论，他不针对唐门时，言行举止截然不同，确有高僧风范。"
- raw: "Story/D_7_5_5_3_1_005,我受益匪浅，却又背弃于他，改投唐门。向掌门清高不能容，故而将我拒之于山门之外，任我想方设法，也无缘见到一面。"
  splits:
  - split: 1
    text: "我受益匪浅，却又背弃于他，改投唐门。向掌门清高不能容，故而将我拒之于山门之外，任我想方设法，也无缘见到一面。"
- raw: "Story/D_7_5_5_3_1_006,若非此际寸阴必争，我不妨在山门打坐跟他们耗下，但转念又想若不知变通误了良机，恐成师门罪人，于是赶回唐门报讯，并向掌门负荆请罪。"
  splits:
  - split: 1
    text: "若非此际寸阴必争，我不妨在山门打坐跟他们耗下，但转念又想若不知变通误了良机，恐成师门罪人，于是赶回唐门报讯，并向掌门负荆请罪。"
- raw: "Story/D_7_5_5_3_1_007,这事我是办不成了，对不住大家。还请掌门另择人选，还有机会说服向掌门。"
  splits:
  - split: 1
    text: "这事我是办不成了，对不住大家。还请掌门另择人选，还有机会说服向掌门。"
- raw: "Story/D_7_5_5_3_1_008,唉……此事不能全怪你。那释明旧年被掌门所骇，终生都被心魔所困，才生了恶念。这何尝不是本门该尝的业果。"
  splits:
