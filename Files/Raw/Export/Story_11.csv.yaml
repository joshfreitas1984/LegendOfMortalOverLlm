- raw: "Story/D_7_5_5_2_1_003,本来谈得好好的，想说丐帮说不动，好歹说服大义分舵的人也好。结果他们新任舵主突然反目，召来了大仁分舵的人马包围。说是拿到了大义分舵叛帮的证据，要肃清叛徒。"
  splits:
  - split: 1
    text: "本来谈得好好的，想说丐帮说不动，好歹说服大义分舵的人也好。结果他们新任舵主突然反目，召来了大仁分舵的人马包围。说是拿到了大义分舵叛帮的证据，要肃清叛徒。"
- raw: "Story/D_7_5_5_2_1_004,那大仁分舵的压根不讲道义，还未进庙来就先一把石灰粉乱撒。抡起棍棒便是一阵乱打，大义分舵的弟兄们拚了性命才护我脱逃。"
  splits:
  - split: 1
    text: "那大仁分舵的压根不讲道义，还未进庙来就先一把石灰粉乱撒。抡起棍棒便是一阵乱打，大义分舵的弟兄们拚了性命才护我脱逃。"
- raw: "Story/D_7_5_5_2_1_005,我眼看远水救不了近火，就立刻跑去报官。谎称我看见有坏乞丐不知打哪劫来一笔钱财，正在庙里瓜分。你也知道，官府嘛，惩奸除恶未必来劲，讲到钱才会较真。"
  splits:
  - split: 1
    text: "我眼看远水救不了近火，就立刻跑去报官。谎称我看见有坏乞丐不知打哪劫来一笔钱财，正在庙里瓜分。你也知道，官府嘛，惩奸除恶未必来劲，讲到钱才会较真。"
- raw: "Story/D_7_5_5_2_1_006,等我们赶到，大义分舵的弟兄已经死伤惨重。那群恶丐手里拿棍棒，打人跟打狗一样，竹棍不是戳眼就是打喉结，端的是狠辣无比，半点没人性的。"
  splits:
  - split: 1
    text: "等我们赶到，大义分舵的弟兄已经死伤惨重。那群恶丐手里拿棍棒，打人跟打狗一样，竹棍不是戳眼就是打喉结，端的是狠辣无比，半点没人性的。"
- raw: "Story/D_7_5_5_2_1_007,为了救大义分舵的人，我一通胡说，忍痛把一袋钱趁乱扔地上栽赃。才让官府的人相信确有其事，把钱缴下了，人带回去盘问，不让他们以江湖斗殴为由袖手，大义分舵的人才幸免于难。"
