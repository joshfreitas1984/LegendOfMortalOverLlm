- raw: "Story/D_7_5_5_4_021,自称风雨山一役与地狱道法王对掌负伤，力不从心，即将闭关养伤。不能亲率门人参战，唯恐有负武林盟主期望。话虽如此，亦不禁青城弟子下山，凭自身所见所闻决事。"
  splits:
  - split: 1
    text: "自称风雨山一役与地狱道法王对掌负伤，力不从心，即将闭关养伤。不能亲率门人参战，唯恐有负武林盟主期望。话虽如此，亦不禁青城弟子下山，凭自身所见所闻决事。"
