- raw: "Story/D_S0702_01_03_Break_01_040,龙大侠能够成为武林传奇，凭的不单是武功，非有天时地利人和不可。当年若没有南宫大侠与他竞争，龙大侠一个人是怎么也当不上盟主的，是砥砺出的星火才使他发光发热。"
  splits:
  - split: 1
    text: "龙大侠能够成为武林传奇，凭的不单是武功，非有天时地利人和不可。当年若没有南宫大侠与他竞争，龙大侠一个人是怎么也当不上盟主的，是砥砺出的星火才使他发光发热。"
