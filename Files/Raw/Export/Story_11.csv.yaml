    text: "唉……此事不能全怪你。那释明旧年被掌门所骇，终生都被心魔所困，才生了恶念。这何尝不是本门该尝的业果。"
- raw: "Story/D_7_5_5_3_1_009,你一路辛苦了，回来报讯的决策也不算错。下去洗漱休息吧，剩下的我自理会。"
