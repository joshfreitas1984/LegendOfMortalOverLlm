- raw: "Story/D_7_5_5_3_045,《礼记・大学》有云：物有本末，事有终始，知所先后，则近道矣。古之欲明明德于天下者，先治其国；欲治其国者，先齐其家；欲齐其家者，先修其身；欲修其身者，先正其心……"
  splits:
