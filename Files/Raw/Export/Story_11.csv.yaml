- raw: "Story/D_7_5_3_1_002,如诸位所知悉，本门秉持侠义，除非中原浩劫，否则从不结党。所习毒药、暗器，亦常为正道中人所不齿，诟病者在所多有。我们行得正、坐得直，却非世人所云「武林正派」。"
  splits:
  - split: 1
    text: "如诸位所知悉，本门秉持侠义，除非中原浩劫，否则从不结党。所习毒药、暗器，亦常为正道中人所不齿，诟病者在所多有。我们行得正、坐得直，却非世人所云「武林正派」。"
