- raw: "_Misc/Name/4101,养命丹"
  splits:
  - split: 1
    text: "养命丹"
- raw: "_Misc/Desc/4101,李大夫祖传密方，\\n无病可延年益寿，即令是弥留之人，\\n服之亦能吊住一口气，此丹虽然灵验，\\n却须花费数十载方得炼成，\\n你以药典改良，虽得速成，\\n效果却大打折扣。"
  splits:
  - split: 1
    text: "李大夫祖传密方，"
  - split: 1
    subIndex: 1
    text: "无病可延年益寿，即令是弥留之人，"
  - split: 1
    subIndex: 2
    text: "服之亦能吊住一口气，此丹虽然灵验，"
  - split: 1
    subIndex: 3
    text: "却须花费数十载方得炼成，"
  - split: 1
    subIndex: 4
    text: "你以药典改良，虽得速成，"
  - split: 1
    subIndex: 5
    text: "效果却大打折扣。"
  templates:
