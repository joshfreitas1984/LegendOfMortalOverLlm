    template: "{0}\\n{1}\\n{2}"
- raw: "Misc/Name/4500,降真香"
  splits:
  - split: 1
    text: "降真香"
- raw: "Misc/Desc/4500,又名紫檀香，道士开坛请神、作醮、科仪皆用此香。\\n青城降真香配方乃当代掌门邹博独门研制，焚之有调养性情，增益修行的效果。"
  splits:
  - split: 1
    text: "又名紫檀香，道士开坛请神、作醮、科仪皆用此香。"
