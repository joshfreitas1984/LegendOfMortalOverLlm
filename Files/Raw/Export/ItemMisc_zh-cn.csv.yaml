  splits:
  - split: 1
    text: "南蝥礜石散"
- raw: "Misc/Desc/4101,用毒虫、毒砂以醋淬煅七次制成的药散，味辛热，有蒜臭。\\n常人服之五内俱焚，唐门弟子服之可以活血祛湿寒。"
  splits:
  - split: 1
    text: "用毒虫、毒砂以醋淬煅七次制成的药散，味辛热，有蒜臭。"
