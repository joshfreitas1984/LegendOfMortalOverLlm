    text: "峨嵋雪芽"
- raw: "Misc/Desc/3003,盛产于峨嵋山云深雾缠处的四川名茶。\\n香气清新馥郁，茶汤明亮淡雅，又名「雪香」、「清明香」。\\n这茶买来，是你闲来自饮的。"
