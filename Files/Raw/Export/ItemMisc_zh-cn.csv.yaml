    text: "可以让人变得听话的药水，喝了以后性情会变得温驯。"
- raw: "Misc/Name/4105,睡丹"
  splits:
  - split: 1
    text: "睡丹"
- raw: "Misc/Desc/4105,希夷老祖高卧华山，一睡不起，于睡中得道。\\n采精神以为药，取静定以为火，心息相依，反璞归真。"
  splits:
