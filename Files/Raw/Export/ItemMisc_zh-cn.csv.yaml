    text: "纳溪梅岭"
- raw: "Misc/Desc/3001,产于四川泸县的名茶。\\n总是在地最早采摘摘的茶业，每年除夕前煮上，作为年夜茶。\\n这茶买来，是你闲来自饮的。"
