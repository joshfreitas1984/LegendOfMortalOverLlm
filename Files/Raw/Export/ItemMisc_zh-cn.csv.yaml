    text: "肉干"
- raw: "Misc/Desc/5004,方便保存的干粮。\\n有时是炙鸡、有时是鹿脯、獐豝、猪肉。\\n吃起来风味不同，滋味也过得去，没赶上饭点的时候可以充饥。"
