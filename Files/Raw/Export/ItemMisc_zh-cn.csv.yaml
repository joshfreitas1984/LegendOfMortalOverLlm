    template: "{0}\\n{1}"
- raw: "Misc/Name/2004,苏合香酒"
  splits:
  - split: 1
    text: "苏合香酒"
- raw: "Misc/Desc/2004,相传为宫廷御用的药酒，与苏合香同煮，融其效于酒水中，能安顺五气之气，极为名贵。\\n此酒是四师兄历时数月，冒着被官府追缉的风险与同伙私酿的，只敢卖熟人。"
  splits:
  - split: 1
    text: "相传为宫廷御用的药酒，与苏合香同煮，融其效于酒水中，能安顺五气之气，极为名贵。"
  - split: 1
    subIndex: 1
    text: "此酒是四师兄历时数月，冒着被官府追缉的风险与同伙私酿的，只敢卖熟人。"
