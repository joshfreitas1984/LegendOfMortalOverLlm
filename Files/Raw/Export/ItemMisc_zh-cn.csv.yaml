- raw: "Misc/Name/2005,羊羔酒"
  splits:
  - split: 1
    text: "羊羔酒"
- raw: "Misc/Desc/2005,起源于汉魏，兴盛于唐宋之间的高级酒。\\n《东京梦华录》有云：色泽白莹，入口绵甘，是以羊羔肉、木香、杏仁等药材入锅煮烂，与黍米同酿而成。能健脾胃、益腰身、大捕元气。"
  splits:
  - split: 1
    text: "起源于汉魏，兴盛于唐宋之间的高级酒。"
  - split: 1
    subIndex: 1
    text: "《东京梦华录》有云"
  - split: 1
    subIndex: 2
    text: "色泽白莹，入口绵甘，是以羊羔肉、木香、杏仁等药材入锅煮烂，与黍米同酿而成。能健脾胃、益腰身、大捕元气。"
