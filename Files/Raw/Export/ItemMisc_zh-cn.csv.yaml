- raw: "Misc/Name/4102,穿心龙胆汤"
  splits:
  - split: 1
    text: "穿心龙胆汤"
- raw: "Misc/Desc/4102,用穿心莲、龙胆等药草熬汁炖煮的汤药，其苦非常人之所能受，药性之重业已成毒，常人服之心悸头疼，唐门弟子服之清热解渴。"
  splits:
  - split: 1
    text: "用穿心莲、龙胆等药草熬汁炖煮的汤药，其苦非常人之所能受，药性之重业已成毒，常人服之心悸头疼，唐门弟子服之清热解渴。"
- raw: "Misc/Name/4103,胡椒粉丸"
  splits:
  - split: 1
    text: "胡椒粉丸"
- raw: "Misc/Desc/4103,把胡椒粉跟山药泥混在一起，炙烤成丸。有毒，但是好吃。"
  splits:
  - split: 1
    text: "把胡椒粉跟山药泥混在一起，炙烤成丸。有毒，但是好吃。"
