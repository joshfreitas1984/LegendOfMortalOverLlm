  splits:
  - split: 1
    text: "龙象豹力子丹"
- raw: "Misc/Desc/4001,崆峒铁拳门秘传灵药「龙象豹力丹」，传说服之能生龙象之力，开天辟地。\\n这枚是炉底残渣搓成的子丹，母丹被小竹吃了。"
