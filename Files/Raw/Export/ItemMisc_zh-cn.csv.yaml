    template: "{0}\\n{1}"
- raw: "Misc/Name/4106,万灵油"
  splits:
  - split: 1
    text: "万灵油"
- raw: "Misc/Desc/4106,唐门药典残方，出门必备灵药。\\n气味清凉，嗅之可提神醒脑，夏可解暑、冬可点燃取暖，兑水喝可以治腹泻，抹在腕上可防蛇虺蚊蚋。\\n天下疑难，此方解得十之八九。"
  splits:
  - split: 1
    text: "唐门药典残方，出门必备灵药。"
  - split: 1
    subIndex: 1
    text: "气味清凉，嗅之可提神醒脑，夏可解暑、冬可点燃取暖，兑水喝可以治腹泻，抹在腕上可防蛇虺蚊蚋。"
