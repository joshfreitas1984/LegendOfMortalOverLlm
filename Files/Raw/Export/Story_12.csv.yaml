- raw: "Story/N_8_1_1_1_013,你怅然若失，借酒消愁，总是不信那些仇人都如此命短，锲而不舍的追查，找到了退隐江湖的仇家。见他们都能全身而退，含饴弄孙，静享天伦之乐，你便恨的咬牙切齿。"
