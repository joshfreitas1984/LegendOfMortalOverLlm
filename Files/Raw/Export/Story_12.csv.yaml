- raw: "Story/N_8_1_1_1_010,此去经年，夏侯兰诞下一子一女，万幸子女都像她不像你。你老是敦促两个孩子练功，将来随爹报仇雪恨，夏侯兰虽有微词，却还是让着你居多。"
