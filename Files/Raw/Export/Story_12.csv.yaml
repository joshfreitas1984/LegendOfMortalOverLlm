    text: "最终你长叹一声，轻抚儿女头顶，一手一个，牵回家中。儿女受宠若惊，夏侯兰见你放下心头仇恨，也不胜之喜。那晚下厨，做了很多饭菜，替你斟酒，有一搭没一搭说着从前旧事。"
