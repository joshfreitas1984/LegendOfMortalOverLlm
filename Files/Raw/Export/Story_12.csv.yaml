- raw: "Story/N_8_2_6_6_1_025,三十年后，你神功大成，身兼雪山、夺魄、唐门三家之所长，自信比之当年叱咤风云的任何一位高手都不会逊色。于是带着子女下山，准备报仇雪恨。"
