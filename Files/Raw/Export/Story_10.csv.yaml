  - split: 1
    text: "天下有道，则礼乐征伐自天子出；天下无道，则礼乐征伐自诸侯出。自诸侯出，盖十世希不失矣；自大夫出，五世希不失矣；陪臣执国命，三世希不失矣。"
- raw: "Story/D_7_2_4_005,天下有道，则政不在大夫。天下有道，则庶人不议。官家培植武林盟，以为驱虎吞狼，实则因小失大。下交权柄，是昏聩误国的劣策，是以我妇人之见，以为愚不可及。"
