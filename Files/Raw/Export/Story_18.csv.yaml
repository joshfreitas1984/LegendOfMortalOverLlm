    text: "改公主为帝姬、郡主为宗姬、县主为族姬。其称大长者，为大长帝姬，仍以美名二字易其国号，内两国者以四字。"
- raw: "Story/D_S2321_04_02_06_016,及后靖康之难，二帝被掳，国破家亡，遂废此称。后来高宗皇帝南渡，于应天府即位，才复旧制。"
